<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Крутящийся круг</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #181818;
        }

        .circle {
            width: 500px;
            height: 500px;
            border-radius: 50%;

            border: 10px solid transparent;

            background:
                linear-gradient(#181818, #181818) padding-box,
                conic-gradient(
                    from 30deg,
                    transparent 0deg 35deg,
                    #1473e6 35deg 330deg,
                    transparent 330deg 360deg
                ) border-box;

            box-shadow:
                0 0 8px rgba(20, 115, 230, 0.8),
                0 0 20px rgba(20, 115, 230, 0.4);

            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 600px) {
            .circle {
                width: 80vw;
                height: 80vw;
                border-width: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="circle"></div>

</body>
</html>
