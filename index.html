<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реалистичная 3D Ракета</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1600px;
            overflow: hidden;
        }

        .scene {
            position: relative;
            width: 400px;
            height: 200px;
            transform-style: preserve-3d;
            animation: spin360 15s linear infinite;
        }

        @keyframes spin360 {
            0% { transform: rotateX(15deg) rotateY(0deg); }
            100% { transform: rotateX(15deg) rotateY(360deg); }
        }

        /* Базовая обертка для 3D-частей */
        .part {
            position: absolute;
            transform-style: preserve-3d;
            left: 50%;
            top: 50%;
        }

        /* ================= КОРПУС (ЦИЛИНДР) ================= */
        .cylinder {
            width: 180px;
            height: 120px;
            transform: translate(-50%, -50%);
        }

        .face {
            position: absolute;
            width: 180px;
            height: 120px;
            background: linear-gradient(180deg, #ffffff 0%, #e8e8e8 50%, #c0c0c0 100%);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.15);
        }

        /* 8 граней для плавного объема */
        .face1 { transform: translateZ(30px); }
        .face2 { transform: translateZ(-30px); }
        .face3 { transform: rotateY(45deg) translateZ(30px); width: 60px; background: #dcdcdc; }
        .face4 { transform: rotateY(45deg) translateZ(-30px); width: 60px; background: #dcdcdc; }
        .face5 { transform: rotateY(90deg) translateZ(30px); width: 60px; background: #cfcfcf; }
        .face6 { transform: rotateY(90deg) translateZ(-30px); width: 60px; background: #cfcfcf; }
        .face7 { transform: rotateX(90deg) translateZ(30px); height: 60px; background: #ffffff; }
        .face8 { transform: rotateX(90deg) translateZ(-30px); height: 60px; background: #a0a0a0; }

        /* ================= КРЫША (КОНУС) ================= */
        .roof-group {
            transform: translate(-50%, -50%) translateX(90px) rotateY(90deg);
            width: 120px;
            height: 120px;
            transform-style: preserve-3d;
        }

        .roof-cone {
            position: absolute;
            top: 0;
            left: 0;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 35% 35%, #ff6666 0%, #d32f2f 55%, #8e0000 100%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            transform: translateX(-10px);
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
        }

        /* Кольцо-переходник */
        .connection-ring {
            position: absolute;
            width: 15px;
            height: 100px;
            background: linear-gradient(to right, #888, #ccc, #888);
            border-radius: 7px;
            transform: translate(-50%, -50%) translateX(84px) rotateY(90deg);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* ================= ИЛЛЮМИНАТОРЫ ================= */
        /* Передний */
        .window-front-group {
            transform: translate(-50%, -50%) translateX(35px);
            transform-style: preserve-3d;
        }

        .window-front-outer {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff3333, #990000);
            border-radius: 50%;
            transform: translate(-50%, -50%) translateZ(31px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .window-front-inner {
            position: absolute;
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 30% 30%, #00cfff 0%, #005ba3 70%, #001a33 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%) translateZ(32px);
            box-shadow: inset 0 0 15px rgba(255,255,255,0.3), 0 0 25px rgba(0, 150, 255, 0.9);
        }

        /* Задний */
        .window-back-group {
            transform: translate(-50%, -50%) translateX(35px);
            transform-style: preserve-3d;
        }

        .window-back-outer {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff3333, #990000);
            border-radius: 50%;
            transform: translate(-50%, -50%) translateZ(-31px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .window-back-inner {
            position: absolute;
            width: 45px;
            height: 45px;
            background: radial-gradient(circle at 30% 30%, #00cfff 0%, #005ba3 70%, #001a33 100%);
            border-radius: 50%;
            transform: translate(-50%, -50%) translateZ(-32px);
            box-shadow: inset 0 0 15px rgba(255,255,255,0.3), 0 0 25px rgba(0, 150, 255, 0.9);
        }

        /* ================= ДВИГАТЕЛЬ СЗАДИ ================= */
        .engine-group {
            transform: translate(-50%, -50%) translateX(-95px) rotateY(90deg);
            width: 50px;
            height: 70px;
            transform-style: preserve-3d;
        }

        .engine-base {
            position: absolute;
            width: 60px;
            height: 50px;
            background: linear-gradient(to bottom, #555, #222);
            border-radius: 10px;
            transform: translate(-50%, -50%);
            box-shadow: inset 0 0 10px #000;
        }

        .engine-nozzle {
            position: absolute;
            width: 40px;
            height: 30px;
            background: linear-gradient(to bottom, #444, #111, #333);
            border-radius: 0 0 15px 15px;
            transform: translate(-50%, 50%);
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }

        .engine-fire {
            position: absolute;
            width: 20px;
            height: 35px;
            background: radial-gradient(circle at bottom, #ffcc00 0%, #ff6600 60%, transparent 100%);
            border-radius: 50% 50% 50% 50%;
            transform: translate(-50%, 100%);
            box-shadow: 0 0 30px #ff6600;
            animation: flicker 0.2s infinite alternate;
        }

        @keyframes flicker {
            0% { transform: translate(-50%, 100%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, 100%) scale(1.2); opacity: 0.8; }
        }

        /* ================= НОЖКИ (ОПОРЫ) ================= */
        .leg-group {
            transform-style: preserve-3d;
        }

        .leg-left {
            transform: translate(-50%, -50%) translate(-40px, 50px) rotate(30deg);
        }

        .leg-right {
            transform: translate(-50%, -50%) translate(-40px, -50px) rotate(-30deg);
        }

        .leg {
            position: relative;
            width: 15px;
            height: 60px;
            background: linear-gradient(to bottom, #888, #555);
            border-radius: 5px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }

        .leg-foot {
            position: absolute;
            bottom: -10px;
            left: -5px;
            width: 25px;
            height: 10px;
            background: linear-gradient(to bottom, #333, #111);
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        /* ================= ВИЗУАЛЬНЫЕ ЭФФЕКТЫ ================= */
        .glow-front {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.5) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%) translateX(35px) translateZ(32px);
            pointer-events: none;
        }

        .glow-back {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.5) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%) translateX(35px) translateZ(-32px);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="scene">
        
        <!-- Цилиндрический корпус -->
        <div class="part cylinder">
            <div class="face face1"></div>
            <div class="face face2"></div>
            <div class="face face3"></div>
            <div class="face face4"></div>
            <div class="face face5"></div>
            <div class="face face6"></div>
            <div class="face face7"></div>
            <div class="face face8"></div>
        </div>

        <!-- Треугольная крыша (Конус) -->
        <div class="part roof-group">
            <div class="roof-cone"></div>
        </div>

        <!-- Кольцо соединения -->
        <div class="part connection-ring"></div>

        <!-- Передний иллюминатор -->
        <div class="part window-front-group">
            <div class="window-front-outer"></div>
            <div class="window-front-inner"></div>
        </div>

        <!-- Задний иллюминатор -->
        <div class="part window-back-group">
            <div class="window-back-outer"></div>
            <div class="window-back-inner"></div>
        </div>

        <!-- Двигатель сзади -->
        <div class="part engine-group">
            <div class="engine-base"></div>
            <div class="engine-nozzle"></div>
            <div class="engine-fire"></div>
        </div>

        <!-- Ножки (опоры) -->
        <div class="part leg-group">
            <div class="leg-left">
                <div class="leg">
                    <div class="leg-foot"></div>
                </div>
            </div>
            <div class="leg-right">
                <div class="leg">
                    <div class="leg-foot"></div>
                </div>
            </div>
        </div>

        <!-- Эффекты свечения иллюминаторов -->
        <div class="part glow-front"></div>
        <div class="part glow-back"></div>

    </div>

</body>
</html>
