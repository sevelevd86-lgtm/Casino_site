<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cases</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:#080b12;font-family:Arial,sans-serif;color:#fff}
body{overflow-x:hidden}
#casesGameContainer{min-height:100vh;padding:16px 14px 40px;background:radial-gradient(circle at 50% -10%,rgba(110,80,255,.22),transparent 38%),linear-gradient(160deg,#090c14,#101522,#080b12)}
.topbar{height:52px;display:flex;justify-content:flex-end;align-items:center}
.balance-case{padding:10px 16px;border-radius:14px;background:#171d2a;border:1px solid rgba(255,255,255,.08);font-size:18px;font-weight:900;box-shadow:0 8px 25px rgba(0,0,0,.3)}
.balance-case span{color:#ffd84d}
.screen-case{display:none;width:100%;min-height:calc(100vh - 70px)}
.screen-case.active{display:flex}
.main-screen{flex-direction:column;align-items:center;padding-top:18px;gap:16px}
.main-title{font-size:28px;font-weight:1000;letter-spacing:3px;margin-bottom:4px}
/* =====================================================
   CASE FREE — исходная картинка занимает весь баннер.
   Белое поле исходного холста обрезается контейнером CSS.
===================================================== */
.free-case-card{width:min(900px,96vw);display:flex;flex-direction:column;align-items:stretch}
.free-case-image-button{position:relative;z-index:2;touch-action:manipulation;width:100%;height:235px;border:0;border-radius:24px;padding:0;background:transparent;overflow:hidden;cursor:pointer;display:block;box-shadow:0 16px 35px rgba(0,0,0,.42);transition:transform .15s ease}
.free-image-wrap{position:relative;width:100%;height:100%;overflow:hidden;background:transparent}
.free-case-image{position:absolute;inset:0;width:100%;height:100%;max-width:none;display:block;object-fit:fill;object-position:center center;user-select:none;pointer-events:none}
.free-case-image-button:active{transform:scale(.985)}
.free-status{position:relative;z-index:3;touch-action:manipulation;width:88%;align-self:center;margin-top:10px;padding:11px 12px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:linear-gradient(135deg,#28bd9c,#14866f);color:#fff;font-size:14px;font-weight:1000;cursor:pointer;box-shadow:0 8px 20px rgba(20,134,111,.22)}
.free-status.cooldown{background:#182b38;color:#91d7ff;border-color:rgba(117,200,255,.25)}
.free-status:active{transform:scale(.98)}

/* =====================================================
   PLS PEPE — баннер-картинка вместо обычной карточки.
   Само изображение не перехватывает нажатия.
===================================================== */
.pls-pepe-card{
    width:min(900px,96vw);
    display:flex;
    flex-direction:column;
    align-items:stretch;
}
.pls-pepe-image-button{
    position:relative;
    z-index:2;
    touch-action:manipulation;
    width:100%;
    aspect-ratio:1477/457;
    border:0;
    border-radius:24px;
    padding:0;
    background:transparent;
    overflow:hidden;
    cursor:pointer;
    display:block;
    box-shadow:0 16px 35px rgba(0,0,0,.42);
    transition:transform .15s ease;
}
.pls-pepe-image-wrap{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    background:transparent;
}
.pls-pepe-case-image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    max-width:none;
    display:block;
    object-fit:fill;
    object-position:center center;
    user-select:none;
    pointer-events:none;
}
.pls-pepe-image-button:active{
    transform:scale(.985);
}

.main-case-button{position:relative;z-index:2;touch-action:manipulation;width:min(430px,94vw);height:100px;border-radius:20px;border:1px solid rgba(255,255,255,.1);color:#fff;cursor:pointer;display:flex;align-items:center;padding:0 18px;text-align:left;box-shadow:0 12px 35px rgba(0,0,0,.3);transition:transform .15s ease,border-color .15s ease}
.main-case-button:active{transform:scale(.98)}
.case-icon{width:62px;flex-shrink:0;font-size:30px;text-align:center}
.case-name{font-size:20px;font-weight:1000}
.case-description{display:block;color:#aeb8ca;margin-top:6px;font-size:12px;font-weight:700}
.pls-pepe-button{background:linear-gradient(135deg,#183e3c,#0b2427)}
.case-50-button{background:linear-gradient(135deg,#3b3018,#211b0e)}
.case-250-button{background:linear-gradient(135deg,#38245c,#1e1533)}
.case-screen{flex-direction:column;padding-top:8px}
.case-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.case-title{font-size:24px;font-weight:1000}
.back-case{padding:10px 14px;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:#171d2a;color:#c4cada;font-weight:800;cursor:pointer}
.roulette-section{position:relative;width:100%}
.pointer-case{position:absolute;top:-1px;left:50%;transform:translateX(-50%);z-index:10;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:25px solid #a78bfa;filter:drop-shadow(0 0 8px rgba(167,139,250,.7))}
.roulette-window{width:100%;height:160px;overflow:hidden;border-radius:17px;background:#0d121e;border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
.roulette-track{height:100%;display:flex;align-items:center;gap:10px;padding:10px;transform:translateX(0)}
.roulette-item{min-width:125px;height:125px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;background:#171d2a;border:1px solid rgba(255,255,255,.08);text-align:center}
.roulette-emoji{font-size:44px}.roulette-name{margin-top:8px;padding:0 5px;font-size:11px;font-weight:800;color:#b8c2d4}
.open-button{width:100%;margin-top:17px;padding:17px;border:0;border-radius:15px;background:linear-gradient(135deg,#7957ff,#5332d6);color:#fff;font-size:18px;font-weight:1000;cursor:pointer;box-shadow:0 10px 30px rgba(110,80,255,.2)}
.open-button.free-open{background:linear-gradient(135deg,#28bd9c,#14866f)}.open-button:active{transform:scale(.98)}.open-button:disabled{opacity:.5;cursor:not-allowed}
.items-title{margin:27px 0 13px;text-align:center;font-size:18px;font-weight:1000;color:#e5e9f2}
.items-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.item-card{min-height:125px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:14px;background:#141a27;border:1px solid rgba(255,255,255,.07)}
.item-emoji{font-size:38px;line-height:1}.item-name{margin-top:9px;font-size:11px;font-weight:800;color:#aeb8ca;line-height:1.25}.item-price{margin-top:7px;color:#ffd84d;font-size:13px;font-weight:1000}
.legendary{border-color:rgba(255,215,70,.5)}.rare{border-color:rgba(100,150,255,.4)}.uncommon{border-color:rgba(60,190,165,.35)}
.modal-case{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.8)}.modal-case.show{display:flex}
.modal-box-case{width:100%;max-width:360px;padding:28px 20px 23px;text-align:center;border-radius:23px;background:linear-gradient(145deg,#1a2131,#0d121e);border:1px solid rgba(255,255,255,.1);box-shadow:0 25px 90px rgba(0,0,0,.65)}
.result-emoji-case{font-size:78px;margin-bottom:12px}.result-label-case{color:#8e99ad;font-size:13px;font-weight:800;letter-spacing:1px}.result-name-case{margin-top:8px;font-size:25px;font-weight:1000}.result-value-case{margin-top:12px;font-size:24px;color:#a78bfa;font-weight:1000}
.result-buttons{display:flex;gap:10px;margin-top:23px}.result-button{flex:1;padding:14px 8px;border:0;border-radius:13px;color:#fff;font-weight:900;cursor:pointer}.sell-button{background:linear-gradient(135deg,#7957ff,#5332d6)}.back-result-button{background:#1b2232;color:#aeb8ca}
.message-case{position:fixed;left:50%;bottom:25px;z-index:300;transform:translateX(-50%) translateY(100px);padding:13px 18px;border-radius:13px;background:#d24761;color:#fff;font-weight:800;text-align:center;transition:.3s ease;max-width:90vw}.message-case.show{transform:translateX(-50%) translateY(0)}
@media(max-width:500px){#casesGameContainer{padding:12px 10px 30px}.main-title{font-size:25px}.free-case-card{width:100%}.free-case-image-button{height:clamp(110px,25vw,175px);border-radius:18px}.main-case-button{width:100%;height:98px}.case-title{font-size:20px}}

@media (max-width:500px){
    .pls-pepe-card{width:100%}
    .pls-pepe-image-button{border-radius:19px}
}
@media (max-width:380px){
    .pls-pepe-image-button{border-radius:17px}
}
</style>
</head>
