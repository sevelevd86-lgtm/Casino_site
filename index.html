<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вращающаяся 3D Ракета</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
            overflow: hidden;
        }

        /* Сцена с ракетой */
        .scene {
            position: relative;
            width: 300px;
            height: 150px;
            transform-style: preserve-3d;
            /* Основная анимация: полное вращение на 360 градусов по оси Y, 
               с небольшим наклоном по X (чтобы видеть верх и низ) */
            animation: spin360 12s linear infinite;
        }

        /* Вращение по часовой стрелке */
        @keyframes spin360 {
            0% { transform: rotateX(15deg) rotateY(0deg); }
            100% { transform: rotateX(15deg) rotateY(360deg); }
        }

        /* ВСЕ ОБЪЕМНЫЕ ЧАСТИ */
        .part {
            position: absolute;
            transform-style: preserve-3d;
            left: 50%;
            top: 50%;
        }

        /* БЕЛЫЙ КОРПУС (Цилиндр из 6 граней) */
        .cylinder {
            width: 140px;
            height: 90px;
            transform: translate(-50%, -50%) translateX(-10px);
        }
        
        .face {
            position: absolute;
            width: 140px;
            height: 90px;
            background: linear-gradient(to bottom, #ffffff, #d9d9d9);
            border-radius: 10px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }
        
        /* 6 граней цилиндра для создания объема */
        .face1 { transform: translateZ(20px); }
        .face2 { transform: translateZ(-20px); }
        .face3 { transform: rotateY(90deg) translateZ(20px); width: 40px; background: #cfcfcf; }
        .face4 { transform: rotateY(90deg) translateZ(-20px); width: 40px; background: #cfcfcf; }
        .face5 { transform: rotateX(90deg) translateZ(20px); height: 40px; background: #eee; }
        .face6 { transform: rotateX(90deg) translateZ(-20px); height: 40px; background: #999; }

        /* КРАСНЫЙ НОС (Конус) */
        .cone-group {
            transform: translate(-50%, -50%) translateX(70px) rotateY(90deg);
            width: 90px;
            height: 90px;
        }

        .cone {
            position: absolute;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000);
            border-radius: 50% 50% 0 0;
            clip-path: polygon(50% 100%, 0% 0%, 100% 0%);
            transform: translateX(-20px);
        }
        
        /* Кольцо между корпусом и носом */
        .ring {
            position: absolute;
            width: 10px;
            height: 100px;
            background: #808080;
            border-radius: 5px;
            transform: translate(-50%, -50%) translateX(55px) rotateY(90deg);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* ИЛЛЮМИНАТОР (Выпуклая линза) */
        .window-group {
            transform: translate(-50%, -50%) translateX(15px);
            transform-style: preserve-3d;
        }
        
        .window-outer {
            position: absolute;
            width: 50px;
            height: 50px;
            background: #ff3333;
            border-radius: 50%;
            transform: translate(-50%, -50%) translateZ(21px);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        
        .window-inner {
            position: absolute;
            width: 36px;
            height: 36px;
            background: radial-gradient(circle at 35% 35%, #00ccff, #003366);
            border-radius: 50%;
            transform: translate(-50%, -50%) translateZ(23px);
            box-shadow: 
                inset 0 0 10px rgba(255,255,255,0.3),
                0 0 20px rgba(0, 150, 255, 0.8);
        }

        /* ЗАДНИЕ СТАБИЛИЗАТОРЫ */
        .fin-left {
            transform: translate(-50%, -50%) translate(-60px, -40px) rotate(35deg);
        }

        .fin-right {
            transform: translate(-50%, -50%) translate(-60px, 40px) rotate(-35deg);
        }

        .fin {
            width: 30px;
            height: 40px;
            background: linear-gradient(135deg, #ff4d4d, #990000);
            border-radius: 5px 0 0 5px;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.3);
        }

        /* ЗАДНИЙ ВЫХЛОП (Сопло) */
        .exhaust-group {
            transform: translate(-50%, -50%) translateX(-75px) rotateY(90deg);
        }

        .nozzle-body {
            width: 30px;
            height: 20px;
            background: linear-gradient(to right, #333, #666, #333);
            border-radius: 0 0 5px 5px;
            transform: translate(-50%, -50%);
            box-shadow: 0 5px 10px rgba(0,0,0,0.4);
        }

        /* Труба (красный стержень) */
        .rod {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ff3333;
            border-radius: 50%;
            transform: translate(-50%, -50%) translate(-70px, 0);
            box-shadow: 0 0 5px rgba(255, 50, 50, 0.8);
        }

        /* ВИЗУАЛЬНОЕ СВЕЧЕНИЕ ОТ ИЛЛЮМИНАТОРА */
        .glow {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(0, 200, 255, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            transform: translate(-50%, -50%) translateX(15px) translateZ(24px);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- Корпус -->
        <div class="part cylinder">
            <div class="face face1"></div>
            <div class="face face2"></div>
            <div class="face face3"></div>
            <div class="face face4"></div>
            <div class="face face5"></div>
            <div class="face face6"></div>
        </div>

        <!-- Нос -->
        <div class="part cone-group">
            <div class="cone"></div>
        </div>

        <!-- Кольцо -->
        <div class="part ring"></div>

        <!-- Иллюминатор -->
        <div class="part window-group">
            <div class="window-outer"></div>
            <div class="window-inner"></div>
        </div>

        <!-- Стабилизаторы -->
        <div class="part fin-left">
            <div class="fin"></div>
        </div>
        <div class="part fin-right">
            <div class="fin"></div>
        </div>

        <!-- Сопло -->
        <div class="part exhaust-group">
            <div class="nozzle-body"></div>
        </div>

        <!-- Труба -->
        <div class="part rod"></div>

        <!-- Свечение -->
        <div class="part glow"></div>
    </div>

</body>
</html>
