<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Круг</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#888; /* серый фон */
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            overflow:hidden;
        }
        
        /* ===== КРУГ (СИНИЙ, КАК НА СКРИНЕ) ===== */
        .circle-wrapper{
            position:relative;
            width:200px;
            height:200px;
            border-radius:50%;
            background:rgba(30,80,160,0.2); /* лёгкий синий фон */
            border:3px solid rgba(30,80,160,0.5); /* синяя обводка */
            box-shadow:0 0 30px rgba(30,80,160,0.1);
            animation:spin 4s linear infinite;
            overflow:hidden;
        }
        
        .circle{
            width:100%;
            height:100%;
            border-radius:50%;
            background:rgba(30,80,160,0.05); /* едва заметный синий */
        }
        
        /* ===== ДЫРКА (КАК НА СКРИНЕ) ===== */
        .hole{
            position:absolute;
            bottom:-2px;
            left:50%;
            transform:translateX(-50%);
            width:28px;
            height:8px;
            background:#0a0a0f;
            border-radius:0 0 50% 50% / 0 0 100% 100%;
            border-bottom:2px solid rgba(30,80,160,0.1);
            box-shadow:inset 0 -4px 8px rgba(0,0,0,0.6);
            z-index:2;
        }
        .hole::before{
            content:'';
            position:absolute;
            top:-2px;
            left:-4px;
            right:-4px;
            height:6px;
            background:#0a0a0f;
            border-radius:50%;
        }
        
        @keyframes spin{
            0%{transform:rotate(0deg)}
            100%{transform:rotate(360deg)}
        }
    </style>
</head>
<body>
    <div class="circle-wrapper">
        <div class="circle"></div>
        <div class="hole"></div>
    </div>
</body>
</html>
