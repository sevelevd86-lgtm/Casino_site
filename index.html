===================================================== */

    const savedBalance = localStorage.getItem("cases_balance");
    window.balance = savedBalance !== null ? Number(savedBalance) : 1000;
}

function saveBalanceCase() {
    localStorage.setItem("cases_balance", String(window.balance));
}

function updateBalanceCase() {
    const element = document.getElementById("balanceCase");
    if (!element) return;
    element.textContent = Number(window.balance).toFixed(2);
    saveBalanceCase();
    if (typeof window.updateBalanceUI === "function") {
        try { window.updateBalanceUI(); } catch (error) {}
    }
}

===================================================== */
if (!Array.isArray(window.caseInventory)) {
    try {
        const savedInventory = localStorage.getItem("case_inventory");

    } catch (error) {
        window.caseInventory = [];
    }
}

function saveInventoryCase() {
    try {
        localStorage.setItem("case_inventory", JSON.stringify(window.caseInventory));

/* =====================================================
   FREE CASE
===================================================== */
const FREE_COOLDOWN = 24 * 60 * 60 * 1000;
const FREE_COOLDOWN_KEY = "case_free_last_open";

function getFreeLastOpen() {
    const value = localStorage.getItem(FREE_COOLDOWN_KEY);
    if (!value) return 0;
    const number = Number(value);
    return Number.isFinite(number) ? number : 0;
}

function canOpenFreeCase() {
    return Date.now() - getFreeLastOpen() >= FREE_COOLDOWN;
}

function setFreeCooldown() {
    localStorage.setItem(FREE_COOLDOWN_KEY, String(Date.now()));
    updateFreeButton();
}

function updateFreeButton() {
    const remaining = FREE_COOLDOWN - (Date.now() - getFreeLastOpen());
    if (remaining <= 0) {
        freeCaseBox.classList.remove("disabled");
        freeTimer.textContent = "ГОТОВ К ОТКРЫТИЮ";
        return;
    }
    freeCaseBox.classList.add("disabled");
    freeTimer.textContent = formatTimeCase(remaining);
}

function formatTimeCase(milliseconds) {
    let totalSeconds = Math.ceil(milliseconds / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    totalSeconds %= 3600;
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    return String(hours).padStart(2, "0") + ":" + String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
}

function renderItemsCase(sourceItems) {
    itemsGrid.innerHTML = "";
    const sortedItems = [...sourceItems].sort((a, b) => b.value - a.value);
    sortedItems.forEach(item => {
        const card = document.createElement("div");
        card.className = `item-card ${item.rarity}`;
        card.innerHTML = `<div class="item-emoji">${item.emoji}</div><div class="item-name">${item.name}</div><div class="item-price">+${item.value} ⭐</div>`;
        itemsGrid.appendChild(card);
    });
}

/* =====================================================
   РАНДОМ
===================================================== */
function getRandomItemCase(sourceItems) {
    const random = Math.random() * 100;
    let accumulated = 0;
    for (const item of sourceItems) {
        accumulated += item.chance;
        if (random < accumulated) return item;
    }
    return sourceItems[sourceItems.length - 1];
}

===================================================== */

    const element = document.createElement("div");
    element.className = `roulette-item ${item.rarity}`;
    element.innerHTML = `<div class="roulette-emoji">${item.emoji}</div><div class="roulette-name">${item.name}</div>`;
    return element;
}

function resetRouletteCase(sourceItems = itemsCase) {
    rouletteTrack.style.transition = "none";
    rouletteTrack.style.transform = "translateX(0px)";
    rouletteTrack.innerHTML = "";
    for (let i = 0; i < 18; i++) {
        const randomItem = sourceItems[Math.floor(Math.random() * sourceItems.length)];
        rouletteTrack.appendChild(createRouletteCardCase(randomItem));
    }
}

/* =====================================================
   ЗАПУСК РУЛЕТКИ
===================================================== */
function startRouletteCase(sourceItems, winner) {
    rouletteTrack.style.transition = "none";
    rouletteTrack.style.transform = "translateX(0px)";
    rouletteTrack.innerHTML = "";
    const totalCards = 45;
    const winnerIndex = 36;
    for (let i = 0; i < totalCards; i++) {
        let item;
        if (i === winnerIndex) {
            item = winner;
        } else {
            item = sourceItems[Math.floor(Math.random() * sourceItems.length)];
        }
        rouletteTrack.appendChild(createRouletteCardCase(item));
    }
    const cardWidth = 135;
    const windowWidth = rouletteTrack.parentElement.offsetWidth;
    const centerOffset = windowWidth / 2 - 62.5;
    const stopPosition = -(winnerIndex * cardWidth - centerOffset);
    const finalPosition = stopPosition + (Math.random() * 30 - 15);
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            rouletteTrack.style.transition = "transform 6.5s cubic-bezier(.08,.72,.05,1)";
            rouletteTrack.style.transform = `translateX(${finalPosition}px)`;
        });
    });
    setTimeout(() => {
        showResultCase(winner);
        isOpeningCase = false;
        openButton.disabled = false;
    }, 6800);
}

/* =====================================================
   ЗВУК
===================================================== */
let audioContextCase = null;

function getAudioContextCase() {
    try {
        if (!audioContextCase) {
            audioContextCase = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContextCase.state === "suspended") {
            audioContextCase.resume();
        }
        return audioContextCase;
    } catch (error) {
        return null;
    }
}

function playClickSoundCase() {
    const ctx = getAudioContextCase();
    if (!ctx) return;
    try {
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();
        oscillator.type = "square";
        oscillator.frequency.setValueAtTime(180, ctx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
        oscillator.connect(gain);
        gain.connect(ctx.destination);
        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.1);
    } catch (error) {}
}

function playWinSoundCase() {
    const ctx = getAudioContextCase();
    if (!ctx) return;
    try {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((frequency, index) => {
            const oscillator = ctx.createOscillator();
            const gain = ctx.createGain();
            const start = ctx.currentTime + index * 0.1;
            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(frequency, start);
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(0.12, start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
            oscillator.connect(gain);
            gain.connect(ctx.destination);
            oscillator.start(start);
            oscillator.stop(start + 0.4);
        });
    } catch (error) {}
}
