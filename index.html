<style>
* {

    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;

html,
body {
    width: 100%;
    min-height: 100%;
    background: #090b10;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    overflow-x: hidden;
}

button {
    font: inherit;
}

.app {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    padding: 18px 14px 35px;
}

/* =========================
   HEADER
========================= */

.topbar {
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
}

.balance {
    padding: 11px 17px;
    border-radius: 14px;
    background: #121722;
    border: 1px solid #273144;
    font-size: 20px;
    font-weight: 900;
    box-shadow: 0 0 25px rgba(0, 153, 255, 0.08);
}

.balance span {
    color: #ffd84d;
}

/* =========================
   SCREENS
========================= */

.screen {
    display: none;
    min-height: calc(100vh - 73px);
}

.screen.active {
    display: flex;
    flex-direction: column;
}

/* =========================
   MAIN SCREEN
========================= */

.main-screen {
    justify-content: center;
    align-items: center;
    padding-bottom: 80px;
    gap: 25px;
}

/* =========================
   MAIN CASE BUTTONS
========================= */

.main-case-button {
    width: min(330px, 85vw);
    height: 190px;
    border-radius: 25px;
    cursor: pointer;
    border: 2px solid #349cff;
    background:
        linear-gradient(135deg, #176ed0, #0b326e 55%, #071a3d);
    color: white;
    font-size: 36px;
    font-weight: 1000;
    letter-spacing: 1px;
    box-shadow:
        0 25px 70px rgba(0, 90, 255, 0.35),
        inset 0 2px 0 rgba(255,255,255,0.25);
    position: relative;
    animation: floatCase 2.5s ease-in-out infinite;
    transition: 0.2s ease;
}

.main-case-button::before {
    content: "";
    position: absolute;
    left: -8px;
    right: -8px;
    top: 35px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(180deg, #4db4ff, #1267c7);
    border: 2px solid #71c4ff;
    box-shadow: 0 5px 20px rgba(0, 140, 255, 0.5);
}

.main-case-button span {
    position: relative;
    z-index: 2;
    text-shadow: 0 4px 15px rgba(0,0,0,0.7);
}

.main-case-button:active {
    transform: scale(0.96);
}

/* FREE CASE */

.free-case-button {
    border-color: #27d878;
    background:
        linear-gradient(135deg, #159957, #07552f 55%, #03291b);

    box-shadow:
        0 25px 70px rgba(39, 216, 120, 0.25),
        inset 0 2px 0 rgba(255,255,255,0.25);
}

.free-case-button::before {
    background: linear-gradient(180deg, #49ed91, #139452);
    border-color: #74ffac;
    box-shadow: 0 5px 20px rgba(39, 216, 120, 0.45);
}

.free-case-button.disabled {
    opacity: 0.45;
    filter: grayscale(0.5);
    cursor: default;
}

.free-case-button.disabled:active {
    transform: none;
}

.free-timer {
    position: absolute;
    z-index: 3;
    left: 0;
    right: 0;
    bottom: 13px;
    text-align: center;
    color: #b8ffd1;
    font-size: 13px;
    font-weight: 900;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
}

@keyframes floatCase {
    0%, 100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-12px);
    }
}

/* =========================
   CASE SCREEN
========================= */

.case-screen {
    padding-top: 8px;
}

.case-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 8px 2px 20px;
}

.case-title {
    font-size: 24px;
    font-weight: 1000;
}

.back {
    border: none;
    background: #161b25;
    color: white;
    padding: 10px 14px;
    border-radius: 11px;
    cursor: pointer;
    font-weight: 800;
}

/* =========================
   ROULETTE
========================= */

.roulette-section {
    position: relative;
    margin-top: 5px;
}

.pointer {
    position: absolute;
    top: -1px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 25px solid #ffd84d;
    filter: drop-shadow(0 0 8px rgba(255,216,77,0.7));
}

.roulette-window {
    width: 100%;
    height: 160px;
    overflow: hidden;
    border-radius: 17px;
    border: 1px solid #283244;
    background: #0d1119;
    position: relative;
    box-shadow:
        inset 0 0 40px rgba(0,0,0,0.7),
        0 15px 45px rgba(0,0,0,0.3);
}

.roulette-track {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    transform: translateX(0);
    will-change: transform;
}

.roulette-item {
    min-width: 125px;
    height: 125px;
    border-radius: 14px;
    background: linear-gradient(145deg, #1c2431, #10151e);
    border: 1px solid #2d3a4d;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.roulette-emoji {
    font-size: 48px;
}

.roulette-name {
    margin-top: 8px;
    padding: 0 5px;
    text-align: center;
    font-size: 11px;
    font-weight: 800;
    color: #d9dfe8;
}

/* =========================
   OPEN BUTTON
========================= */

.open-button {
    width: 100%;
    margin-top: 17px;
    padding: 17px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    background: linear-gradient(135deg, #147ee8, #1aa0ff);
    color: white;
    font-size: 18px;
    font-weight: 1000;
    box-shadow: 0 8px 30px rgba(20,126,232,0.3);
    transition: 0.2s ease;
}

.open-button.free-open {
    background: linear-gradient(135deg, #18a95a, #27d878);
    box-shadow: 0 8px 30px rgba(39,216,120,0.25);
}

.open-button:active {
    transform: scale(0.98);
}

.open-button:disabled {
    cursor: default;
    opacity: 0.55;
}

/* =========================
   ITEMS
========================= */

.items-title {
    margin: 27px 0 13px;
    text-align: center;
    font-size: 19px;
    font-weight: 900;
}

.items-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
}

.item-card {
    min-height: 125px;
    padding: 10px 6px;
    border-radius: 14px;
    background: linear-gradient(145deg, #141922, #0e1219);
    border: 1px solid #242d3b;

    flex-direction: column;
    align-items: center;

}

.item-card:hover {

.item-emoji {

.item-name {

.item-price {

.rare {

}

.uncommon {
    border-color: #2f9cff;
}

.free-rarity {
    border-color: #27d878;

/* =========================
   RESULT MODAL
========================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.76);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;

.modal.show {

.modal-box {

    border-radius: 23px;

@keyframes modalIn {

        transform: scale(1);
    }

.result-emoji {
    font-size: 78px;

@keyframes resultFloat {
    from {
        transform: translateY(0) rotate(-3deg);
    }

    to {
        transform: translateY(-8px) rotate(3deg);
    }

.result-label {
    margin-top: 16px;
    color: #8993a3;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;

.result-name {
    margin-top: 8px;
    font-size: 25px;
    font-weight: 1000;
}

.result-value {
    margin-top: 12px;
    font-size: 24px;
    color: #48df80;
    font-weight: 1000;

/* =========================
   RESULT BUTTONS
========================= */

.result-buttons {
    display: flex;
    gap: 10px;
    margin-top: 23px;

.result-button {
    flex: 1;
    padding: 14px 8px;
    border: none;
    border-radius: 13px;

    cursor: pointer;

.result-button:active {

.sell-button {

.back-result-button {

/* =========================

========================= */

.message {

@media (max-width: 370px) {

function normalizeChances() {

    const stars =
        items.find(
            item =>
                item.name === "7 Stars"
        );

    const otherItems =
        items.filter(

        );

}

function updateBalance() {

    balance =

        ) / 10000;

/* =========================
   FREE CASE COOLDOWN
========================= */

const FREE_COOLDOWN =
    24 * 60 * 60 * 1000;

const FREE_COOLDOWN_KEY =
    "case_free_last_open";


function getFreeLastOpen() {

    const value =
        localStorage.getItem(
            FREE_COOLDOWN_KEY
        );

    if (!value) {
        return 0;
    }

    return Number(value);
}


function canOpenFreeCase() {

    const lastOpen =
        getFreeLastOpen();

    return (
        Date.now() -
        lastOpen >=
        FREE_COOLDOWN
    );
}


function setFreeCooldown() {

    localStorage.setItem(
        FREE_COOLDOWN_KEY,
        String(Date.now())
    );

    updateFreeButton();
}


function updateFreeButton() {

    const lastOpen =
        getFreeLastOpen();

    const remaining =
        FREE_COOLDOWN -
        (
            Date.now() -
            lastOpen
        );

    if (
        remaining <= 0
    ) {

        freeCaseBox.classList
            .remove("disabled");

        freeTimer.textContent =
            "ГОТОВ К ОТКРЫТИЮ";

        return;
    }

    freeCaseBox.classList
        .add("disabled");

    freeTimer.textContent =
        formatTime(
            remaining
        );
}


function formatTime(
    milliseconds
) {

    let totalSeconds =
        Math.ceil(
            milliseconds / 1000
        );

    const hours =
        Math.floor(
            totalSeconds / 3600
        );

    totalSeconds %= 3600;

    const minutes =
        Math.floor(
            totalSeconds / 60
        );

    const seconds =
        totalSeconds % 60;

    return (
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0")
    );
}

    const sortedItems =
        [...sourceItems].sort(
            (a, b) =>
                b.value -
                a.value
        );

    sortedItems.forEach(
        item => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                `item-card ${item.rarity}`;

            card.innerHTML = `

                <div class="item-emoji">
                    ${item.emoji}
                </div>

                <div class="item-name">
                    ${item.name}
                </div>

                <div class="item-price">
                    +${item.value} 💰
                </div>

            `;

            itemsGrid.appendChild(
                card
            );
        }
    );
}


/* =========================
   RANDOM ITEM
========================= */

function getRandomItem(
    sourceItems
) {

    const random =
        Math.random() * 100;

    let accumulated = 0;

    for (
        const item of sourceItems
    ) {

        accumulated +=
            item.chance;

        if (
            random <
            accumulated
        ) {

            return item;
        }
    }

    /*
        Сохраняем ту же технику
        выбора победителя.

        Для FREE, поскольку указанные
        шансы занимают не все 100%,
        оставшаяся вероятность
        распределяется через fallback
        на последний предмет.
    */

    return sourceItems[
        sourceItems.length - 1
    ];
}


/* =========================
   ROULETTE CARD
========================= */

function createRouletteCard(
    item
) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        `roulette-item ${item.rarity}`;

    element.innerHTML = `

        <div class="roulette-emoji">
            ${item.emoji}
        </div>

        <div class="roulette-name">
            ${item.name}
        </div>

    `;

    return element;
}


/* =========================
   RESET ROULETTE
========================= */

function resetRoulette(
    sourceItems = items
) {

    rouletteTrack.style.transition =
        "none";

    rouletteTrack.style.transform =
        "translateX(0px)";

    rouletteTrack.innerHTML = "";

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const randomItem =
            sourceItems[
                Math.floor(
                    Math.random() *
                    sourceItems.length
                )
            ];

        rouletteTrack.appendChild(
            createRouletteCard(
                randomItem
            )
        );
    }
}


/* =========================
   OPEN CASE
========================= */

function openCase() {

    if (
        isOpening
    ) {

        return;
    }


    /* =========================
       FREE CASE
    ========================= */

    if (
        currentCaseType ===
        "free"
    ) {

        if (
            !canOpenFreeCase()
        ) {

            showMessage(
                "FREE кейс можно открыть только раз в сутки ⏰"
            );

            return;
        }

        isOpening = true;

        openButton.disabled =
            true;

        setFreeCooldown();

        playClickSound();


        const winner =
            getRandomItem(
                freeItems
            );

        currentWinner =
            winner;


        rouletteTrack.style.transition =
            "none";

        rouletteTrack.style.transform =
            "translateX(0px)";

        rouletteTrack.innerHTML = "";


        const totalCards = 45;

        const winnerIndex = 36;


        for (
            let i = 0;
            i < totalCards;
            i++
        ) {

            let item;

            if (
                i ===
                winnerIndex
            ) {

                item =
                    winner;

            } else {

                item =
                    freeItems[
                        Math.floor(
                            Math.random() *
                            freeItems.length
                        )
                    ];
            }


            rouletteTrack.appendChild(
                createRouletteCard(
                    item
                )
            );
        }


        const cardWidth =
            135;

        const windowWidth =
            rouletteTrack
                .parentElement
                .offsetWidth;

        const centerOffset =
            windowWidth / 2 -
            62.5;

        const stopPosition =
            -(
                winnerIndex *
                cardWidth -
                centerOffset
            );


        const finalPosition =
            stopPosition +
            (
                Math.random() *
                30 -
                15
            );


        requestAnimationFrame(
            () => {

                requestAnimationFrame(
                    () => {

                        rouletteTrack.style.transition =
                            "transform 6.5s cubic-bezier(.08,.72,.05,1)";

                        rouletteTrack.style.transform =
                            `translateX(${finalPosition}px)`;

                    }
                );
            }
        );


        playRollSound(
            6500
        );


        setTimeout(
            () => {

                showResult(
                    winner
                );

                isOpening =
                    false;

                openButton.disabled =
                    false;

            },
            6800
        );

        return;
    }


    /* =========================
       CASE 50
       НЕ МЕНЯЕМ ЕГО МЕХАНИКУ
    ========================= */

    if (
        balance <
        CASE_PRICE
    ) {

        showMessage(
            "Недостаточно валюты 💰"
        );

        return;
    }

    isOpening = true;

    openButton.disabled =
        true;

    balance -=
        CASE_PRICE;

    updateBalance();

    playClickSound();


    const winner =
        getRandomItem(
            items
        );

    currentWinner =
        winner;


    rouletteTrack.style.transition =
        "none";

    rouletteTrack.style.transform =
        "translateX(0px)";

    rouletteTrack.innerHTML = "";


    const totalCards = 45;

    const winnerIndex = 36;


    for (
        let i = 0;
        i < totalCards;
        i++
    ) {

        let item;

        if (
            i ===
            winnerIndex
        ) {

            item =
                winner;

        } else {

            item =
                items[
                    Math.floor(
                        Math.random() *
                        items.length
                    )
                ];
        }


        rouletteTrack.appendChild(
            createRouletteCard(
                item
            )
        );
    }


    const cardWidth =
        135;

    const windowWidth =
        rouletteTrack
            .parentElement
            .offsetWidth;

    const centerOffset =
        windowWidth / 2 -
        62.5;

    const stopPosition =
        -(
            winnerIndex *
            cardWidth -
            centerOffset
        );


    const finalPosition =
        stopPosition +
        (
            Math.random() *
            30 -
            15
        );


    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    rouletteTrack.style.transition =
                        "transform 6.5s cubic-bezier(.08,.72,.05,1)";

                    rouletteTrack.style.transform =
                        `translateX(${finalPosition}px)`;

                }
            );
        }
    );


    playRollSound(
        6500
    );


    setTimeout(
        () => {

            showResult(
                winner
            );

            isOpening =
                false;

            openButton.disabled =
                false;

        },
        6800
    );
}


/* =========================
   RESULT
========================= */

function showResult(
    item
) {

    currentWinner =
        item;

    resultEmoji.textContent =
        item.emoji;

    resultName.textContent =
        item.name;

    resultValue.textContent =
        `+${item.value} 💰`;

    resultModal.classList
        .add("show");

    playWinSound();
}


/* =========================
   ПРОДАТЬ ПРЕДМЕТ
========================= */

sellResult.addEventListener(
    "click",
    () => {

        if (
            !currentWinner
        ) {

            return;
        }

        balance +=
            currentWinner.value;

        updateBalance();

        resultModal.classList
            .remove("show");

        resetRoulette(
            currentCaseType === "free"
                ? freeItems
                : items
        );

        currentWinner =
            null;

    }
);


/* =========================
   НАЗАД ИЗ РЕЗУЛЬТАТА
========================= */

backResult.addEventListener(
    "click",
    () => {

        resultModal.classList
            .remove("show");

        resetRoulette(
            currentCaseType === "free"
                ? freeItems
                : items
        );

        currentWinner =
            null;

    }
);


/* =========================
   NAVIGATION
========================= */

caseBox.addEventListener(
    "click",
    () => {

        showCase(
            "paid"
        );

    }
);


freeCaseBox.addEventListener(
    "click",
    () => {

        if (
            !canOpenFreeCase()
        ) {

            showMessage(
                "FREE кейс можно открыть только раз в сутки ⏰"
            );

            return;
        }

        showCase(
            "free"
        );

    }
);


backButton.addEventListener(
    "click",
    () => {

        if (
            isOpening
        ) {

            showMessage(
                "Подождите окончания открытия кейса"
            );

            return;
        }

        showMain();
    }
);


openButton.addEventListener(
    "click",
    openCase
);


/* =========================
   MESSAGE
========================= */

let messageTimeout = null;

function showMessage(
    text
) {

    clearTimeout(
        messageTimeout
    );

    messageElement.textContent =
        text;

    messageElement.classList
        .add("show");

    messageTimeout =
        setTimeout(
            () => {

                messageElement.classList
                    .remove("show");

            },
            2500
        );
}


/* =========================
   AUDIO
========================= */

let audioContext = null;

function getAudioContext() {

    try {

        if (
            !audioContext
        ) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }

        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();
        }

        return audioContext;

    } catch (
        error
    ) {

        return null;
    }
}


/* =========================
   OPEN CLICK SOUND
========================= */

function playClickSound() {

    const ctx =
        getAudioContext();

    if (!ctx)
        return;

    try {

        const oscillator =
            ctx.createOscillator();

        const gain =
            ctx.createGain();

        oscillator.type =
            "square";

        oscillator.frequency.setValueAtTime(
            180,
            ctx.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            80,
            ctx.currentTime + 0.08
        );

        gain.gain.setValueAtTime(
            0.08,
            ctx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            ctx.currentTime + 0.09
        );

        oscillator.connect(
            gain
        );

        gain.connect(
            ctx.destination
        );

        oscillator.start();

        oscillator.stop(
            ctx.currentTime + 0.1
        );

    } catch (
        error
    ) {}
}


/* =========================
   ЗВУК ПРОКРУТКИ
========================= */

function playRollSound(
    duration
) {

    const startTime =
        Date.now();

    let lastTick = 0;

    function tick() {

        if (
            Date.now() -
            startTime >=
            duration
        ) {

            return;
        }

        const ctx =
            getAudioContext();

        if (!ctx) {

            requestAnimationFrame(
                tick
            );

            return;
        }

        const progress =
            (
                Date.now() -
                startTime
            ) /
            duration;

        const interval =
            55 +
            progress *
            180;


        if (
            Date.now() -
            lastTick >=
            interval
        ) {

            lastTick =
                Date.now();

            try {

                const oscillator =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();

                oscillator.type =
                    "triangle";

                oscillator.frequency.setValueAtTime(
                    950 -
                    progress * 450,
                    ctx.currentTime
                );

                oscillator.frequency.exponentialRampToValueAtTime(
                    480 -
                    progress * 180,
                    ctx.currentTime + 0.045
                );

                gain.gain.setValueAtTime(
                    0.075 -
                    progress * 0.035,
                    ctx.currentTime
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.001,
                    ctx.currentTime + 0.065
                );

                oscillator.connect(
                    gain
                );

                gain.connect(
                    ctx.destination
                );

                oscillator.start();

                oscillator.stop(
                    ctx.currentTime + 0.07
                );

            } catch (
                error
            ) {}
        }

        requestAnimationFrame(
            tick
        );
    }

    tick();
}


/* =========================
   WIN SOUND
========================= */

function playWinSound() {

    const ctx =
        getAudioContext();

    if (!ctx)
        return;

    try {

        const notes = [
            523.25,
            659.25,
            783.99,
            1046.5
        ];

        notes.forEach(
            (
                frequency,
                index
            ) => {

                const oscillator =
                    ctx.createOscillator();

                const gain =
                    ctx.createGain();

                const start =
                    ctx.currentTime +
                    index * 0.1;

                oscillator.type =
                    "sine";

                oscillator.frequency.setValueAtTime(
                    frequency,
                    start
                );

                gain.gain.setValueAtTime(
                    0,
                    start
                );

                gain.gain.linearRampToValueAtTime(
                    0.12,
                    start + 0.02
                );

                gain.gain.exponentialRampToValueAtTime(
                    0.001,
                    start + 0.35
                );

                oscillator.connect(
                    gain
                );

                gain.connect(
                    ctx.destination
                );

                oscillator.start(
                    start
                );

                oscillator.stop(
                    start + 0.4
                );
            }
        );

    } catch (
        error
    ) {}
}


/* =========================
   FREE TIMER UPDATE
========================= */

setInterval(
    updateFreeButton,
    1000
);


/* =========================
   INITIAL
========================= */

renderItems(
    items
);

resetRoulette(
    items
);

updateBalance();

updateFreeButton();

mainScreen.classList.add(
    "active"
);

</script>
