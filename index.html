<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cases</title>

<style>

/* =====================================================
   БАЗА
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #080b12;
    font-family: Arial, sans-serif;
    color: white;
}

body {
    overflow-x: hidden;
}

button {
    font-family: inherit;
}


/* =====================================================
   ОСНОВНОЙ КОНТЕЙНЕР
===================================================== */

#casesGameContainer {
    width: 100%;
    min-height: 100vh;
    padding: 18px 14px 40px;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(110, 80, 255, 0.22),
            transparent 38%
        ),
        linear-gradient(
            160deg,
            #090c14,
            #101522,
            #080b12
        );
}


/* =====================================================
   ВЕРХНЯЯ ПАНЕЛЬ
===================================================== */

.topbar {
    width: 100%;
    height: 55px;

    display: flex;
    justify-content: flex-end;
    align-items: center;
}

.balance-case {
    padding: 10px 16px;

    border-radius: 14px;

    background: #171d2a;

    border: 1px solid rgba(255,255,255,0.08);

    font-size: 18px;
    font-weight: 900;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.3);
}

.balance-case span {
    color: #ffd84d;
}


/* =====================================================
   ЭКРАНЫ
===================================================== */

.screen-case {
    display: none;
    width: 100%;
    min-height: calc(100vh - 73px);
}

.screen-case.active {
    display: flex;
}


/* =====================================================
   ГЛАВНЫЙ ЭКРАН
===================================================== */

.main-screen {
    flex-direction: column;
    align-items: center;
    padding-top: 25px;
    gap: 18px;
}

.main-title {
    font-size: 28px;
    font-weight: 1000;
    letter-spacing: 3px;
    margin-bottom: 8px;
}


/* =====================================================
   FREE CASE - PNG КЕЙС
===================================================== */

.free-case-wrapper {
    width: min(430px, 94vw);

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 12px;
}

.free-case-image-button {
    width: 100%;

    border: none;
    outline: none;

    background: transparent;

    cursor: pointer;

    padding: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;

    transition: transform 0.15s ease;
}

.free-case-image-button:active {
    transform: scale(0.97);
}

.free-case-image-button.disabled {
    opacity: 0.55;
}

.free-case-image {
    display: block;

    width: 100%;
    max-height: 280px;

    object-fit: contain;

    background: transparent;

    border: none;

    filter:
        drop-shadow(
            0 15px 25px
            rgba(0,0,0,0.45)
        );
}


/* =====================================================
   КНОПКА ПОД FREE КЕЙСОМ
===================================================== */

.free-ready-button {
    width: min(300px, 80vw);

    padding: 14px 18px;

    border-radius: 15px;

    border: 1px solid rgba(80, 205, 255, 0.35);

    background:
        linear-gradient(
            135deg,
            #173e58,
            #0d2538
        );

    color: #76d1ff;

    font-size: 15px;
    font-weight: 1000;
    letter-spacing: 0.5px;

    cursor: pointer;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.25);

    transition:
        transform 0.15s ease,
        opacity 0.15s ease;
}

.free-ready-button:active {
    transform: scale(0.97);
}

.free-ready-button.disabled {
    color: #9ba6bb;

    border-color:
        rgba(255,255,255,0.08);

    background:
        #171d2a;
}


/* =====================================================
   ОБЫЧНЫЕ КАРТОЧКИ КЕЙСОВ
===================================================== */

.main-case-button {
    position: relative;

    width: min(430px, 94vw);
    height: 105px;

    border-radius: 21px;

    border: 1px solid rgba(255,255,255,0.1);

    color: white;

    cursor: pointer;

    display: flex;
    align-items: center;

    padding: 0 20px;

    text-align: left;

    overflow: hidden;

    transition:
        transform 0.15s ease,
        border-color 0.15s ease;

    box-shadow:
        0 12px 35px rgba(0,0,0,0.3);
}

.main-case-button::after {
    content: "";

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 3px;
}

.main-case-button:active {
    transform: scale(0.97);
}


/* =====================================================
   ИКОНКА
===================================================== */

.case-icon {
    width: 58px;
    height: 58px;

    border-radius: 16px;

    display: flex;

    justify-content: center;
    align-items: center;

    margin-right: 16px;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,255,255,0.1);

    font-size: 29px;

    flex-shrink: 0;
}


/* =====================================================
   ТЕКСТ
===================================================== */

.case-info {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.case-name {
    font-size: 21px;
    font-weight: 1000;
}

.case-description {
    color: #9ba6bb;
    font-size: 12px;
    font-weight: 700;
}


/* =====================================================
   PLS PEPE
===================================================== */

.pls-pepe-button {
    background:
        linear-gradient(
            135deg,
            #183e3c,
            #0b2427
        );

    border-color:
        rgba(50,215,175,0.35);
}

.pls-pepe-button::after {
    background:
        linear-gradient(
            90deg,
            #39d8ad,
            #20a895
        );
}


/* =====================================================
   CASE 50
===================================================== */

.case-50-button {
    background:
        linear-gradient(
            135deg,
            #3b3018,
            #211b0e
        );

    border-color:
        rgba(255,210,70,0.4);
}

.case-50-button::after {
    background:
        linear-gradient(
            90deg,
            #ffe16a,
            #f2a900
        );
}


/* =====================================================
   CASE 250
===================================================== */

.case-250-button {
    background:
        linear-gradient(
            135deg,
            #38245c,
            #1e1533
        );

    border-color:
        rgba(165,130,255,0.42);
}

.case-250-button::after {
    background:
        linear-gradient(
            90deg,
            #bd9aff,
            #7650ed
        );
}


/* =====================================================
   ЭКРАН КЕЙСА
===================================================== */

.case-screen {
    flex-direction: column;
    padding-top: 8px;
}

.case-title-row {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 20px;
}

.case-title {
    font-size: 24px;
    font-weight: 1000;
}

.back-case {
    padding: 10px 14px;

    border-radius: 11px;

    border: 1px solid rgba(255,255,255,0.08);

    background: #171d2a;

    color: #c4cada;

    font-weight: 800;

    cursor: pointer;
}


/* =====================================================
   РУЛЕТКА
===================================================== */

.roulette-section {
    position: relative;
    width: 100%;
}

.pointer-case {
    position: absolute;

    top: -1px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    width: 0;
    height: 0;

    border-left: 16px solid transparent;
    border-right: 16px solid transparent;

    border-top: 25px solid #a78bfa;

    filter:
        drop-shadow(
            0 0 8px
            rgba(167,139,250,0.7)
        );
}

.roulette-window {
    width: 100%;
    height: 160px;

    overflow: hidden;

    border-radius: 17px;

    background: #0d121e;

    border: 1px solid rgba(255,255,255,0.08);

    box-shadow:
        inset 0 0 40px rgba(0,0,0,0.5);
}

.roulette-track {
    height: 100%;

    display: flex;
    align-items: center;

    gap: 10px;

    padding: 10px;

    transform: translateX(0);
}

.roulette-item {
    width: 125px;
    min-width: 125px;
    height: 125px;

    flex-shrink: 0;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    border-radius: 14px;

    background: #171d2a;

    border: 1px solid rgba(255,255,255,0.08);
}

.roulette-emoji {
    font-size: 46px;
}

.roulette-name {
    margin-top: 8px;

    padding: 0 5px;

    text-align: center;

    font-size: 11px;
    font-weight: 800;

    color: #b8c2d4;
}


/* =====================================================
   ОТКРЫТЬ
===================================================== */

.open-button {
    width: 100%;

    margin-top: 17px;

    padding: 17px;

    border: none;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #7957ff,
            #5332d6
        );

    color: white;

    font-size: 18px;
    font-weight: 1000;

    cursor: pointer;
}

.open-button.free-open {
    background:
        linear-gradient(
            135deg,
            #28bd9c,
            #14866f
        );
}

.open-button:active {
    transform: scale(0.98);
}

.open-button:disabled {
    opacity: 0.5;
}


/* =====================================================
   ПРЕДМЕТЫ
===================================================== */

.items-title {
    margin: 27px 0 13px;

    text-align: center;

    font-size: 18px;
    font-weight: 1000;

    color: #e5e9f2;
}

.items-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 9px;
}

.item-card {
    min-height: 125px;

    padding: 10px 6px;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    border-radius: 14px;

    background: #141a27;

    border: 1px solid rgba(255,255,255,0.07);
}

.item-emoji {
    font-size: 38px;
    line-height: 1;
}

.item-name {
    margin-top: 9px;

    font-size: 11px;
    font-weight: 800;

    color: #aeb8ca;

    line-height: 1.25;
}

.item-price {
    margin-top: 7px;

    color: #ffd84d;

    font-size: 13px;
    font-weight: 1000;
}

.legendary {
    border-color: rgba(255,215,70,0.5);
}

.rare {
    border-color: rgba(100,150,255,0.4);
}

.uncommon {
    border-color: rgba(60,190,165,0.35);
}


/* =====================================================
   РЕЗУЛЬТАТ
===================================================== */

.modal-case {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,0.8);
}

.modal-case.show {
    display: flex;
}

.modal-box-case {
    width: 100%;
    max-width: 360px;

    padding: 28px 20px 23px;

    text-align: center;

    border-radius: 23px;

    background:
        linear-gradient(
            145deg,
            #1a2131,
            #0d121e
        );

    border: 1px solid rgba(255,255,255,0.1);
}

.result-emoji-case {
    font-size: 78px;
    margin-bottom: 12px;
}

.result-label-case {
    color: #8e99ad;

    font-size: 13px;
    font-weight: 800;

    letter-spacing: 1px;
}

.result-name-case {
    margin-top: 8px;

    font-size: 25px;
    font-weight: 1000;
}

.result-value-case {
    margin-top: 12px;

    font-size: 24px;

    color: #a78bfa;

    font-weight: 1000;
}

.result-buttons {
    display: flex;

    gap: 10px;

    margin-top: 23px;
}

.result-button {
    flex: 1;

    padding: 14px 8px;

    border: none;

    border-radius: 13px;

    color: white;

    font-weight: 900;

    cursor: pointer;
}

.sell-button {
    background:
        linear-gradient(
            135deg,
            #7957ff,
            #5332d6
        );
}

.back-result-button {
    background: #1b2232;
    color: #aeb8ca;
}


/* =====================================================
   СООБЩЕНИЯ
===================================================== */

.message-case {
    position: fixed;

    left: 50%;
    bottom: 25px;

    z-index: 300;

    transform:
        translateX(-50%)
        translateY(100px);

    padding: 13px 18px;

    border-radius: 13px;

    background: #d24761;

    color: white;

    font-weight: 800;

    text-align: center;

    transition: 0.3s ease;
}

.message-case.show {
    transform:
        translateX(-50%)
        translateY(0);
}


/* =====================================================
   КРЕСТИК
===================================================== */

.close-button {
    position: fixed;

    top: 18px;
    left: 18px;

    z-index: 200;

    width: 44px;
    height: 44px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,0.08);

    background: #171d2a;

    color: white;

    font-size: 20px;

    cursor: pointer;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 500px) {

    #casesGameContainer {
        padding: 14px 12px 30px;
    }

    .main-screen {
        padding-top: 20px;
    }

    .main-title {
        font-size: 25px;
    }

    .main-case-button {
        width: 100%;
        height: 98px;

        border-radius: 19px;

        padding: 0 17px;
    }

    .case-icon {
        width: 54px;
        height: 54px;

        margin-right: 14px;

        font-size: 27px;
    }

    .case-name {
        font-size: 19px;
    }

    .case-description {
        font-size: 10px;
    }

    .free-case-image {
        max-height: 240px;
    }

}

</style>
</head>

<body>

<div id="casesGameContainer">

<button
    class="close-button"
    onclick="closeCases()"
>
    ✕
</button>


<!-- =====================================================
     ВЕРХ
===================================================== -->

<div class="topbar">

    <div class="balance-case">
        ⭐ <span id="balanceCase">1000.00</span>
    </div>

</div>


<!-- =====================================================
     ГЛАВНЫЙ ЭКРАН
===================================================== -->

<section
    id="mainScreenCase"
    class="screen-case active main-screen"
>

    <div class="main-title">
        КЕЙСЫ
    </div>


    <!-- FREE CASE -->

    <div class="free-case-wrapper">

        <button
            class="free-case-image-button"
            id="freeCaseBox"
            onclick="openCaseScreen('free')"
        >

            <img
                id="freeCaseImage"
                class="free-case-image"
                alt="CASE FREE"
            >

        </button>


        <button
            class="free-ready-button"
            id="freeReadyButton"
            onclick="openCaseScreen('free')"
        >
            ГОТОВ К ОТКРЫТИЮ
        </button>

    </div>


    <!-- PLS PEPE -->

    <button
        class="main-case-button pls-pepe-button"
        onclick="openCaseScreen('pls-pepe')"
    >

        <div class="case-icon">
            🐸
        </div>

        <div class="case-info">

            <div class="case-name">
                PLS PEPE
            </div>

            <div class="case-description">
                Стоимость открытия — 10 ⭐
            </div>

        </div>

    </button>


    <!-- CASE 50 -->

    <button
        class="main-case-button case-50-button"
        onclick="openCaseScreen('50')"
    >

        <div class="case-icon">
            ⭐
        </div>

        <div class="case-info">

            <div class="case-name">
                CASE 50
            </div>

            <div class="case-description">
                Стоимость открытия — 50 ⭐
            </div>

        </div>

    </button>


    <!-- CASE 250 -->

    <button
        class="main-case-button case-250-button"
        onclick="openCaseScreen('250')"
    >

        <div class="case-icon">
            💎
        </div>

        <div class="case-info">

            <div class="case-name">
                CASE 250
            </div>

            <div class="case-description">
                Стоимость открытия — 250 ⭐
            </div>

        </div>

    </button>

</section>


<!-- =====================================================
     ЭКРАН КЕЙСА
===================================================== -->

<section
    id="caseScreenCase"
    class="screen-case case-screen"
>

    <div class="case-title-row">

        <div
            class="case-title"
            id="caseTitle"
        >
            CASE
        </div>

        <button
            class="back-case"
            onclick="showMainCase()"
        >
            ← Назад
        </button>

    </div>


    <div class="roulette-section">

        <div class="pointer-case"></div>

        <div class="roulette-window">

            <div
                class="roulette-track"
                id="rouletteTrack"
            ></div>

        </div>

    </div>


    <button
        class="open-button"
        id="openButton"
        onclick="openCurrentCase()"
    >
        ОТКРЫТЬ
    </button>


    <div class="items-title">
        ПРЕДМЕТЫ В КЕЙСЕ
    </div>

    <div
        class="items-grid"
        id="itemsGrid"
    ></div>

</section>


<!-- =====================================================
     РЕЗУЛЬТАТ
===================================================== -->

<div
    class="modal-case"
    id="resultModalCase"
>

    <div class="modal-box-case">

        <div
            class="result-emoji-case"
            id="resultEmoji"
        >
            💎
        </div>

        <div class="result-label-case">
            ВАМ ВЫПАЛО
        </div>

        <div
            class="result-name-case"
            id="resultName"
        >
            Diamond
        </div>

        <div
            class="result-value-case"
            id="resultValue"
        >
            +100 ⭐
        </div>

        <div class="result-buttons">

            <button
                class="result-button sell-button"
                onclick="sellResult()"
            >
                ПРОДАТЬ
            </button>

            <button
                class="result-button back-result-button"
                onclick="saveResult()"
            >
                В ИНВЕНТАРЬ
            </button>

        </div>

    </div>

</div>


<div
    class="message-case"
    id="messageCase"
></div>

</div>


<script>

"use strict";


/* =====================================================
   ССЫЛКА НА PNG КЕЙСА
   ВСТАВЬ СЮДА СВОЮ ПРЯМУЮ ССЫЛКУ НА PNG
===================================================== */

const FREE_CASE_IMAGE =
    "<a href="https://ibb.co/LX4F0w6F"><img src="https://i.ibb.co/S4qj6T0j/5-E5-AD32-B-4-D2-A-44-EF-AB0-A-B5-CD3218-DACE.png" alt="5-E5-AD32-B-4-D2-A-44-EF-AB0-A-B5-CD3218-DACE" border="0" /></a>";


document.getElementById(
    "freeCaseImage"
).src = FREE_CASE_IMAGE;


/* =====================================================
   БАЛАНС
===================================================== */

let balance =
    Number(
        localStorage.getItem("cases_balance")
    );

if (!Number.isFinite(balance)) {
    balance = 1000;
}


function updateBalance() {

    document.getElementById(
        "balanceCase"
    ).textContent =
        balance.toFixed(2);

    localStorage.setItem(
        "cases_balance",
        balance
    );

}


/* =====================================================
   CASE 50
===================================================== */

const itemsCase = [

    {
        emoji: "🐻",
        name: "Toy Bear",
        value: 5000,
        chance: 0.0001,
        rarity: "legendary"
    },

    {
        emoji: "🖊️",
        name: "Fine Pen",
        value: 1000,
        chance: 0.0001,
        rarity: "legendary"
    },

    {
        emoji: "🗽",
        name: "Liberty Figure",
        value: 550,
        chance: 0.00095,
        rarity: "legendary"
    },

    {
        emoji: "🔦",
        name: "Chill Flame",
        value: 450,
        chance: 0.001,
        rarity: "rare"
    },

    {
        emoji: "🍦",
        name: "Vice Cream",
        value: 450,
        chance: 0.001,
        rarity: "rare"
    },

    {
        emoji: "🏆",
        name: "Trophy",
        value: 100,
        chance: 7.5,
        rarity: "rare"
    },

    {
        emoji: "💎",
        name: "Diamond",
        value: 100,
        chance: 7.5,
        rarity: "rare"
    },

    {
        emoji: "🎂",
        name: "Cake",
        value: 50,
        chance: 10,
        rarity: "uncommon"
    },

    {
        emoji: "💐",
        name: "Flowers",
        value: 50,
        chance: 10,
        rarity: "uncommon"
    },

    {
        emoji: "🎁",
        name: "Gift",
        value: 25,
        chance: 13,
        rarity: ""
    },

    {
        emoji: "🐻",
        name: "Bear",
        value: 15,
        chance: 15,
        rarity: ""
    },

    {
        emoji: "🩷",
        name: "Heart",
        value: 15,
        chance: 15,
        rarity: ""
    },

    {
        emoji: "7 ⭐",
        name: "7 Stars",
        value: 7,
        chance: 0,
        rarity: ""
    }

];


const case50Without7 =
    itemsCase.filter(
        item => item.name !== "7 Stars"
    );

const case50Total =
    case50Without7.reduce(
        (sum, item) => sum + item.chance,
        0
    );

itemsCase.find(
    item => item.name === "7 Stars"
).chance =
    Math.max(
        0,
        100 - case50Total
    );


/* =====================================================
   FREE
===================================================== */

const freeItemsCase = [

    {
        emoji: "3 ⭐",
        name: "3 Stars",
        value: 3,
        chance: 23,
        rarity: ""
    },

    {
        emoji: "5 ⭐",
        name: "5 Stars",
        value: 5,
        chance: 22,
        rarity: ""
    },

    {
        emoji: "7 ⭐",
        name: "7 Stars",
        value: 7,
        chance: 27,
        rarity: ""

/* =====================================================

===================================================== */

let currentCaseType = "free";
let currentItems = freeItemsCase;
let currentWinner = null;
let opening = false;


/* =====================================================
   DOM
===================================================== */

const mainScreen =
    document.getElementById("mainScreenCase");

const caseScreen =
    document.getElementById("caseScreenCase");

const caseTitle =
    document.getElementById("caseTitle");

const openButton =
    document.getElementById("openButton");

const rouletteTrack =
    document.getElementById("rouletteTrack");

    document.getElementById("itemsGrid");

    document.getElementById("resultModalCase");

const resultEmoji =
    document.getElementById("resultEmoji");

const resultName =
    document.getElementById("resultName");

const resultValue =
    document.getElementById("resultValue");

const message =
    document.getElementById("messageCase");


/* =====================================================
   ОТКРЫТЬ ЭКРАН КЕЙСА
===================================================== */

function openCaseScreen(type) {

    if (opening) {
        return;
    }

    currentCaseType = type;


    if (type === "free") {

        currentItems = freeItemsCase;

        caseTitle.textContent =
            "CASE FREE 🎁";

        openButton.textContent =
            "ОТКРЫТЬ FREE 🎁";

        openButton.classList.add("free-open");

    }

    else if (type === "pls-pepe") {

        currentItems = plsPepeItemsCase;

        caseTitle.textContent =
            "PLS PEPE 🐸";

        openButton.textContent =
            "КУПИТЬ ЗА 10 ⭐";

        openButton.classList.remove("free-open");

    }

    else if (type === "250") {

        currentItems = case250ItemsCase;

        caseTitle.textContent =
            "CASE 250 💎";

        openButton.textContent =
            "КУПИТЬ ЗА 250 ⭐";

        openButton.classList.remove("free-open");

    }

    else {

        currentItems = itemsCase;

        caseTitle.textContent =
            "CASE 50 ⭐";

        openButton.textContent =
            "КУПИТЬ ЗА 50 ⭐";

        openButton.classList.remove("free-open");

    }


    mainScreen.classList.remove("active");

    caseScreen.classList.add("active");

    renderItems();

    resetRoulette();

}


/* =====================================================
   НАЗАД
===================================================== */

function showMainCase() {

    if (opening) {

        showMessage(
            "Подождите окончания открытия кейса"
        );

        return;

    }

    caseScreen.classList.remove("active");

    mainScreen.classList.add("active");

}


/* =====================================================
   ПРЕДМЕТЫ
===================================================== */

function renderItems() {

    itemsGrid.innerHTML = "";


    [...currentItems]
        .sort(
            (a, b) => b.value - a.value
        )
        .forEach(item => {

            const card =
                document.createElement("div");

            card.className =
                "item-card " +
                item.rarity;


            card.innerHTML = `
                <div class="item-emoji">
                    ${item.emoji}
                </div>

                <div class="item-name">
                    ${item.name}
                </div>

                <div class="item-price">
                    +${item.value} ⭐
                </div>
            `;


            itemsGrid.appendChild(card);

        });

}


/* =====================================================
   ВЫБОР ПОБЕДИТЕЛЯ
===================================================== */

function getRandomItem() {

    const totalChance =
        currentItems.reduce(
            (sum, item) =>
                sum + item.chance,
            0
        );


    let random =
        Math.random() * totalChance;


    for (const item of currentItems) {

        random -= item.chance;

        if (random <= 0) {
            return item;
        }

    }


    return currentItems[
        currentItems.length - 1
    ];

}


/* =====================================================
   КАРТОЧКА РУЛЕТКИ
===================================================== */

function createRouletteCard(item) {

    const element =
        document.createElement("div");

    element.className =
        "roulette-item " +
        item.rarity;


    element.innerHTML = `
        <div class="roulette-emoji">
            ${item.emoji}
        </div>

        <div class="roulette-name">
            ${item.name}
        </div>
    `;


    return element;

}


/* =====================================================
   СБРОС РУЛЕТКИ
===================================================== */

function resetRoulette() {

    rouletteTrack.style.transition = "none";

    rouletteTrack.style.transform =
        "translateX(0px)";

    rouletteTrack.innerHTML = "";


    for (let i = 0; i < 18; i++) {

        const item =
            currentItems[
                Math.floor(
                    Math.random() *
                    currentItems.length
                )
            ];

        rouletteTrack.appendChild(
            createRouletteCard(item)
        );

    }

}


/* =====================================================
   ОТКРЫТИЕ КЕЙСА
===================================================== */

function openCurrentCase() {

    if (opening) {
        return;
    }


    /* FREE */

    if (currentCaseType === "free") {

        const last =
            Number(
                localStorage.getItem(
                    "free_case_time"
                )
            ) || 0;


        const cooldown =
            24 * 60 * 60 * 1000;


        if (
            Date.now() - last <
            cooldown
        ) {

            const remaining =
                cooldown -
                (Date.now() - last);


            showMessage(
                "FREE кейс ещё недоступен: " +
                formatTime(remaining)
            );

            return;

        }


        localStorage.setItem(
            "free_case_time",
            Date.now()
        );

        updateFreeTimer();

    }


    /* ЦЕНА */

    let price = 0;


    if (currentCaseType === "pls-pepe") {
        price = 10;
    }

    else if (currentCaseType === "50") {
        price = 50;
    }

    else if (currentCaseType === "250") {
        price = 250;
    }


    if (
        price > 0 &&
        balance < price
    ) {

        showMessage(
            "Недостаточно ⭐"
        );

        return;

    }


    if (price > 0) {

        balance -= price;

        balance =
            Math.round(
                balance * 100
            ) / 100;

        updateBalance();

    }


    opening = true;

    openButton.disabled = true;


    currentWinner =
        getRandomItem();


    startRoulette(
        currentWinner
    );

}


/* =====================================================
   АНИМАЦИЯ РУЛЕТКИ
===================================================== */

function startRoulette(winner) {

    rouletteTrack.innerHTML = "";

    rouletteTrack.style.transition = "none";

    rouletteTrack.style.transform =
        "translateX(0px)";


    const total = 45;

    const winnerIndex = 36;


    for (let i = 0; i < total; i++) {

        let item;


        if (i === winnerIndex) {

            item = winner;

        }

        else {

            item =
                currentItems[
                    Math.floor(
                        Math.random() *
                        currentItems.length
                    )
                ];

        }


        rouletteTrack.appendChild(
            createRouletteCard(item)
        );

    }


    const cardWidth = 135;


    const windowWidth =
        document.querySelector(
            ".roulette-window"
        ).offsetWidth;


    const center =
        windowWidth / 2 - 62.5;


    const position =
        -(
            winnerIndex *
            cardWidth -
            center
        );


    const randomOffset =
        Math.random() * 16 - 8;


    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            rouletteTrack.style.transition =
                "transform 6.5s cubic-bezier(.08,.72,.05,1)";

            rouletteTrack.style.transform =
                "translateX(" +
                (
                    position +
                    randomOffset
                ) +
                "px)";

        });

    });


    setTimeout(() => {

        showResult(winner);

        opening = false;

        openButton.disabled = false;

    }, 6800);

}


/* =====================================================
   РЕЗУЛЬТАТ
===================================================== */

function showResult(item) {

    resultEmoji.textContent =
        item.emoji;

    resultName.textContent =
        item.name;

    resultValue.textContent =
        "+" +
        item.value +
        " ⭐";


    resultModal.classList.add("show");

}


/* =====================================================
   ПРОДАТЬ
===================================================== */

function sellResult() {

    if (!currentWinner) {
        return;
    }


    balance += currentWinner.value;

    balance =
        Math.round(
            balance * 100
        ) / 100;


    updateBalance();


    resultModal.classList.remove("show");


    currentWinner = null;


    resetRoulette();

}


/* =====================================================
   СОХРАНИТЬ В ИНВЕНТАРЬ
===================================================== */

function saveResult() {

    if (!currentWinner) {
        return;
    }


    let inventory = [];


    try {

        inventory =
            JSON.parse(
                localStorage.getItem(
                    "case_inventory"
                )
            ) || [];

    }

    catch (e) {

        inventory = [];

    }


    inventory.push(currentWinner);


    localStorage.setItem(
        "case_inventory",
        JSON.stringify(inventory)
    );


    resultModal.classList.remove("show");


    currentWinner = null;


    resetRoulette();


    showMessage(
        "Предмет сохранён в инвентарь 🎒"
    );

}


/* =====================================================
   FREE TIMER
===================================================== */

function updateFreeTimer() {

    const readyButton =
        document.getElementById(
            "freeReadyButton"
        );

    const caseButton =
        document.getElementById(
            "freeCaseBox"
        );


    const last =
        Number(
            localStorage.getItem(
                "free_case_time"
            )
        ) || 0;


    const cooldown =
        24 * 60 * 60 * 1000;


    const remaining =
        cooldown -
        (Date.now() - last);


    if (remaining <= 0) {

        readyButton.textContent =
            "ГОТОВ К ОТКРЫТИЮ 🎁";

        readyButton.classList.remove(
            "disabled"
        );

        caseButton.classList.remove(
            "disabled"
        );

        return;

    }


    readyButton.textContent =
        formatTime(remaining);


    readyButton.classList.add(
        "disabled"
    );

    caseButton.classList.add(
        "disabled"
    );

}


function formatTime(ms) {

    let seconds =
        Math.ceil(ms / 1000);


    const hours =
        Math.floor(
            seconds / 3600
        );


    seconds %= 3600;


    const minutes =
        Math.floor(
            seconds / 60
        );


    seconds %= 60;


    return (
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0")
    );

}


/* =====================================================
   СООБЩЕНИЕ
===================================================== */

let messageTimer = null;


function showMessage(text) {

    clearTimeout(messageTimer);


    message.textContent = text;


    message.classList.add("show");


    messageTimer =
        setTimeout(() => {

            message.classList.remove(
                "show"
            );

        }, 2500);

}


/* =====================================================
   ЗАКРЫТЬ
===================================================== */

function closeCases() {

    if (opening) {

        showMessage(

        );

        return;

    }


    showMainCase();

}
