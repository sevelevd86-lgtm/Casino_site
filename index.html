<!-- =====================================================
     ЕДИНЫЙ СТИЛЬ ВСЕХ 4 КЕЙСОВ
===================================================== -->

<style>

/* =====================================================
   ОБЩАЯ КАРТОЧКА КЕЙСА
===================================================== */

.case-image-card {
    width: min(900px, 96vw);
    display: flex;
    flex-direction: column;
    align-items: stretch;
}


/* =====================================================
   ОБЩАЯ КНОПКА-КАРТИНКА
===================================================== */

.case-image-button {
    position: relative;
    z-index: 2;

    width: 100%;
    aspect-ratio: 1477 / 457;

    padding: 0;
    border: 1px solid rgba(255,255,255,.10);
    border-radius: 24px;

    overflow: hidden;

    background: #111725;

    cursor: pointer;

    display: block;

    box-shadow:
        0 18px 45px rgba(0,0,0,.48),
        0 0 0 1px rgba(255,255,255,.025);

    transition:
        transform .18s ease,
        box-shadow .18s ease,
        filter .18s ease;
}


/* =====================================================
   СВЕЧЕНИЕ ПОВЕРХ КЕЙСА
===================================================== */

.case-image-button::after {
    content: "";

    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        linear-gradient(
            115deg,
            rgba(255,255,255,0.13),
            transparent 28%,
            transparent 70%,
            rgba(255,255,255,0.05)
        );

    opacity: .55;

    transition:
        opacity .18s ease;
}


/* =====================================================
   КОНТЕЙНЕР ИЗОБРАЖЕНИЯ
===================================================== */

.case-image-wrap {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;
}


/* =====================================================
   ИЗОБРАЖЕНИЕ
===================================================== */

.case-image {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    max-width: none;

    display: block;

    object-fit: fill;
    object-position: center center;

    user-select: none;
    pointer-events: none;

    transition:
        transform .25s ease,
        filter .25s ease;
}


/* =====================================================
   HOVER
===================================================== */

.case-image-button:hover {
    transform: translateY(-2px);

    filter: brightness(1.06);

    box-shadow:
        0 22px 55px rgba(0,0,0,.55),
        0 0 30px rgba(130,100,255,.13);
}

.case-image-button:hover::after {
    opacity: .8;
}

.case-image-button:hover .case-image {
    transform: scale(1.015);
}


/* =====================================================
   НАЖАТИЕ
===================================================== */

.case-image-button:active {
    transform: scale(.975);

    box-shadow:
        0 10px 25px rgba(0,0,0,.42);
}

.case-image-button:active .case-image {
    transform: scale(1);
}


/* =====================================================
   ПЛАВНАЯ АНИМАЦИЯ
===================================================== */

@keyframes caseFloatGlow {

    0% {
        box-shadow:
            0 18px 45px rgba(0,0,0,.48),
            0 0 0 1px rgba(255,255,255,.025);
    }

    50% {
        box-shadow:
            0 20px 48px rgba(0,0,0,.50),
            0 0 25px rgba(130,100,255,.08);
    }

    100% {
        box-shadow:
            0 18px 45px rgba(0,0,0,.48),
            0 0 0 1px rgba(255,255,255,.025);
    }

}

.case-image-button {
    animation:
        caseFloatGlow 3.5s ease-in-out infinite;
}


/* =====================================================
   CASE FREE
===================================================== */

.case-free-image-button {
    border-color:
        rgba(70,220,180,.18);
}

.case-free-image-button:hover {
    box-shadow:
        0 22px 55px rgba(0,0,0,.55),
        0 0 32px rgba(40,189,156,.18);
}


/* =====================================================
   PLS PEPE
===================================================== */

.case-pepe-image-button {
    border-color:
        rgba(170,100,255,.18);
}

.case-pepe-image-button:hover {
    box-shadow:
        0 22px 55px rgba(0,0,0,.55),
        0 0 32px rgba(150,90,255,.20);
}


/* =====================================================
   CASE 50
===================================================== */

.case-50-image-button {
    border-color:
        rgba(255,205,70,.18);
}

.case-50-image-button:hover {
    box-shadow:
        0 22px 55px rgba(0,0,0,.55),
        0 0 32px rgba(255,205,70,.14);
}


/* =====================================================
   CASE 250
===================================================== */

.case-250-image-button {
    border-color:
        rgba(100,140,255,.20);
}

.case-250-image-button:hover {
    box-shadow:
        0 22px 55px rgba(0,0,0,.55),
        0 0 32px rgba(100,140,255,.18);
}


/* =====================================================
   FREE STATUS
===================================================== */

.free-status {
    position: relative;
    z-index: 3;

    width: 88%;

    align-self: center;

    margin-top: 10px;

    padding: 11px 12px;

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #28bd9c,
            #14866f
        );

    color: #fff;

    font-size: 14px;
    font-weight: 1000;

    cursor: pointer;

    box-shadow:
        0 8px 20px
        rgba(20,134,111,.22);

    transition:
        transform .15s ease,
        filter .15s ease;
}

.free-status:hover {
    filter: brightness(1.08);
}

.free-status:active {
    transform: scale(.98);
}

.free-status.cooldown {
    background:
        linear-gradient(
            135deg,
            #182b38,
            #14212d
        );

    color: #91d7ff;

    border-color:
        rgba(117,200,255,.25);
}


/* =====================================================
   МОБИЛЬНЫЕ УСТРОЙСТВА
===================================================== */

@media(max-width:500px) {

    .case-image-card {
        width: 100%;
    }

    .case-image-button {
        border-radius: 19px;

        aspect-ratio: 1477 / 457;

        box-shadow:
            0 14px 32px rgba(0,0,0,.45);
    }

    .case-image-button:hover {
        transform: none;
    }

    .case-image-button:hover .case-image {
        transform: none;
    }

    .case-image-button:active {
        transform: scale(.975);
    }

    .free-status {
        width: 88%;
    }

}


@media(max-width:380px) {

    .case-image-button {
        border-radius: 17px;
    }

}

</style>
