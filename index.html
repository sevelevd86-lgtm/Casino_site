<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DROP</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;font-family:'Inter',-apple-system,sans-serif}
        body{background:#0a0a0f;color:#fff;min-height:100vh;display:flex;flex-direction:column;padding-bottom:70px}
        ::-webkit-scrollbar{width:3px}
        ::-webkit-scrollbar-track{background:#0a0a0f}
        ::-webkit-scrollbar-thumb{background:#f0b90b;border-radius:10px}
        
        .loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0f;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity .5s ease}
        .loading-overlay.hide{opacity:0;pointer-events:none}
        .loading-spinner{width:40px;height:40px;border:2px solid rgba(240,185,11,0.04);border-top:2px solid #f0b90b;border-radius:50%;animation:spin 1s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .loading-text{color:#555;font-size:13px;margin-top:12px;letter-spacing:2px;animation:pulse 1.5s ease-in-out infinite}
        @keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}
        
        .top-bar{background:rgba(13,13,20,0.6);backdrop-filter:blur(20px);padding:10px 16px;border-bottom:1px solid rgba(240,185,11,0.04);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
        .top-bar .back-btn{background:none;border:none;color:#888;font-size:14px;cursor:pointer;font-weight:400;padding:4px 8px;transition:color .2s}
        .top-bar .back-btn:active{color:#f0b90b}
        .top-bar .online{color:#555;font-size:12px;display:flex;align-items:center;gap:6px}
        .top-bar .online .dot{display:inline-block;width:6px;height:6px;background:#2ecc71;border-radius:50%;animation:pulse-dot 1.5s ease-in-out infinite}
        @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:0.2}}
        .top-bar .balance{color:#f0b90b;font-weight:600;font-size:14px;background:rgba(240,185,11,0.04);padding:4px 12px;border-radius:30px;border:1px solid rgba(240,185,11,0.04);cursor:pointer;transition:all .15s}
        .top-bar .balance:active{transform:scale(0.95)}
        
        .page{display:none;flex-direction:column;flex:1;padding:12px 14px 20px;animation:fade .3s ease}
        .page.active{display:flex}
        @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        
        .luck-section{display:flex;gap:6px;margin-bottom:10px}
        .luck-card{flex:1;background:rgba(26,26,36,0.3);border-radius:12px;padding:8px 10px;border:1px solid rgba(255,255,255,0.02);text-align:center}
        .luck-card .label{color:#555;font-size:8px;text-transform:uppercase;letter-spacing:0.5px}
        .luck-card .name{color:#f0b90b;font-size:14px;font-weight:600;margin-top:1px}
        .luck-card .value{color:#2ecc71;font-size:12px;font-weight:500}
        .luck-card .value .fire{color:#ff6b35}
        
        /* ===== ШАРИК — ТОЧНО КАК НА IMG_0724 ===== */
        .ball-escape-container{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:400px;margin:0 auto;width:100%}
        
        .ball-escape-header{display:flex;justify-content:space-between;width:100%;max-width:340px;padding:3px 10px;background:rgba(13,13,20,0.4);border-radius:30px;border:1px solid rgba(255,255,255,0.02)}
        .ball-escape-header .multiplier{color:#f0b90b;font-size:10px;font-weight:500}
        .ball-escape-header .hash{color:#555;font-size:9px;font-family:monospace}

        .ball-escape-map{position:relative;width:320px;height:340px;background:rgba(13,13,20,0.4);border-radius:20px;border:1px solid rgba(255,255,255,0.02);overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,0.3)}
        
        /* ===== КРУГ — КАК НА СКРИНЕ ===== */
        .ball-escape-circle-wrapper{position:absolute;top:20px;left:50%;transform:translateX(-50%);width:200px;height:200px;border-radius:50%;background:rgba(20,20,30,0.6);border:2px solid rgba(255,255,255,0.04);box-shadow:none}
        .ball-escape-rotation-layer{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;transition:transform 0.05s linear;will-change:transform}
        .ball-escape-circle{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;background:rgba(10,10,18,0.5)}
        
        /* ===== ДЫРКА (разрыв) — УЗКАЯ, ЧЁРНАЯ, ВНИЗУ ===== */
        .ball-escape-hole{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:28px;height:8px;background:#0a0a0f;z-index:2;border-radius:0 0 50% 50% / 0 0 100% 100%;border-bottom:2px solid rgba(255,255,255,0.02);box-shadow:inset 0 -4px 8px rgba(0,0,0,0.8)}
        .ball-escape-hole::before{content:'';position:absolute;top:-2px;left:-4px;right:-4px;height:6px;background:#0a0a0f;border-radius:50%}

        /* ===== ШАРИК — МАЛЕНЬКИЙ, ЯРКО-ЖЁЛТЫЙ ===== */
        .ball-escape-ball{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fff, #f0b90b);box-shadow:0 0 20px rgba(240,185,11,0.15), 0 2px 8px rgba(0,0,0,0.5);z-index:5;transition:none;will-change:transform;top:50%;left:50%;transform:translate(-50%,-50%)}
        .ball-escape-hit{color:#f0b90b;font-size:11px;position:absolute;z-index:3;pointer-events:none;animation:floatUp .9s ease forwards;font-weight:700;text-shadow:0 0 20px rgba(240,185,11,0.15)}
        @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(1.1)}}

        .ball-escape-zones{position:absolute;bottom:0;left:0;right:0;height:40px;display:flex;border-radius:0 0 20px 20px;overflow:hidden;border-top:1px solid rgba(255,255,255,0.02)}
        .ball-escape-zones .zone{flex:1;display:flex;justify-content:center;align-items:center;font-size:22px;font-weight:700;transition:all .4s;position:relative}
        .ball-escape-zones .zone.green{background:rgba(46,204,113,0.04);color:#2ecc71;border-right:1px solid rgba(255,255,255,0.01)}
        .ball-escape-zones .zone.red{background:rgba(231,76,60,0.04);color:#e74c3c}
        .ball-escape-zones .zone.active.green{background:rgba(46,204,113,0.18);box-shadow:inset 0 0 60px rgba(46,204,113,0.06)}
        .ball-escape-zones .zone.active.red{background:rgba(231,76,60,0.18);box-shadow:inset 0 0 60px rgba(231,76,60,0.06)}
        .ball-escape-zones .zone .zone-label{position:absolute;bottom:3px;font-size:8px;color:rgba(255,255,255,0.06);text-transform:uppercase;letter-spacing:1px}

        .ball-escape-info{display:flex;justify-content:space-between;width:100%;max-width:340px;padding:3px 10px;background:rgba(13,13,20,0.3);border-radius:30px;border:1px solid rgba(255,255,255,0.02)}
        .ball-escape-info .item{text-align:center;font-size:8px;color:#555;flex:1}
        .ball-escape-info .item span{display:block;font-size:13px;font-weight:600;color:#f0b90b;margin-top:1px}
        .ball-escape-info .item .multiplier{font-size:20px;color:#f0b90b;font-weight:700}

        .ball-escape-bet-row{display:flex;gap:6px;width:100%;max-width:340px;flex-direction:column;align-items:center}
        .ball-escape-bet-row .bet-input-row{display:flex;gap:6px;width:100%}
        .ball-escape-bet-input{flex:1;background:rgba(10,10,15,0.4);border:1px solid rgba(255,255,255,0.02);border-radius:50px;padding:8px 12px;color:#fff;font-size:13px;text-align:center;outline:none}
        .ball-escape-bet-input:focus{border-color:rgba(240,185,11,0.04)}
        .ball-escape-bet-btn{flex:1;padding:8px;border-radius:50px;border:none;font-weight:600;font-size:13px;cursor:pointer;transition:all .1s;background:#f0b90b;color:#0a0a0f}
        .ball-escape-bet-btn:active{transform:scale(0.95)}
        .ball-escape-bet-btn:disabled{opacity:0.3;pointer-events:none}
        .ball-escape-error{color:#e74c3c;font-size:11px;font-weight:500;height:18px;text-align:center}

        .ball-escape-modes{display:flex;gap:4px;width:100%;max-width:340px}
        .ball-escape-modes .mode{flex:1;padding:5px;border-radius:30px;border:none;font-weight:600;font-size:10px;cursor:pointer;background:rgba(13,13,20,0.3);border:1px solid rgba(255,255,255,0.02);color:#555;transition:all .15s;text-transform:uppercase;letter-spacing:0.5px}
        .ball-escape-modes .mode.active{background:rgba(240,185,11,0.04);border-color:rgba(240,185,11,0.04);color:#f0b90b}
        .ball-escape-modes .mode:active{transform:scale(0.95)}

        .ball-escape-nav{display:flex;gap:2px;width:100%;max-width:340px;margin-top:4px}
        .ball-escape-nav .nav-btn{flex:1;padding:5px;border-radius:30px;border:none;font-weight:500;font-size:9px;cursor:pointer;background:rgba(13,13,20,0.2);border:1px solid rgba(255,255,255,0.02);color:#444;transition:all .15s;text-transform:uppercase;letter-spacing:0.3px}
        .ball-escape-nav .nav-btn:active{transform:scale(0.95)}
        .ball-escape-nav .nav-btn.active{color:#f0b90b;border-color:rgba(240,185,11,0.02)}
        
        .menu-hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
        .menu-hero h1{font-size:48px;font-weight:200;color:#f0b90b;letter-spacing:6px}
        .menu-hero .subtitle{color:#555;font-size:13px;margin-top:4px;letter-spacing:3px}
        .menu-hero .game-btn{background:rgba(240,185,11,0.04);color:#f0b90b;padding:12px 40px;border-radius:50px;font-size:14px;font-weight:500;border:1px solid rgba(240,185,11,0.06);cursor:pointer;margin-top:16px;width:80%;max-width:240px;transition:all .2s;letter-spacing:1px}
        .menu-hero .game-btn:active{transform:scale(0.96);background:rgba(240,185,11,0.08)}
        .menu-hero .game-btn.secondary{border-color:rgba(255,255,255,0.03);color:#888}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(13,13,20,0.85);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.02);display:flex;justify-content:space-around;padding:6px 0 12px;z-index:100}
        .nav-item{display:flex;flex-direction:column;align-items:center;color:#444;font-size:9px;cursor:pointer;padding:4px 8px;background:none;border:none;font-family:inherit;flex:1;max-width:70px;transition:color .15s;gap:1px}
        .nav-item .icon{font-size:20px;margin-bottom:1px;transition:transform .15s}
        .nav-item:active .icon{transform:scale(0.85)}
        .nav-item.active{color:#f0b90b}
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(26,26,36,0.7);border:1px solid rgba(240,185,11,0.02);padding:8px 18px;border-radius:50px;color:#fff;font-weight:500;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center;font-size:11px;backdrop-filter:blur(12px)}
        .toast.show{opacity:1}
        .toast.error{border-color:rgba(231,76,60,0.05);color:#e74c3c}
        .toast.success{border-color:rgba(46,204,113,0.05);color:#2ecc71}
        
        @media(max-width:420px){.ball-escape-map{width:280px;height:300px}.ball-escape-circle-wrapper{width:170px;height:170px}.ball-escape-bet-row,.ball-escape-modes,.ball-escape-nav,.ball-escape-info{max-width:280px}.ball-escape-header{max-width:280px;flex-wrap:wrap;gap:4px}.luck-card .name{font-size:12px}}
    </style>
</head>
<body>

    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">ЗАГРУЗКА</div>
    </div>

    <div id="toast" class="toast"></div>

    <div class="top-bar">
        <button class="back-btn" id="backBtn" onclick="goBack()">← Назад</button>
        <span class="online"><span class="dot"></span> <span id="onlineCount">8</span> онлайн</span>
        <span class="balance" id="top-balance" onclick="openDeposit()">0.03 GRAM</span>
    </div>

    <div id="page-menu" class="page active">
        <div class="menu-hero">
            <h1>DROP</h1>
            <div style="font-size:40px;margin:4px 0;opacity:0.2;">⏤</div>
            <div class="subtitle">Добро пожаловать</div>
            <button class="game-btn" onclick="switchToGame('ball')">Шарик</button>
            <button class="game-btn secondary" onclick="switchToGame('cases')">Кейсы</button>
            <button class="game-btn secondary" onclick="switchToGame('upgrade')">Апгрейд</button>
        </div>
    </div>

    <div id="page-games" class="page">
        <div id="game-content"></div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item" data-page="page-inventory" onclick="switchPage('page-inventory')"><span class="icon">⏤</span><span>Инвентарь</span></button>
        <button class="nav-item active" data-page="page-menu" onclick="switchPage('page-menu')"><span class="icon">⏤</span><span>Меню</span></button>
        <button class="nav-item" data-page="page-profile" onclick="switchPage('page-profile')"><span class="icon">⏤</span><span>Профиль</span></button>
    </div>

    <script>
        window.addEventListener('load', function() {
            setTimeout(function() { document.getElementById('loading-overlay').classList.add('hide'); }, 1500);
            updateUI();
            renderBall(document.getElementById('game-content'));
        });

        let balance = 0.03, inventory = [], usedPromoCodes = [], history = [], achievements = { casesOpened: 0, itemsSold: 0, upgradesDone: 0 }, lastDailyBonus = 0;
        let ballMode = 'lite';
        let ballGameActive = false;
        let ballInterval = null, ballRotationInterval = null, ballExitTimer = null;
        let ballMultiplier = 1.0, ballHits = 0, ballRotationAngle = 0, ballIsWaitingForExit = false, ballBet = 0.1;

        function updateUI() {
            document.getElementById('top-balance').textContent = balance.toFixed(2) + ' GRAM';
            const err = document.getElementById('ballError');
            if (err) {
                if (ballBet > balance) err.textContent = 'Недостаточно средств';
                else err.textContent = '';
            }
        }
        function saveData() { localStorage.setItem('casino_data', JSON.stringify({ balance, inventory, usedPromoCodes, history, achievements, lastDailyBonus })); }
        function loadData() {
            try { const raw = localStorage.getItem('casino_data'); if (!raw) return; const data = JSON.parse(raw); if (data.balance !== undefined) balance = data.balance; if (data.inventory) inventory = data.inventory; if (data.usedPromoCodes) usedPromoCodes = data.usedPromoCodes; if (data.history) history = data.history; if (data.achievements) achievements = data.achievements; if (data.lastDailyBonus) lastDailyBonus = data.lastDailyBonus; updateUI(); } catch (e) {}
        }
        function showToast(msg, type = 'info', duration = 3000) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'toast ' + type; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(() => { t.classList.remove('show'); }, duration); }
        function addHistory(desc, amount) { history.unshift({ desc, amount, time: new Date().toLocaleString() }); if (history.length > 50) history.pop(); saveData(); }
        function switchPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById(id).classList.add('active'); document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active')); const btn = document.querySelector(`.nav-item[data-page="${id}"]`); if (btn) btn.classList.add('active'); }
        function goBack() { switchPage('page-menu'); }
        function switchToGame(game) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-games').classList.add('active');
            const content = document.getElementById('game-content');
            if (game === 'ball') renderBall(content);
            else if (game === 'cases') renderCases(content);
            else renderUpgrade(content);
        }
        function openDeposit() { showToast('💰 Пополнение: +100 GRAM', 'success'); balance += 100; updateUI(); saveData(); }

        function renderBall(content) {
            const hash = 'd0d5' + Math.random().toString(36).substring(2, 6) + 'af51';
            content.innerHTML = `
                <div class="luck-section">
                    <div class="luck-card"><div class="label">Удача недели</div><div class="name">VLAKOS</div><div class="value">+3.8 <span class="fire">🔥</span></div></div>
                    <div class="luck-card"><div class="label">Удача дня</div><div class="name">VLAKOS</div><div class="value">+3.8 <span class="fire">🔥</span></div></div>
                </div>
                <div class="ball-escape-container">
                    <div class="ball-escape-header">
                        <span class="multiplier">Каждый отскок: +<span id="hitMultiplier">0.15</span>x</span>
                        <span class="hash" id="gameHash">Хеш: ${hash}</span>
                    </div>
                    <div class="ball-escape-map">
                        <div class="ball-escape-circle-wrapper">
                            <div class="ball-escape-rotation-layer" id="ballRotationLayer">
                                <div class="ball-escape-circle" id="ballCircle">
                                    <div class="ball-escape-ball" id="ball"></div>
                                    <div class="ball-escape-hole"></div>
                                </div>
                            </div>
                        </div>
                        <div class="ball-escape-zones">
                            <div class="zone green" id="zoneGreen">💸<span class="zone-label">win</span></div>
                            <div class="zone red" id="zoneRed">💀<span class="zone-label">lose</span></div>
                        </div>
                    </div>
                    <div class="ball-escape-info">
                        <div class="item">Ставка<br><span id="ballBetDisplay">${ballBet.toFixed(1)} GRAM</span></div>
                        <div class="item">Множитель<br><span class="multiplier" id="ballMultiplierDisplay">x1.0</span></div>
                        <div class="item">Результат<br><span id="ballResultDisplay">...</span></div>
                    </div>
                    <div class="ball-escape-bet-row">
                        <div class="bet-input-row">
                            <input type="number" class="ball-escape-bet-input" id="ballBetInput" value="${ballBet}" min="0.1" step="0.1" placeholder="Ставка" oninput="updateBet()">
                            <button class="ball-escape-bet-btn" id="ballStartBtn" onclick="startBallGame()">Запустить</button>
                        </div>
                        <div class="ball-escape-error" id="ballError"></div>
                    </div>
                    <div class="ball-escape-modes">
                        <button class="mode ${ballMode==='lite'?'active':''}" onclick="setBallMode('lite')">Lite</button>
                        <button class="mode ${ballMode==='mid'?'active':''}" onclick="setBallMode('mid')">Mid</button>
                        <button class="mode ${ballMode==='epic'?'active':''}" onclick="setBallMode('epic')">Epic</button>
                    </div>
                    <div class="ball-escape-nav">
                        <button class="nav-btn active">Маркет</button>
                        <button class="nav-btn">Соло Ха6</button>
                        <button class="nav-btn">Арена</button>
                        <button class="nav-btn">Ивент</button>
                    </div>
                </div>
            `;
            resetBallGame();
            document.getElementById('gameHash').textContent = 'Хеш: ' + hash;
            updateUI();
        }

        function updateBet() {
            const val = parseFloat(document.getElementById('ballBetInput').value) || 0;
            ballBet = val;
            document.getElementById('ballBetDisplay').textContent = val.toFixed(1) + ' GRAM';
            updateUI();
        }

        function setBallMode(mode) {
            ballMode = mode;
            document.querySelectorAll('.ball-escape-modes .mode').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.ball-escape-modes .mode').forEach(b => {
                if (b.textContent.toLowerCase() === mode) b.classList.add('active');
            });
            const multipliers = { lite: 0.15, mid: 0.25, epic: 0.40 };
            document.getElementById('hitMultiplier').textContent = multipliers[mode];
            showToast(`Режим: ${mode}`, 'info', 1500);
        }

        function resetBallGame() {
            if (ballInterval) { clearInterval(ballInterval); ballInterval = null; }
            if (ballRotationInterval) { clearInterval(ballRotationInterval); ballRotationInterval = null; }
            if (ballExitTimer) { clearTimeout(ballExitTimer); ballExitTimer = null; }
            ballGameActive = false;
            ballIsWaitingForExit = false;
            ballMultiplier = 1.0;
            ballHits = 0;
            ballRotationAngle = 0;
            const ball = document.getElementById('ball');
            if (ball) { ball.style.top = '50%'; ball.style.left = '50%'; ball.style.transform = 'translate(-50%,-50%)'; ball.style.display = 'block'; }
            const layer = document.getElementById('ballRotationLayer');
            if (layer) layer.style.transform = 'rotate(0deg)';
            document.querySelectorAll('.zone').forEach(z => z.classList.remove('active'));
            document.getElementById('ballMultiplierDisplay').textContent = 'x1.0';
            document.getElementById('ballResultDisplay').textContent = '...';
            const btn = document.getElementById('ballStartBtn');
            if (btn) { btn.disabled = false; btn.textContent = 'Запустить'; }
            updateUI();
        }

        function startBallGame() {
            if (ballGameActive) return;
            const betInput = document.getElementById('ballBetInput');
            let bet = parseFloat(betInput.value) || 0.1;
            if (bet < 0.1) { showToast('❌ Минимум 0.1 GRAM', 'error'); return; }
            if (bet > balance) { showToast('❌ Недостаточно средств', 'error'); return; }
            ballBet = bet;
            balance -= ballBet;
            updateUI();
            saveData();
            document.getElementById('ballBetDisplay').textContent = ballBet.toFixed(1) + ' GRAM';
            document.getElementById('ballError').textContent = '';
            const btn = document.getElementById('ballStartBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Игра...';
            ballGameActive = true;
            ballIsWaitingForExit = false;
            ballMultiplier = 1.0;
            ballHits = 0;
            document.getElementById('ballMultiplierDisplay').textContent = 'x1.0';
            document.getElementById('ballResultDisplay').textContent = '...';
            document.querySelectorAll('.zone').forEach(z => z.classList.remove('active'));

            if (ballRotationInterval) clearInterval(ballRotationInterval);
            ballRotationInterval = setInterval(() => {
                ballRotationAngle += 1.2;
                document.getElementById('ballRotationLayer').style.transform = `rotate(${ballRotationAngle}deg)`;
            }, 30);

            const circle = document.getElementById('ballCircle');
            const ball = document.getElementById('ball');
            const circleRect = circle.getBoundingClientRect();
            const centerX = circleRect.width / 2;
            const centerY = circleRect.height / 2;
            let x = centerX, y = centerY - 15;
            let dx = (Math.random() - 0.5) * 3.0;
            let dy = -0.3;
            const radius = 7;
            const GRAVITY = 0.25, BOUNCE = 0.82;

            if (ballInterval) clearInterval(ballInterval);
            let lastHitTime = 0;
            const startTime = Date.now();

            ballInterval = setInterval(() => {
                if (!ballGameActive) { clearInterval(ballInterval); return; }
                const elapsed = Date.now() - startTime;
                dy += GRAVITY;
                x += dx;
                y += dy;
                let hitWall = false;

                if (x - radius < 0 || x + radius > circleRect.width) { dx *= -BOUNCE; x = Math.max(radius, Math.min(circleRect.width - radius, x)); hitWall = true; }
                if (y - radius < 0 || y + radius > circleRect.height) { dy *= -BOUNCE; y = Math.max(radius, Math.min(circleRect.height - radius, y)); hitWall = true; }

                const holeX = circleRect.width / 2, holeY = circleRect.height;
                const distToHole = Math.sqrt((x - holeX) ** 2 + (y - holeY) ** 2);
                if (distToHole < 25 && y > circleRect.height - 28) { dy *= -0.4; y = circleRect.height - 28; hitWall = true; }

                if (hitWall && Date.now() - lastHitTime > 150) {
                    ballHits++;
                    lastHitTime = Date.now();
                    const hm = { lite: 0.15, mid: 0.25, epic: 0.40 }[ballMode] || 0.15;
                    ballMultiplier = 1 + ballHits * hm;
                    document.getElementById('ballMultiplierDisplay').textContent = 'x' + ballMultiplier.toFixed(2);

                    const hitEffect = document.createElement('div');
                    hitEffect.className = 'ball-escape-hit';
                    hitEffect.textContent = '+' + (ballMultiplier - 1).toFixed(2) + 'x';
                    hitEffect.style.left = x + 'px';
                    hitEffect.style.top = y - 14 + 'px';
                    document.getElementById('ballCircle').appendChild(hitEffect);
                    setTimeout(() => hitEffect.remove(), 900);
                }

                ball.style.top = y + 'px';
                ball.style.left = x + 'px';

                const isNearHole = y > circleRect.height - 16 && Math.abs(x - holeX) < 18;
                const isFallingDown = dy > 0.5;
                if (isNearHole && isFallingDown && elapsed > 1500 && !ballIsWaitingForExit) {
                    ballIsWaitingForExit = true;
                    ballExitTimer = setTimeout(() => {
                        if (!ballGameActive) return;
                        ballGameActive = false;
                        clearInterval(ballInterval);
                        clearInterval(ballRotationInterval);
                        let redChance = 0.30 + (ballMultiplier - 1) * 0.06;
                        if (redChance > 0.88) redChance = 0.88;
                        const isWin = Math.random() > redChance;
                        if (isWin) {
                            const winAmount = Math.round(ballBet * ballMultiplier * 100) / 100;
                            balance += winAmount;
                            addHistory(`Шарик: выигрыш x${ballMultiplier.toFixed(2)}`, winAmount);
                            document.getElementById('zoneGreen').classList.add('active');
                            document.getElementById('ballResultDisplay').textContent = `💸 +${winAmount.toFixed(2)} GRAM`;
                            showToast(`💸 Выигрыш! +${winAmount.toFixed(2)} GRAM (x${ballMultiplier.toFixed(2)})`, 'success', 3500);
                        } else {
                            addHistory(`Шарик: проигрыш -${ballBet.toFixed(2)}`, -ballBet);
                            document.getElementById('zoneRed').classList.add('active');
                            document.getElementById('ballResultDisplay').textContent = `💀 -${ballBet.toFixed(2)} GRAM`;
                            showToast(`💀 Проигрыш! -${ballBet.toFixed(2)} GRAM`, 'error', 3500);
                        }
                        updateUI();
                        saveData();
                        const btn2 = document.getElementById('ballStartBtn');
                        btn2.disabled = false;
                        btn2.textContent = 'Запустить';
                        ballExitTimer = null;
                        ballIsWaitingForExit = false;
                    }, 250 + Math.random() * 400);
                }
            }, 16);
        }

        function renderCases(content) { content.innerHTML = `<div style="color:#555;text-align:center;padding:40px 0;">Кейсы будут позже</div>`; }
        function renderUpgrade(content) { content.innerHTML = `<div style="color:#555;text-align:center;padding:40px 0;">Апгрейд будет позже</div>`; }

        loadData();
        updateUI();
        renderBall(document.getElementById('game-content'));
    </script>
</body>
</html>
