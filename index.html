<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Я 200</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at center,
            #111 0%,
            #050505 45%,
            #000 100%
        );
}


/* =========================
   ЗВЁЗДЫ
========================= */

.stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
}

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    background: white;
    border-radius: 50%;

    opacity: 0.6;

    animation:
        starMove linear infinite,
        starBlink ease-in-out infinite alternate;
}

@keyframes starMove {

    0% {
        transform: translateY(-15px);
    }

    50% {
        transform: translateY(15px);
    }

    100% {
        transform: translateY(-15px);
    }

}

@keyframes starBlink {

    0% {
        opacity: 0.25;
    }

    100% {
        opacity: 0.9;
    }

}


/* =========================
   БУКВЫ
========================= */

.letters {
    position: absolute;
    inset: 0;

    z-index: 5;

    pointer-events: none;
}

.letter {

    position: absolute;

    color: #fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: clamp(42px, 8vw, 90px);

    font-weight: 700;

    line-height: 1;

    white-space: nowrap;

    opacity: 0;

    transform:
        translate(-50%, -50%)
        scale(0.35);

    filter: blur(8px);

    text-shadow:
        0 0 5px #fff,
        0 0 12px #fff,
        0 0 25px rgba(255,255,255,0.95),
        0 0 50px rgba(255,255,255,0.7),
        0 0 90px rgba(255,255,255,0.35);
}

.letter.glow {

    animation:
        neonPulse
        2.5s
        ease-in-out
        infinite
        alternate;
}

@keyframes neonPulse {

    0% {
        text-shadow:
            0 0 4px #fff,
            0 0 10px #fff,
            0 0 20px rgba(255,255,255,.8),
            0 0 40px rgba(255,255,255,.35);
    }

    100% {
        text-shadow:
            0 0 7px #fff,
            0 0 18px #fff,
            0 0 35px rgba(255,255,255,1),
            0 0 75px rgba(255,255,255,.65);
    }

}


/* =========================
   СТИРАЛЬНАЯ МАШИНА
========================= */

.washing-machine {

    position: absolute;

    width: 75px;
    height: 64px;

    left: -100px;
    top: 40vh;

    background:
        linear-gradient(
            135deg,
            #fff 0%,
            #f7f7f7 30%,
            #e5e5e5 65%,
            #aaa 100%
        );

    border: 1px solid #888;

    border-radius: 6px;

    box-shadow:
        inset 4px 4px 8px rgba(255,255,255,.9),
        inset -5px -5px 10px rgba(0,0,0,.3),
        0 12px 30px rgba(0,0,0,.8);

    z-index: 10;

    will-change:
        left,
        top,
        transform;
}


/* =========================
   ПАНЕЛЬ
========================= */

.top-panel {

    position: absolute;

    width: 19px;
    height: 54px;

    right: 4px;
    top: 4px;

    background:
        linear-gradient(
            to right,
            #fff,
            #eee 50%,
            #c8c8c8
        );

    border: 1px solid #aaa;

    border-radius: 3px;
}

.display {

    position: absolute;

    width: 8px;
    height: 19px;

    left: 5px;
    top: 5px;

    background: #111;

    border: 1px solid #555;

    border-radius: 2px;
}

.button-small {

    position: absolute;

    width: 5px;
    height: 5px;

    left: 7px;
    top: 30px;

    border-radius: 50%;

    background: #999;
}

.button {

    position: absolute;

    width: 11px;
    height: 11px;

    left: 4px;
    top: 39px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff,
            #ccc 45%,
            #777
        );

    border: 1px solid #666;
}


/* =========================
   ОКНО
========================= */

.window {

    position: absolute;

    width: 45px;
    height: 45px;

    left: 6px;
    top: 10px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #eee,
            #aaa,
            #777
        );

    border: 2px solid #888;

    box-shadow:
        0 3px 7px rgba(0,0,0,.5),
        inset 1px 1px 2px rgba(255,255,255,.8),
        inset -2px -2px 4px rgba(0,0,0,.4);
}

.window-glass {

    position: absolute;

    width: 37px;
    height: 37px;

    left: 2px;
    top: 2px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #666,
            #333 30%,
            #111 65%,
            #000
        );

    border: 1px solid #555;

    box-shadow:
        inset 0 0 12px #000;
}

.window-glass::before {

    content: "";

    position: absolute;

    width: 24px;
    height: 8px;

    left: 4px;
    top: 4px;

    background:
        rgba(255,255,255,.16);

    border-radius: 50%;

    transform: rotate(-25deg);

    filter: blur(1px);
}

.bottom-line {

    position: absolute;

    left: 5px;
    right: 5px;

    bottom: 3px;

    height: 2px;

    background: #aaa;

    border-radius: 3px;
}


/* =========================
   МОБИЛЬНАЯ ВЕРСИЯ
========================= */

@media (max-width: 600px) {

    .washing-machine {
        width: 64px;
        height: 55px;
    }

    .top-panel {
        width: 16px;
        height: 46px;
    }

    .window {
        width: 39px;
        height: 39px;
        left: 5px;
        top: 8px;
    }

    .window-glass {
        width: 32px;
        height: 32px;
    }

    .letter {
        font-size: 42px;
    }
}


/* =========================
   РАСПОЛОЖЕНИЕ ЗВЁЗД
========================= */

.star:nth-child(1)  { left: 3%;  top: 8%; }
.star:nth-child(2)  { left: 7%;  top: 23%; }
.star:nth-child(3)  { left: 11%; top: 71%; }
.star:nth-child(4)  { left: 15%; top: 42%; }
.star:nth-child(5)  { left: 19%; top: 12%; }

.star:nth-child(7)  { left: 27%; top: 35%; }

.star:nth-child(9)  { left: 35%; top: 5%; }
.star:nth-child(10) { left: 39%; top: 52%; }

.star:nth-child(11) { left: 43%; top: 18%; }
.star:nth-child(12) { left: 47%; top: 76%; }
.star:nth-child(13) { left: 51%; top: 7%; }
.star:nth-child(14) { left: 55%; top: 44%; }
.star:nth-child(15) { left: 59%; top: 91%; }
.star:nth-child(16) { left: 63%; top: 27%; }
.star:nth-child(17) { left: 67%; top: 61%; }
.star:nth-child(18) { left: 71%; top: 14%; }
.star:nth-child(19) { left: 75%; top: 82%; }
.star:nth-child(20) { left: 79%; top: 37%; }

.star:nth-child(21) { left: 83%; top: 6%; }
.star:nth-child(22) { left: 87%; top: 53%; }
.star:nth-child(23) { left: 91%; top: 24%; }
.star:nth-child(24) { left: 95%; top: 72%; }
.star:nth-child(25) { left: 5%;  top: 92%; }
.star:nth-child(26) { left: 13%; top: 56%; }
.star:nth-child(27) { left: 21%; top: 48%; }
.star:nth-child(28) { left: 29%; top: 95%; }
.star:nth-child(29) { left: 37%; top: 29%; }
.star:nth-child(30) { left: 45%; top: 68%; }
.star:nth-child(31) { left: 53%; top: 33%; }
.star:nth-child(32) { left: 61%; top: 88%; }
.star:nth-child(33) { left: 69%; top: 46%; }

.star:nth-child(35) { left: 85%; top: 93%; }
.star:nth-child(36) { left: 93%; top: 41%; }

</style>
</head>

<body>

<div class="scene">

    <div class="stars">

        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>

        <div class="star"></div>

        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>

        <div class="star"></div>

        <div class="star"></div>

    </div>

    <div
        class="letters"
        id="letters">
    </div>

    <div
        class="washing-machine"
        id="washingMachine">

        <div class="top-panel">

            <div class="display"></div>

            <div class="button-small"></div>

            <div class="button"></div>

        </div>

        <div class="window">

            <div class="window-glass"></div>

        </div>

        <div class="bottom-line"></div>

    </div>

</div>


<script>

/* =========================
   ЭЛЕМЕНТЫ
========================= */

const machine =
    document.getElementById("washingMachine");

const lettersContainer =
    document.getElementById("letters");


/* =========================
   НОВАЯ НАДПИСЬ
========================= */

const words = [
    "Я",
    "200"
];


/* =========================
   НАСТРОЙКИ
========================= */

const START_DELAY = 3000;

const LETTER_DELAY = 430;

const WORD_DELAY = 900;

const DURATION = 9500;

const LETTER_FLY_TIME = 850;


/* =========================
   ВСЕ БУКВЫ
========================= */

const letters = [];

words.forEach((word, wordIndex) => {

    [...word].forEach((char) => {

        letters.push({
            char: char,
            word: wordIndex
        });

    });

});


/* =========================
   ТРАЕКТОРИЯ
========================= */

function getMachinePosition(progress) {

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    const startX = -100;

    const endX =
        width + 100;

    const centerY =
        height * 0.53;

    const arcHeight =
        Math.min(
            height * 0.30,
            260
        );

    const x =
        startX +
        (endX - startX) *
        progress;

    const y =
        centerY -
        Math.sin(
            progress * Math.PI
        ) *
        arcHeight;

    const angle =
        -Math.cos(
            progress * Math.PI
        ) * 12;

    return {
        x,
        y,
        angle
    };

}


/* =========================
   СОЗДАНИЕ БУКВЫ
========================= */

function createLetter(
    character,
    index,
    wordIndex,
    machinePosition
) {

    const letter =
        document.createElement("span");

    letter.className =
        "letter glow";

    letter.textContent =
        character;

    const startX =
        machinePosition.x + 35;

    const startY =
        machinePosition.y + 32;

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    const centerX =
        width * 0.55;

    const centerY =
        height * 0.43;

    /*
       Расстояние между буквами.
    */

    const letterSpacing =
        Math.min(
            width * 0.088,
            88
        );

    const word =
        words[wordIndex];

    let sameWordIndex = 0;

    for (
        let i = 0;
        i < index;
        i++
    ) {

        if (
            letters[i].word === wordIndex
        ) {

            sameWordIndex++;

        }

    }

    const wordWidth =
        (word.length - 1) *
        letterSpacing;

    const wordGap =
        letterSpacing * 1.8;

    let wordCenterX;

    if (wordIndex === 0) {

        wordCenterX =
            centerX -
            wordGap / 2 -
            wordWidth / 2;

    } else {

        wordCenterX =
            centerX +
            wordGap / 2 +
            wordWidth / 2;

    }

    const finalX =
        wordCenterX -
        wordWidth / 2 +
        sameWordIndex *
        letterSpacing;

    const finalY =
        centerY;

    const randomOffset =
        (Math.random() - 0.5) * 12;

    const targetY =
        finalY +
        randomOffset;

    letter.style.left =
        startX + "px";

    letter.style.top =
        startY + "px";

    letter.style.opacity =
        "0";

    letter.style.filter =
        "blur(8px)";

    letter.style.transform =
        "translate(-50%, -50%) scale(0.3)";

    lettersContainer.appendChild(
        letter
    );

    const animationStart =
        performance.now();

    function animateLetter(now) {

        const elapsed =
            now -
            animationStart;

        let progress =
            elapsed /
            LETTER_FLY_TIME;

        if (progress > 1) {

            progress = 1;

        }

        const eased =
            1 -
            Math.pow(
                1 - progress,
                3
            );

        const currentX =
            startX +
            (finalX - startX) *
            eased;

        const currentY =
            startY +
            (targetY - startY) *
            eased;

        letter.style.left =
            currentX + "px";

        letter.style.top =
            currentY + "px";

        letter.style.opacity =
            Math.min(
                1,
                progress * 4
            );

        const scale =
            0.3 +
            0.7 *
            Math.min(
                1,
                progress * 1.5
            );

        letter.style.transform =
            `translate(-50%, -50%) scale(${scale})`;

        const blur =
            Math.max(
                0,
                8 -
                progress * 10
            );

        letter.style.filter =
            `blur(${blur}px)`;

        if (progress < 1) {

            requestAnimationFrame(
                animateLetter
            );

        } else {

            letter.style.left =
                finalX + "px";

            letter.style.top =
                targetY + "px";

            letter.style.opacity =
                "1";

            letter.style.filter =
                "blur(0)";

            letter.style.transform =
                "translate(-50%, -50%) scale(1)";

        }

    }

    requestAnimationFrame(
        animateLetter
    );

}


/* =========================
   ПОЛЁТ
========================= */

let startTime = null;

let nextLetterTime =
    START_DELAY;

let letterIndex = 0;

let finished = false;


function animate(time) {

    if (finished) {
        return;
    }

    if (startTime === null) {

        startTime = time;

    }

    const elapsed =
        time -
        startTime;

    let progress =
        elapsed /
        DURATION;

    if (progress > 1) {

        progress = 1;

    }

    const position =
        getMachinePosition(
            progress
        );

    machine.style.left =
        position.x + "px";

    machine.style.top =
        position.y + "px";

    machine.style.transform =
        `rotate(${position.angle}deg)`;


    /* =========================
       ВЫПУСК БУКВ
    ========================= */

    if (
        elapsed >= nextLetterTime &&
        letterIndex < letters.length
    ) {

        const item =
            letters[letterIndex];

        if (
            letterIndex === 0
        ) {

            nextLetterTime +=
                WORD_DELAY;

        } else {

            nextLetterTime +=
                LETTER_DELAY;

        }

        createLetter(
            item.char,
            letterIndex,
            item.word,
            position
        );

        letterIndex++;

    }


    /* =========================
       КОНЕЦ ПОЛЁТА
    ========================= */

    if (progress >= 1) {

        const finalPosition =
            getMachinePosition(1);

        machine.style.left =
            finalPosition.x + "px";

        machine.style.top =
            finalPosition.y + "px";

        machine.style.transform =
            `rotate(${finalPosition.angle}deg)`;

        finished = true;

        return;
    }


    requestAnimationFrame(
        animate
    );

}


/* =========================
   СТАРТ
========================= */

requestAnimationFrame(
    animate
);

</script>

</body>
