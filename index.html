<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Круг</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0a0f;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
        
        .circle-wrapper{
            width:200px;
            height:200px;
            border-radius:50%;
            background:rgba(30,60,114,0.1);
            border:3px solid rgba(52,102,184,0.3);
            box-shadow:0 0 40px rgba(52,102,184,0.05), inset 0 0 60px rgba(52,102,184,0.05);
            display:flex;
            justify-content:center;
            align-items:center;
            animation:spin 4s linear infinite;
        }
        
        .circle{
            width:100%;
            height:100%;
            border-radius:50%;
            background:radial-gradient(circle at 50% 50%, rgba(52,102,184,0.05), rgba(20,40,80,0.1));
        }
        
        @keyframes spin{
            0%{transform:rotate(0deg)}
            100%{transform:rotate(360deg)}
        }
    </style>
</head>
<body>
    <div class="circle-wrapper">
        <div class="circle"></div>
    </div>
</body>
</html>
