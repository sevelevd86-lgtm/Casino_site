<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flying Washing Machine</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

.scene {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
}


/* =========================================
   ЗВЁЗДЫ
========================================= */

.stars {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
}

.star {
    position: absolute;

    width: 2px;
    height: 2px;

    background: white;

    border-radius: 50%;

    opacity: 0.7;

    animation:
        starMove linear infinite,
        starTwinkle ease-in-out infinite alternate;
}


/* Движение звёзд */

@keyframes starMove {

    0% {
        transform: translateY(-20px);
    }

    100% {
        transform: translateY(20px);
    }

}


/* Лёгкое мерцание */

@keyframes starTwinkle {

    0% {
        opacity: 0.25;
    }

    100% {
        opacity: 0.9;
    }

}


/* =========================================
   СТИРАЛЬНАЯ МАШИНА
========================================= */

.washing-machine {

    position: absolute;

    width: 83px;
    height: 70px;

    left: -100px;
    top: 35vh;

    background:
        linear-gradient(
            135deg,
            #ffffff 0%,
            #f7f7f7 30%,
            #e5e5e5 70%,
            #bdbdbd 100%
        );

    border: 1px solid #888;

    border-radius: 5px;

    box-shadow:
        inset 4px 4px 8px rgba(255,255,255,0.9),
        inset -4px -4px 9px rgba(0,0,0,0.2),
        0 10px 20px rgba(0,0,0,0.7);

    animation: flyMachine 8s linear infinite;

    will-change: left, top, transform;

    z-index: 10;
}


/* =========================================
   ПАНЕЛЬ
========================================= */

.top-panel {

    position: absolute;

    width: 20px;
    height: 60px;

    right: 4px;
    top: 4px;

    background:
        linear-gradient(
            to right,
            #ffffff,
            #eeeeee 50%,
            #cecece
        );

    border: 1px solid #aaa;

    border-radius: 3px;
}


/* =========================================
   ЭКРАН
========================================= */

.display {

    position: absolute;

    width: 9px;
    height: 21px;

    left: 5px;
    top: 6px;

    background: #111;

    border: 1px solid #555;

    border-radius: 2px;
}

.display::after {

    content: '1:20';

    position: absolute;

    left: 1px;
    top: 3px;

    font-family: Arial, sans-serif;

    font-size: 4px;

    color: #aaffbd;

    writing-mode: vertical-rl;
}


/* =========================================
   МАЛЕНЬКАЯ КНОПКА
========================================= */

.button-small {

    position: absolute;

    width: 5px;
    height: 5px;

    left: 7px;
    top: 32px;

    border-radius: 50%;

    background: #999;
}


/* =========================================
   ОСНОВНАЯ КНОПКА
========================================= */

.button {

    position: absolute;

    width: 12px;
    height: 12px;

    left: 4px;
    top: 42px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff,
            #ccc 45%,
            #777
        );

    border: 1px solid #666;
}

.button::after {

    content: '';

    position: absolute;

    width: 2px;
    height: 4px;

    left: 4px;
    top: 1px;

    background: #444;
}


/* =========================================
   ОКНО
========================================= */

.window {

    position: absolute;

    width: 48px;
    height: 48px;

    left: 6px;
    top: 11px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #eeeeee,
            #aaa,
            #777
        );

    border: 2px solid #888;

    box-shadow:
        0 3px 6px rgba(0,0,0,.5),
        inset 1px 1px 2px rgba(255,255,255,.8),
        inset -2px -2px 4px rgba(0,0,0,.4);
}


/* =========================================
   СТЕКЛО
========================================= */

.window-glass {

    position: absolute;

    width: 40px;
    height: 40px;

    left: 2px;
    top: 2px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 25%,
            #666,
            #333 30%,
            #111 65%,
            #000
        );

    border: 1px solid #555;

    box-shadow:
        inset 0 0 12px #000;

    overflow: hidden;
}

.window-glass::before {

    content: '';

    position: absolute;

    width: 25px;
    height: 9px;

    left: 4px;
    top: 4px;

    background: rgba(255,255,255,0.16);

    border-radius: 50%;

    transform: rotate(-25deg);

    filter: blur(1px);
}


/* =========================================
   НИЖНЯЯ ПОЛОСКА
========================================= */

.bottom-line {

    position: absolute;

    left: 5px;
    right: 5px;

    bottom: 3px;

    height: 2px;

    background: #aaa;

    border-radius: 3px;
}


/* =========================================
   ПОЛЁТ ПО СИММЕТРИЧНОЙ ДУГЕ
========================================= */
