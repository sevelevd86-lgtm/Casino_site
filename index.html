<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐻‍❄️DROP</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111315;
    font-family: Arial, sans-serif;
    user-select: none;
    color: white;
}

button,
input {
    font-family: Arial, sans-serif;
}

.screen {
    position: fixed;
    inset: 0;
    display: none;
}

.screen.active {
    display: block;
}


/* =====================================================
   LOBBY
===================================================== */

#lobbyScreen {
    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(30, 110, 220, .12),
            transparent 35%
        ),
        #111315;
}

.lobby-header {
    position: absolute;
    top: 20px;
    left: 20px;
    right: 20px;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 23px;
    font-weight: 900;
}

.logo span {
    color: #1678e8;
}

.lobby-balance {
    padding: 9px 14px;
    border-radius: 10px;
    background: #191c20;
    color: #ffd84d;
    font-weight: 900;
}

.lobby-center {
    position: absolute;
    left: 50%;
    top: 45%;

    transform: translate(-50%, -50%);

    width: min(360px, calc(100vw - 40px));

    text-align: center;
}

.lobby-title {
    font-size: 34px;
    font-weight: 900;
    margin-bottom: 28px;
}

.game-card {
    width: 100%;
    padding: 28px;

    border: 1px solid #30363c;
    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #1b1f23,
            #15181b
        );

    box-shadow:
        0 20px 70px rgba(0,0,0,.35);
}

.game-icon {
    width: 100px;
    height: 100px;

    margin: 0 auto 18px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #1678e8;

    font-size: 45px;

    box-shadow:
        0 0 35px rgba(22,120,232,.35);
}

.game-name {
    font-size: 25px;
    font-weight: 900;
}

.game-description {
    margin-top: 8px;

    color: #858b91;
    font-size: 13px;
}

.game-play {
    width: 100%;

    margin-top: 22px;
    padding: 14px;

    border: none;
    border-radius: 11px;

    background: #1678e8;

    color: white;

    font-size: 15px;
    font-weight: 900;

    cursor: pointer;
}

.game-play:hover {
    background: #2687f5;
}

.bottom-nav {
    position: fixed;
    left: 0;
    bottom: 0;

    width: 100%;
    height: 76px;

    display: flex;

    background: #171a1e;

    border-top: 1px solid #292e33;
}

.nav-button {
    flex: 1;

    border: none;
    background: transparent;

    color: #777e85;

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;
}

.nav-button.active {
    color: white;
}

.nav-icon {
    display: block;
    font-size: 22px;
    margin-bottom: 3px;
}


/* =====================================================
   GAME
===================================================== */

#gameScreen {
    background: #111315;
}

canvas {
    position: fixed;
    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    display: block;
}

.game-back {
    position: fixed;

    left: 15px;
    top: 15px;

    z-index: 30;

    border: none;
    border-radius: 9px;

    padding: 9px 13px;

    background: rgba(25,29,33,.9);

    color: white;

    font-weight: 800;

    cursor: pointer;
}


/* =====================================================
   GAME TOP UI
===================================================== */

.top-ui {
    position: fixed;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    gap: 45px;

    z-index: 10;

    text-align: center;
}

.stat {
    min-width: 90px;
}

.stat-label {
    color: #737a81;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.stat-value {
    margin-top: 4px;

    color: white;

    font-size: 22px;

    font-weight: 800;
}

.balance-value {
    color: #ffd84d !important;
}

#multiplier {
    color: #42df78;
}


/* =====================================================
   ZONES
===================================================== */

.bottom-zones {
    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 90px;

    display: flex;

    z-index: 5;

    overflow: hidden;

    background:
        linear-gradient(
            to top,
            rgba(10,12,14,.98),
            rgba(10,12,14,.15)
        );
}

.green-zone {
    position: relative;

    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 21px;
    font-weight: 900;

    transition: width .25s ease;

    overflow: hidden;

    background:
        linear-gradient(
            to top,
            #2bdd72 0%,
            #26c968 35%,
            rgba(39,201,104,.35) 70%,
            rgba(39,201,104,0) 100%
        );

    box-shadow:
        inset 0 -10px 30px rgba(35,255,120,.35),
        0 -4px 25px rgba(35,220,110,.18);
}

.green-zone::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 2px;

    background: rgba(87,255,155,.75);

    box-shadow:
        0 0 12px rgba(50,255,130,.8),
        0 0 28px rgba(50,255,130,.45);
}

.red-zone {
    position: relative;

    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 21px;
    font-weight: 900;

    transition: width .25s ease;

    overflow: hidden;

    background:
        linear-gradient(
            to top,
            #e84550 0%,
            #d93c47 35%,
            rgba(217,60,71,.35) 70%,
            rgba(217,60,71,0) 100%
        );

    box-shadow:
        inset 0 -10px 30px rgba(255,55,65,.35),
        0 -4px 25px rgba(255,55,65,.18);
}

.red-zone::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 2px;

    background: rgba(255,105,112,.75);

    box-shadow:
        0 0 12px rgba(255,65,75,.8),
        0 0 28px rgba(255,65,75,.45);
}


/* =====================================================
   START MENU
===================================================== */

.start-menu {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 330px;

    padding: 28px;

    background: rgba(20,23,26,.98);

    border: 1px solid #343a40;

    border-radius: 20px;

    text-align: center;

    z-index: 50;

    box-shadow:
        0 20px 70px rgba(0,0,0,.5);
}

.start-title {
    color: white;

    font-size: 30px;
    font-weight: 900;

    margin-bottom: 22px;
}

.balance-box {
    padding: 13px;

    border-radius: 10px;

    background: #171a1e;

    margin-bottom: 18px;
}

.balance-label {
    color: #737a81;

    font-size: 11px;

    text-transform: uppercase;
}

.balance {
    margin-top: 5px;

    color: #ffd84d;

    font-size: 25px;

    font-weight: 900;
}

.bet-label {
    display: block;

    color: #8b9299;

    font-size: 12px;

    text-align: left;

    margin-bottom: 6px;
}

.bet-input {
    width: 100%;

    padding: 13px;

    border: 1px solid #3a4148;

    outline: none;

    border-radius: 10px;

    background: #111315;

    color: white;

    font-size: 17px;

    font-weight: 700;

    text-align: center;
}

.bet-input:focus {
    border-color: #1678e8;
}

.bet-error {
    min-height: 18px;

    margin-top: 5px;

    color: #ef4752;

    font-size: 12px;
}

.menu-difficulty {
    margin-top: 7px;

    display: flex;

    gap: 6px;
}

.menu-difficulty button {
    flex: 1;

    border: none;
    outline: none;

    padding: 9px 5px;

    border-radius: 8px;

    background: #282d32;

    color: #cfd3d7;

    font-size: 12px;
    font-weight: 700;

    cursor: pointer;
}

.menu-difficulty button.active {
    background: #1678e8;
    color: white;
}

.play-button {
    width: 100%;

    margin-top: 17px;

    padding: 13px;

    border: none;

    border-radius: 10px;

    background: #1678e8;

    color: white;

    font-size: 15px;
    font-weight: 900;

    cursor: pointer;
}

.play-button:hover {
    background: #2687f5;
}


/* =====================================================
   RESULT
===================================================== */

.result {
    position: fixed;

    top: 50%;
    left: 50%;

    width: 310px;

    padding: 30px;

    transform:
        translate(-50%, -50%)
        scale(.85);

    background: rgba(20,23,26,.99);

    border: 1px solid #343a40;

    border-radius: 20px;

    text-align: center;

    z-index: 100;

    opacity: 0;

    pointer-events: none;

    transition: .25s;
}

.result.show {
    opacity: 1;

    pointer-events: auto;

    transform:
        translate(-50%, -50%)
        scale(1);
}

.result-title {
    font-size: 44px;
    font-weight: 900;
}

.result-title.win {
    color: #3ee57b;
}

.result-title.lose {
    color: #ef4752;
}

.result-info {
    margin-top: 10px;

    color: #858b91;

    font-size: 14px;

    line-height: 1.7;
}

.result-money {
    margin-top: 12px;

    font-size: 22px;

    font-weight: 900;
}

.result-money.win {
    color: #3ee57b;
}

.result-money.lose {
    color: #ef4752;
}

.result button {
    width: 100%;

    margin-top: 20px;

    padding: 12px;

    border: none;

    border-radius: 9px;

    background: #1678e8;

    color: white;

    font-size: 14px;

    font-weight: 800;

    cursor: pointer;
}


/* =====================================================
   OTHER SCREENS
===================================================== */

.empty-screen {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #777e85;

    font-size: 18px;
    font-weight: 800;
}

@media(max-width:600px) {

    .top-ui {
        gap: 20px;
    }

    .stat-value {
        font-size: 18px;
    }

    .bottom-zones {
        height: 78px;
    }

    .green-zone,
    .red-zone {
        font-size: 17px;
    }

    .start-menu {
        width: calc(100vw - 40px);
        max-width: 330px;
    }

    .game-back {
        top: 10px;
        left: 10px;
    }
}
</style>
</head>

<body>


<!-- =====================================================
     LOBBY
===================================================== -->

<div id="lobbyScreen" class="screen active">

    <div class="lobby-header">

        <div class="logo">
            🐻‍❄️<span>DROP</span>
        </div>

        <div class="lobby-balance">
            💰 <span id="lobbyBalance">1000.00</span>
        </div>

    </div>


    <div class="lobby-center">

        <div class="lobby-title">
            Меню
        </div>

        <div class="game-card">

            <div class="game-icon">
                ⚪
            </div>

            <div class="game-name">
                Шарик
            </div>

            <div class="game-description">
                Проведи шарик через вращающееся
                отверстие и забери выигрыш.
            </div>

            <button
                class="game-play"
                id="openGameButton">

                ИГРАТЬ

            </button>

        </div>

    </div>


    <div class="bottom-nav">

        <button
            class="nav-button">

            <span class="nav-icon">🎒</span>
            Инвентарь

        </button>


        <button
            class="nav-button active">

            <span class="nav-icon">🏠</span>
            Меню

        </button>


        <button
            class="nav-button">

            <span class="nav-icon">👤</span>
            Профиль

        </button>

    </div>

</div>


<!-- =====================================================
     GAME
===================================================== -->

<div id="gameScreen" class="screen">

    <canvas id="gameCanvas"></canvas>


    <button
        class="game-back"
        id="backToLobby">

        ← Меню

    </button>


    <div class="top-ui">

        <div class="stat">

            <div class="stat-label">
                Баланс
            </div>

            <div
                class="stat-value balance-value"
                id="balanceValue">

                1000.00

            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Отскоки
            </div>

            <div
                class="stat-value"
                id="bounceValue">

                0

            </div>

        </div>


        <div class="stat">

            <div class="stat-label">
                Множитель
            </div>

            <div
                class="stat-value"
                id="multiplier">

                1.00x

            </div>

        </div>

    </div>


    <div class="bottom-zones">

        <div
            class="green-zone"
            id="greenZone">

            WIN

        </div>

        <div
            class="red-zone"
            id="redZone">

            LOSE

        </div>

    </div>


    <!-- START MENU -->

    <div
        class="start-menu"
        id="startMenu">

        <div class="start-title">
            ESCAPE
        </div>


        <div class="balance-box">

            <div class="balance-label">
                Ваш баланс
            </div>

            <div
                class="balance"
                id="menuBalance">

                1000.00

            </div>

        </div>


        <label
            class="bet-label"
            for="betInput">

            Ставка

        </label>


        <input
            id="betInput"
            class="bet-input"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="Введите ставку"
        >


        <div
            class="bet-error"
            id="betError">
        </div>


        <div class="bet-label">
            Сложность
        </div>


        <div class="menu-difficulty">

            <button
                class="difficulty-button active"
                data-mode="easy">

                Легко

            </button>


            <button
                class="difficulty-button"
                data-mode="medium">

                Средне

            </button>


            <button
                class="difficulty-button"
                data-mode="hard">

                Сложно

            </button>

        </div>


        <button
            class="play-button"
            id="startButton">

            ИГРАТЬ

        </button>

    </div>


    <!-- RESULT -->

    <div
        class="result"
        id="resultWindow">

        <div
            id="resultTitle"
            class="result-title">

            WIN

        </div>


        <div
            id="resultInfo"
            class="result-info">
        </div>


        <div
            id="resultMoney"
            class="result-money">
        </div>


        <button id="closeResultButton">

            ЗАКРЫТЬ

        </button>

    </div>

</div>


<!-- =====================================================
     EMPTY INVENTORY
===================================================== -->

<div id="inventoryScreen" class="screen">

    <div class="empty-screen">
        🎒 Инвентарь пока пуст
    </div>

    <div class="bottom-nav">

        <button class="nav-button active" data-screen="inventoryScreen">
            <span class="nav-icon">🎒</span>
            Инвентарь
        </button>

        <button class="nav-button" data-screen="lobbyScreen">
            <span class="nav-icon">🏠</span>
            Меню
        </button>

        <button class="nav-button" data-screen="profileScreen">
            <span class="nav-icon">👤</span>
            Профиль
        </button>

    </div>

</div>


<!-- =====================================================
     PROFILE
===================================================== -->

<div id="profileScreen" class="screen">

    <div class="empty-screen">
        👤 Профиль
    </div>

    <div class="bottom-nav">

        <button class="nav-button" data-screen="inventoryScreen">
            <span class="nav-icon">🎒</span>
            Инвентарь
        </button>

        <button class="nav-button" data-screen="lobbyScreen">
            <span class="nav-icon">🏠</span>
            Меню
        </button>

        <button class="nav-button active" data-screen="profileScreen">
            <span class="nav-icon">👤</span>
            Профиль
        </button>

    </div>

</div>


<script>

/* =====================================================
   SCREENS
===================================================== */

const lobbyScreen =
    document.getElementById("lobbyScreen");

const gameScreen =
    document.getElementById("gameScreen");

const inventoryScreen =
    document.getElementById("inventoryScreen");

const profileScreen =
    document.getElementById("profileScreen");


function showScreen(screen) {

    document
        .querySelectorAll(".screen")
        .forEach(element => {

            element.classList.remove("active");

        });


    screen.classList.add("active");
}


/* =====================================================
   BALANCE
===================================================== */

let balance = 1000;


/* =====================================================
   LOBBY
===================================================== */

const lobbyBalance =
    document.getElementById("lobbyBalance");


function updateAllBalances() {

    const value =
        balance.toFixed(2);


    lobbyBalance.textContent =
        value;

    balanceValue.textContent =
        value;

    menuBalance.textContent =
        value;
}


/* =====================================================
   OPEN GAME
===================================================== */

document
    .getElementById("openGameButton")
    .addEventListener(
        "click",
        () => {

            showScreen(gameScreen);

            updateAllBalances();

        }
    );


/* =====================================================
   NAVIGATION
===================================================== */

document
    .querySelectorAll("[data-screen]")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => {

                const target =
                    document.getElementById(
                        button.dataset.screen
                    );

                if (target) {

                    showScreen(target);

                }

            }
        );

    });


/* =====================================================
   GAME BACK
===================================================== */

document
    .getElementById("backToLobby")
    .addEventListener(
        "click",
        () => {

            /*
                Нельзя выйти во время
                активной игры.
            */

            if (gameRunning) {

                return;

            }


            resultWindow.classList.remove(
                "show"
            );


            startMenu.style.display =
                "block";


            showScreen(lobbyScreen);

            updateAllBalances();

        }
    );


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


let width = 0;
let height = 0;


/* =====================================================
   UI
===================================================== */

const balanceValue =
    document.getElementById(
        "balanceValue"
    );

const menuBalance =
    document.getElementById(
        "menuBalance"
    );

const bounceValue =
    document.getElementById(
        "bounceValue"
    );

const multiplierValue =
    document.getElementById(
        "multiplier"
    );

const startMenu =
    document.getElementById(
        "startMenu"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const betInput =
    document.getElementById(
        "betInput"
    );

const betError =
    document.getElementById(
        "betError"
    );

const resultWindow =
    document.getElementById(
        "resultWindow"
    );

const resultTitle =
    document.getElementById(
        "resultTitle"
    );

const resultInfo =
    document.getElementById(
        "resultInfo"
    );

const resultMoney =
    document.getElementById(
        "resultMoney"
    );

const closeResultButton =
    document.getElementById(
        "closeResultButton"
    );

const greenZone =
    document.getElementById(
        "greenZone"
    );

const redZone =
    document.getElementById(
        "redZone"
    );


/* =====================================================
   CURRENT BET
===================================================== */

/*
    ВАЖНО:

    Ставка специально НЕ обнуляется
    после WIN/LOSE.

    Поэтому после закрытия результата
    в поле останется последняя ставка.
*/

let currentBet = 0;


/* =====================================================
   CIRCLE
===================================================== */

const circle = {

    x: 0,

    y: 0,

    radius: 205,

    wallWidth: 10

};


/* =====================================================
   BALL
===================================================== */

const ball = {

    x: 0,

    y: 0,

    vx: 0,

    vy: 0,

    radius: 13

};


/* =====================================================
   PHYSICS
===================================================== */

const GRAVITY = 0.20;

const BASE_JUMP = 5.5;

const MAX_SPEED = 6.0;

const MAX_HORIZONTAL_SPEED = 3.4;

const HOLE_SPEED = 0.018;

const COLLISION_EPSILON = 1.5;

const SIDE_WALL = 7;

const ZONE_HEIGHT = 90;


/* =====================================================
   DIFFICULTIES
===================================================== */

const difficulties = {

    easy: {

        greenPercent: 70,

        redPercent: 30,

        holeSize: 50,

        multiplierStep: 0.05

    },


    medium: {

        greenPercent: 50,

        redPercent: 50,

        holeSize: 50,

        multiplierStep: 0.15

    },


    hard: {

        greenPercent: 25,

        redPercent: 75,

        holeSize: 65,

        multiplierStep: 0.25

    }

};


let difficulty = "easy";


/* =====================================================
   GAME STATE
===================================================== */

let gameRunning = false;

let ballEscaped = false;

let gameFinished = false;

let holeAngle = 0;

let bounceCount = 0;

let multiplier = 1;


/* =====================================================
   RESIZE
===================================================== */

function resizeCanvas() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    circle.radius =
        Math.min(
            205,
            width * 0.33,
            height * 0.30
        );


    circle.x =
        width / 2;


    circle.y =
        height * 0.39;


    if (!gameRunning) {

        ball.x =
            circle.x;

        ball.y =
            circle.y -
            circle.radius * 0.35;

    }

}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   ZONES
===================================================== */

function updateZones() {

    const settings =
        difficulties[difficulty];


    greenZone.style.width =
        settings.greenPercent + "%";


    redZone.style.width =
        settings.redPercent + "%";

}


/* =====================================================
   ANGLES
===================================================== */

function normalizeAngle(angle) {

    angle %= Math.PI * 2;


    if (angle < 0) {

        angle +=
            Math.PI * 2;

    }


    return angle;
}


function angleDifference(a, b) {

    let difference =
        Math.abs(
            normalizeAngle(a) -
            normalizeAngle(b)
        );


    if (
        difference >
        Math.PI
    ) {

        difference =
            Math.PI * 2 -
            difference;

    }


    return difference;
}


/* =====================================================
   HOLE
===================================================== */

function isHole(angle) {

    const holeDegrees =
        difficulties[difficulty]
            .holeSize;


    const holeRadians =
        holeDegrees *
        Math.PI /
        180;


    return (
        angleDifference(
            angle,
            holeAngle
        )
        <=
        holeRadians / 2
    );

}


/* =====================================================
   RANDOM
===================================================== */

function randomRange(min, max) {

    return (
        min +
        Math.random() *
        (max - min)
    );

}


/* =====================================================
   SPEED LIMIT
===================================================== */

function limitSpeed() {

    ball.vx =
        Math.max(
            -MAX_HORIZONTAL_SPEED,
            Math.min(
                MAX_HORIZONTAL_SPEED,
                ball.vx
            )
        );


    const speed =
        Math.sqrt(
            ball.vx * ball.vx +
            ball.vy * ball.vy
        );


    if (
        speed >
        MAX_SPEED
    ) {

        const scale =
            MAX_SPEED /
            speed;


        ball.vx *= scale;

        ball.vy *= scale;

    }

}


/* =====================================================
   UI
===================================================== */

function updateUI() {

    updateAllBalances();


    bounceValue.textContent =
        bounceCount;


    multiplierValue.textContent =
        multiplier.toFixed(2) +
        "x";

}


/* =====================================================
   INITIAL BALL DIRECTION
===================================================== */

function chooseStartDirection() {

    const direction =
        Math.random() < .5
            ? -1
            : 1;


    ball.vx =
        direction *
        randomRange(
            .8,
            1.8
        );


    ball.vy =
        randomRange(
            1.8,
            2.5
        );

}


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    let bet =
        Number(
            betInput.value
        );


    if (
        !Number.isFinite(bet) ||
        bet <= 0
    ) {

        betError.textContent =
            "Введите корректную ставку.";

        return;

    }


    if (
        bet > balance
    ) {

        betError.textContent =
            "Ставка больше вашего баланса.";

        return;

    }


    bet =
        Math.round(
            bet * 100
        ) / 100;


    if (
        bet <= 0 ||
        bet > balance
    ) {

        betError.textContent =
            "Некорректная ставка.";

        return;

    }


    currentBet =
        bet;


    balance -=
        currentBet;


    balance =
        Math.round(
            balance * 100
        ) / 100;


    betError.textContent =
        "";


    gameRunning = true;

    ballEscaped = false;

    gameFinished = false;


    bounceCount = 0;

    multiplier = 1;


    ball.x =
        circle.x;


    ball.y =
        circle.y -
        circle.radius * .35;


    chooseStartDirection();


    updateUI();


    startMenu.style.display =
        "none";


    resultWindow.classList.remove(
        "show"
    );

}


/* =====================================================
   REGISTER BOUNCE
===================================================== */

function registerBounce() {

    bounceCount++;


    multiplier =
        1 +
        bounceCount *
        difficulties[difficulty]
            .multiplierStep;


    multiplier =
        Math.round(
            multiplier * 100
        ) / 100;


    updateUI();

}


/* =====================================================
   ESCAPE THROUGH HOLE
===================================================== */

function escapeThroughHole(nx, ny) {

    ball.x =
        circle.x +
        nx *
        (
            circle.radius +
            ball.radius +
            5
        );


    ball.y =
        circle.y +
        ny *
        (
            circle.radius +
            ball.radius +
            5
        );


    /*
        После выхода из круга
        задаём новую скорость.

        Она тоже немного отличается
        каждый раз.
    */

    const speed =
        randomRange(
            3.6,
            4.8
        );


    let vx =
        ball.vx;


    if (
        Math.abs(vx) < .7
    ) {

        vx =
            nx *
            randomRange(
                1.2,
                2.2
            );

    }


    ball.vx =
        Math.max(
            -MAX_HORIZONTAL_SPEED,
            Math.min(
                MAX_HORIZONTAL_SPEED,
                vx
            )
        );


    ball.vy =
        Math.max(
            2.5,
            speed
        );


    ballEscaped = true;

}


/* =====================================================
   DIFFERENT JUMP
===================================================== */

/*
    Главная часть исправления.

    Каждый отскок получает:
    - новую силу прыжка;
    - новое направление;
    - новое боковое отклонение;
    - небольшую случайную скорость.

    Поэтому два последовательных
    прыжка практически никогда
    не будут одинаковыми.
*/

function bounceFromWall(nx, ny) {

    const safeRadius =
        circle.radius -
        circle.wallWidth / 2 -
        ball.radius -
        COLLISION_EPSILON;


    ball.x =
        circle.x +
        nx * safeRadius;


    ball.y =
        circle.y +
        ny * safeRadius;


    const velocityNormal =
        ball.vx * nx +
        ball.vy * ny;


    if (
        velocityNormal > 0
    ) {

        ball.vx -=
            2 *
            velocityNormal *
            nx;


        ball.vy -=
            2 *
            velocityNormal *
            ny;

    }


    /*
        Случайная сила каждого прыжка.

        Никогда не даём слишком
        маленькое значение.
    */

    const jumpPower =
        randomRange(
            5.0,
            6.6
        );


    /*
        Удар снизу.

        Прыжок вверх.
    */

    if (
        ny > .15
    ) {

        ball.vy =
            -jumpPower;

    }


    /*
        Удар сверху.

        Шар должен лететь вниз,
        но сила тоже разная.
    */

    else if (
        ny < -.15
    ) {

        ball.vy =
            randomRange(
                3.2,
                5.0
            );

    }


    /*
        Боковая стенка.

        Делаем вертикальный прыжок
        случайным.
    */

    else {

        const verticalDirection =
            ball.vy < 0
                ? -1
                : 1;


        ball.vy =
            verticalDirection *
            randomRange(
                3.8,
                5.8
            );

    }


    /*
        НОВАЯ боковая составляющая.

        Она может сильно изменить
        направление следующего прыжка.
    */

    ball.vx +=
        randomRange(
            -1.0,
            1.0
        );


    /*
        Минимальная горизонтальная
        скорость.

        Шар не будет постоянно
        двигаться ровно вверх-вниз.
    */

    if (
        Math.abs(ball.vx) < .65
    ) {

        ball.vx =
            Math.random() < .5
                ? -.65
                : .65;

    }


    /*
        Иногда полностью меняем
        сторону движения.

        Это дополнительно делает
        траекторию непредсказуемой.
    */

    if (
        Math.random() < .22
    ) {

        ball.vx *= -1;

    }


    /*
        Небольшая случайная
        дополнительная скорость.
    */

    ball.vy +=
        randomRange(
            -.35,
            .35
        );


    limitSpeed();


    registerBounce();

}


/* =====================================================
   FINISH
===================================================== */

function finishGame(isWin) {

    if (
        gameFinished
    ) {

        return;

    }


    gameFinished = true;

    gameRunning = false;


    if (isWin) {

        const payout =
            currentBet *
            multiplier;


        balance +=
            payout;


        balance =
            Math.round(
                balance * 100
            ) / 100;


        const profit =
            payout -
            currentBet;


        resultTitle.textContent =
            "WIN";


        resultTitle.className =
            "result-title win";


        resultMoney.textContent =
            "+" +
            profit.toFixed(2);


        resultMoney.className =
            "result-money win";


        resultInfo.innerHTML =
            "Ставка: " +
            currentBet.toFixed(2) +
            "<br>" +
            "Множитель: " +
            multiplier.toFixed(2) +
            "x<br>" +
            "Выплата: " +
            payout.toFixed(2);

    }

    else {

        resultTitle.textContent =
            "LOSE";


        resultTitle.className =
            "result-title lose";


        resultMoney.textContent =
            "-" +
            currentBet.toFixed(2);


        resultMoney.className =
            "result-money lose";


        resultInfo.innerHTML =
            "Ставка: " +
            currentBet.toFixed(2) +
            "<br>" +
            "Множитель: " +
            multiplier.toFixed(2) +
            "x<br>" +
            "Ставка проиграна.";

    }


    updateUI();


    resultWindow.classList.add(
        "show"
    );

}


/* =====================================================
   PHYSICS
===================================================== */

function updatePhysics() {

    holeAngle +=
        HOLE_SPEED;


    holeAngle =
        normalizeAngle(
            holeAngle
        );


    if (
        !gameRunning
    ) {

        return;

    }


    /* =================================================
       BALL ESCAPED
    ================================================= */

    if (
        ballEscaped
    ) {

        ball.vy +=
            GRAVITY;


        ball.x +=
            ball.vx;


        ball.y +=
            ball.vy;


        limitSpeed();


        /*
            Левая стена.
        */

        if (
            ball.x -
            ball.radius <
            SIDE_WALL
        ) {

            ball.x =
                SIDE_WALL +
                ball.radius;


            ball.vx =
                Math.abs(
                    ball.vx
                );

        }


        /*
            Правая стена.
        */

        if (
            ball.x +
            ball.radius >
            width -
            SIDE_WALL
        ) {

            ball.x =
                width -
                SIDE_WALL -
                ball.radius;


            ball.vx =
                -Math.abs(
                    ball.vx
                );

        }


        /*
            Зона результата.
        */

        const zonesTop =
            height -
            ZONE_HEIGHT;


        if (
            ball.y +
            ball.radius >=
            zonesTop
        ) {

            const greenWidth =
                width *
                difficulties[difficulty]
                    .greenPercent /
                100;


            if (
                ball.x <=
                greenWidth
            ) {

                finishGame(true);

            }

            else {

                finishGame(false);

            }


            return;

        }


        return;

    }


    /* =================================================
       GRAVITY
    ================================================= */

    ball.vy +=
        GRAVITY;


    /* =================================================
       MOVEMENT
    ================================================= */

    ball.x +=
        ball.vx;


    ball.y +=
        ball.vy;


    limitSpeed();


    /* =================================================
       DISTANCE
    ================================================= */

    const dx =
        ball.x -
        circle.x;


    const dy =
        ball.y -
        circle.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const collisionRadius =
        circle.radius -
        circle.wallWidth / 2 -
        ball.radius;


    /* =================================================
       WALL
    ================================================= */

    if (
        distance >=
        collisionRadius
    ) {

        if (
            distance < .0001
        ) {

            return;

        }


        const nx =
            dx / distance;


        const ny =
            dy / distance;


        const ballAngle =
            Math.atan2(
                dy,
                dx
            );


        /*
            Проверяем отверстие.
        */

        if (
            isHole(ballAngle)
        ) {

            const outwardVelocity =
                ball.vx * nx +
                ball.vy * ny;


            if (
                outwardVelocity >= 0
            ) {

                escapeThroughHole(
                    nx,
                    ny
                );


                return;

            }

        }


        /*
            Твёрдая часть круга.
        */

        bounceFromWall(
            nx,
            ny
        );

    }

}


/* =====================================================
   DRAW
===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
        Боковые стены.
    */

    ctx.fillStyle =
        "#252a2f";


    ctx.fillRect(
        0,
        0,
        SIDE_WALL,
        height
    );


    ctx.fillRect(
        width -
        SIDE_WALL,
        0,
        SIDE_WALL,
        height
    );


    /*
        Круг.
    */

    const radius =
        circle.radius;


    const holeRadians =
        difficulties[difficulty]
            .holeSize *
        Math.PI /
        180;


    const holeStart =
        holeAngle -
        holeRadians / 2;


    const holeEnd =
        holeAngle +
        holeRadians / 2;


    /*
        Синяя стенка.
    */

    ctx.save();


    ctx.beginPath();


    ctx.arc(
        circle.x,
        circle.y,
        radius,
        holeEnd,
        holeStart +
        Math.PI * 2
    );


    ctx.strokeStyle =
        "#1478e8";


    ctx.lineWidth =
        circle.wallWidth;


    ctx.lineCap =
        "round";


    ctx.shadowBlur =
        20;


    ctx.shadowColor =
        "rgba(20,120,235,.8)";


    ctx.stroke();


    ctx.restore();


    /*
        Концы отверстия.
    */

    ctx.save();


    ctx.strokeStyle =
        "#1478e8";


    ctx.lineWidth =
        5;


    ctx.lineCap =
        "round";


    function drawHoleEnd(angle) {

        const inner =
            radius - 6;


        const outer =
            radius + 3;


        const x1 =
            circle.x +
            Math.cos(angle) *
            inner;


        const y1 =
            circle.y +
            Math.sin(angle) *
            inner;


        const x2 =
            circle.x +
            Math.cos(angle) *
            outer;


        const y2 =
            circle.y +
            Math.sin(angle) *
            outer;


        ctx.beginPath();


        ctx.moveTo(
            x1,
            y1
        );


        ctx.lineTo(
            x2,
            y2
        );


        ctx.stroke();

    }


    drawHoleEnd(
        holeStart
    );


    drawHoleEnd(
        holeEnd
    );


    ctx.restore();


    /*
        Свечение отверстия.
    */

    ctx.save();


    ctx.beginPath();


    ctx.arc(
        circle.x,
        circle.y,
        radius + 3,
        holeStart,
        holeEnd
    );


    ctx.strokeStyle =
        "rgba(255,255,255,.15)";


    ctx.lineWidth =
        4;


    ctx.stroke();


    ctx.restore();


    /*
        Шарик.
    */

    ctx.save();


    ctx.beginPath();


    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#ffffff";


    ctx.shadowBlur =
        16;


    ctx.shadowColor =
        "rgba(255,255,255,.95)";


    ctx.fill();


    ctx.restore();


    /*
        Блик.
    */

    ctx.beginPath();


    ctx.arc(
        ball.x - 4,
        ball.y - 4,
        3,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "rgba(255,255,255,.9)";


    ctx.fill();

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

    updatePhysics();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================
   START
===================================================== */

startButton.addEventListener(
    "click",
    startGame
);


/* =====================================================
   RESULT CLOSE
===================================================== */

closeResultButton.addEventListener(
    "click",
    () => {

        resultWindow.classList.remove(
            "show"
        );


        startMenu.style.display =
            "block";


        /*
            ВАЖНО:

            currentBet НЕ сбрасываем.

            Поле ставки тоже НЕ очищаем.

            Поэтому после WIN/LOSE
            остаётся та же ставка.
        */

        betError.textContent =
            "";


        ball.x =
            circle.x;


        ball.y =
            circle.y -
            circle.radius * .35;


        ball.vx = 0;

        ball.vy = 0;


        updateUI();

    }
);


/* =====================================================
   DIFFICULTY
===================================================== */

document
    .querySelectorAll(
        ".difficulty-button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    /*
                        Во время игры
                        менять нельзя.
                    */

                    if (
                        gameRunning
                    ) {

                        return;

                    }


                    difficulty =
                        button.dataset.mode;


                    document
                        .querySelectorAll(
                            ".difficulty-button"
                        )
                        .forEach(
                            other => {

                                other.classList.remove(
                                    "active"
                                );

                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    updateZones();

                }
            );

        }
    );


/* =====================================================
   INITIALIZATION
===================================================== */

resizeCanvas();

updateZones();

updateUI();


ball.x =
    circle.x;

ball.y =
    circle.y -
    circle.radius * .35;


/*
    Круг вращается
    даже в меню игры.
*/

gameLoop();

</script>
