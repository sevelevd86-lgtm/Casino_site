<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Летящая ракета со стикером и огнем</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: radial-gradient(circle at center, #1a1a1a, #000000);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер для полета по дуге */
        .flight-path {
            position: relative;
            width: 100px;
            height: 100px;
            /* Анимация полета по дуге снизу вверх с наклоном */
            animation: flyArc 4s ease-in-out infinite alternate;
        }

        /* Ключевые кадры дуги: меняем позицию и наклон */
        @keyframes flyArc {
            0% {
                transform: translate(150px, 250px) rotate(-45deg); /* Старт снизу, смотрит вверх-вправо */
            }
            50% {
                transform: translate(-50px, -100px) rotate(45deg); /* Верхняя точка, смотрит вверх-влево */
            }
            100% {
                transform: translate(-150px, -250px) rotate(135deg); /* Улетает влево-вниз, смотрит влево */
            }
        }

        /* Сама ракета */
        .rocket {
            position: absolute;
            top: -50px;
            left: -50px;
            width: 100px;
            height: 100px;
            transform-style: preserve-3d;
        }

        /* ===== КОРПУС РАКЕТЫ ===== */
        .body {
            position: absolute;
            width: 80px;
            height: 35px;
            background: linear-gradient(to bottom, #ffffff, #d4d4d4 60%, #a0a0a0);
            border-radius: 15px 30px 30px 15px;
            left: 10px;
            top: 32px;
            box-shadow: 
                inset -5px 0 10px rgba(0,0,0,0.2),
                0 5px 15px rgba(0,0,0,0.5);
            z-index: 2;
        }

        /* Полоска на корпусе */
        .stripe {
            position: absolute;
            width: 60px;
            height: 6px;
            background: #e53935;
            border-radius: 5px;
            left: 15px;
            top: 12px;
            opacity: 0.9;
        }

        /* ===== НОС (Смотрит вперед) ===== */
        .nose {
            position: absolute;
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #ff6b6b, #e53935 50%, #b71c1c);
            border-radius: 0 50% 50% 0;
            right: 5px;
            top: 32px;
            box-shadow: inset -5px 0 10px rgba(0,0,0,0.3);
            z-index: 3;
        }

        /* ===== ИЛЛЮМИНАТОР ===== */
        .window {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 30% 30%, #4facfe, #003366);
            border: 4px solid #e53935;
            border-radius: 50%;
            left: 40px;
            top: 40px;
            z-index: 4;
            box-shadow: 0 0 10px rgba(0, 78, 146, 0.8);
        }

        /* ===== ПЛАВНИКИ ===== */
        .fin-top {
            position: absolute;
            width: 30px;
            height: 25px;
            background: linear-gradient(135deg, #ff6b6b, #e53935);
            border-radius: 5px 0 0 5px;
            left: 5px;
            top: 10px;
            transform: rotate(30deg);
            z-index: 1;
        }

        .fin-bottom {
            position: absolute;
            width: 30px;
            height: 25px;
            background: linear-gradient(45deg, #ff6b6b, #e53935);
            border-radius: 5px 0 0 5px;
            left: 5px;
            bottom: 10px;
            transform: rotate(-30deg);
            z-index: 1;
        }

        /* ===== ДВИГАТЕЛЬ (Сопло) ===== */
        .engine {
            position: absolute;
            width: 15px;
            height: 12px;
            background: linear-gradient(to bottom, #888, #333);
            border-radius: 2px 0 0 2px;
            left: 0px;
            top: 44px;
            z-index: 1;
            box-shadow: inset 0 0 5px #000;
        }

        /* ===== РЕАЛИСТИЧНЫЙ ОГОНЬ ===== */
        /* Огромное внешнее свечение */
        .flame-glow {
            position: absolute;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, rgba(255, 165, 0, 0.6) 0%, transparent 70%);
            border-radius: 50%;
            left: -50px;
            top: 15px;
            transform: rotate(180deg);
            z-index: 0;
            animation: pulse 0.3s infinite alternate;
        }

        /* Внешний огонь (оранжевый) */
        .flame-outer {
            position: absolute;
            width: 60px;
            height: 45px;
            background: radial-gradient(circle at 30% 50%, #ff9800, #ff5722 60%, transparent);
            border-radius: 50% 50% 30% 30%;
            left: -40px;
            top: 25px;
            transform: rotate(180deg);
            filter: blur(2px);
            z-index: 0;
            animation: flameFlicker 0.15s infinite alternate;
        }

        /* Средний огонь (желтый) */
        .flame-mid {
            position: absolute;
            width: 40px;
            height: 30px;
            background: radial-gradient(circle at 30% 50%, #ffeb3b, #ff9800 70%, transparent);
            border-radius: 50% 50% 20% 20%;
            left: -30px;
            top: 35px;
            transform: rotate(180deg);
            filter: blur(1px);
            z-index: 1;
            animation: flameFlicker2 0.1s infinite alternate;
        }

        /* Ядро огня (белое) */
        .flame-core {
            position: absolute;
            width: 25px;
            height: 20px;
            background: radial-gradient(circle, #ffffff, #ffeb3b);
            border-radius: 50% 50% 10% 10%;
            left: -20px;
            top: 40px;
            transform: rotate(180deg);
            z-index: 2;
            filter: blur(0.5px);
        }

        /* Искры */
        .spark {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffeb3b;
            border-radius: 50%;
            box-shadow: 0 0 5px #ff9800;
            animation: sparkFly 0.5s infinite linear;
        }

        .spark1 { left: -40px; top: 20px; }
        .spark2 { left: -55px; top: 50px; animation-delay: 0.2s; }
        .spark3 { left: -20px; top: 70px; animation-delay: 0.35s; }

        /* Дым (для реалистичности) */
        .smoke {
            position: absolute;
            width: 25px;
            height: 25px;
            background: rgba(150, 150, 150, 0.4);
            border-radius: 50%;
            filter: blur(5px);
            left: -35px;
            top: 15px;
            animation: smokeRise 1s infinite linear;
        }
        .smoke2 { left: -45px; top: 55px; animation-delay: 0.5s; }

        /* ===== АНИМАЦИИ ОГНЯ ===== */
        @keyframes flameFlicker {
            0% { transform: rotate(180deg) scale(1); }
            100% { transform: rotate(180deg) scale(1.1); }
        }

        @keyframes flameFlicker2 {
            0% { transform: rotate(180deg) scale(1); opacity: 0.9; }
            100% { transform: rotate(180deg) scale(1.2); opacity: 1; }
        }

        @keyframes pulse {
            0% { transform: rotate(180deg) scale(0.9); opacity: 0.7; }
            100% { transform: rotate(180deg) scale(1.2); opacity: 1; }
        }

        /* Искры */
        @keyframes sparkFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(-15px, -10px) scale(0); opacity: 0; }
        }

        /* Дым */
        @keyframes smokeRise {
            0% { transform: translate(0, 0) scale(0.5); opacity: 0.5; }
            100% { transform: translate(-20px, -15px) scale(2); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="flight-path">
        <div class="rocket">
            
            <!-- Огонь и дым -->
            <div class="smoke"></div>
            <div class="smoke smoke2"></div>
            
            <div class="spark spark1"></div>
            <div class="spark spark2"></div>
            <div class="spark spark3"></div>

            <div class="flame-glow"></div>
            <div class="flame-outer"></div>
            <div class="flame-mid"></div>
            <div class="flame-core"></div>

            <!-- Части ракеты -->
            <div class="engine"></div>
            <div class="fin-top"></div>
            <div class="fin-bottom"></div>
            
            <div class="body">
                <div class="stripe"></div>
            </div>
            
            <div class="nose"></div>
            <div class="window"></div>
            
        </div>
    </div>

</body>
</html>
