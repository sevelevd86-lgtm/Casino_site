<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🐻‍❄️ DROP — Scratch</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;

    background: #111315;
    color: white;

    font-family: Arial, sans-serif;

    user-select: none;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 480px;

    min-height: 100vh;

    padding:
        20px
        18px
        35px;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 30px;
}

.logo {
    font-size: 22px;

    font-weight: 900;

    letter-spacing: -.5px;
}

.balance-box {
    background: #1b1e21;

    border: 1px solid #30353a;

    border-radius: 11px;

    padding:
        9px 13px;

    text-align: right;
}

.balance-label {
    color: #858b91;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: .5px;
}

.balance {
    margin-top: 2px;

    color: #ffd84d;

    font-size: 18px;

    font-weight: 900;
}


/* =====================================================
   TITLE
===================================================== */

.title {
    text-align: center;

    font-size: 31px;

    font-weight: 900;

    letter-spacing: -1px;
}

.subtitle {
    margin-top: 8px;

    text-align: center;

    color: #858b91;

    font-size: 14px;

    line-height: 1.5;
}


/* =====================================================
   TICKET SELECT
===================================================== */

.ticket-select {
    margin-top: 25px;

    display: flex;

    gap: 9px;
}

.ticket-card {
    flex: 1;

    padding: 15px 10px;

    background: #191c1f;

    border: 1px solid #30353a;

    border-radius: 13px;

    text-align: center;

    cursor: pointer;

    transition: .18s;
}

.ticket-card:hover {
    border-color: #4a5158;
}

.ticket-card.active {
    border-color: #1678e8;

    background:
        rgba(22,120,232,.09);

    box-shadow:
        0 0 0 1px
        rgba(22,120,232,.15);
}

.ticket-icon {
    font-size: 25px;
}

.ticket-name {
    margin-top: 7px;

    font-size: 13px;

    font-weight: 900;
}

.ticket-price {
    margin-top: 5px;

    color: #ffd84d;

    font-size: 12px;

    font-weight: 800;
}

.ticket-card.free .ticket-price {
    color: #42df78;
}


/* =====================================================
   TICKET INFO
===================================================== */

.ticket-info {
    margin-top: 17px;

    display: flex;

    gap: 8px;
}

.info-card {
    flex: 1;

    background: #191c1f;

    border: 1px solid #30353a;

    border-radius: 11px;

    padding: 12px 6px;

    text-align: center;
}

.info-label {
    color: #777e85;

    font-size: 9px;

    text-transform: uppercase;
}

.info-value {
    margin-top: 5px;

    font-size: 15px;

    font-weight: 900;
}


/* =====================================================
   PURCHASE
===================================================== */

.purchase {
    margin-top: 18px;
}

.main-button {
    width: 100%;

    border: none;

    border-radius: 12px;

    padding: 15px;

    background: #1678e8;

    color: white;

    font-size: 16px;

    font-weight: 900;

    cursor: pointer;

    transition: .15s;
}

.main-button:hover {
    background: #2687f5;
}

.main-button:active {
    transform: scale(.98);
}

.purchase-note {
    margin-top: 9px;

    text-align: center;

    color: #70777e;

    font-size: 12px;

    line-height: 1.5;
}


/* =====================================================
   GAME
===================================================== */

.game {
    display: none;

    margin-top: 28px;
}

.game.active {
    display: block;
}

.game-status {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 14px;
}

.status-text {
    font-size: 14px;

    font-weight: 800;
}

.free-info {
    color: #42df78;

    font-size: 12px;

    font-weight: 700;
}


/* =====================================================
   GRID
===================================================== */

.grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    width: 100%;

    aspect-ratio: 1 / 1;
}

.cell {
    position: relative;

    overflow: hidden;

    border-radius: 14px;

    background: #1d2024;

    border: 1px solid #363c42;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;
}

.icon {
    font-size:
        clamp(
            36px,
            12vw,
            58px
        );

    filter:
        drop-shadow(
            0 5px 12px
            rgba(0,0,0,.35)
        );

    transform: scale(.8);

    transition: .25s;
}

.cell.opened .icon {
    transform: scale(1);
}


/* =====================================================
   SCRATCH
===================================================== */

.scratch {
    position: absolute;

    inset: 0;

    z-index: 5;

    background:
        repeating-linear-gradient(
            115deg,
            rgba(255,255,255,.08)
            0px,
            rgba(255,255,255,.08)
            2px,
            transparent
            2px,
            transparent
            6px
        ),

        repeating-linear-gradient(
            35deg,
            rgba(0,0,0,.16)
            0px,
            rgba(0,0,0,.16)
            2px,
            transparent
            2px,
            transparent
            7px
        ),

        linear-gradient(
            135deg,
            #858b91,
            #5f666d
        );

    box-shadow:
        inset
        0 0 20px
        rgba(0,0,0,.3);
}

.scratch::after {
    content: "?";

    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(
            -50%,
            -50%
        );

    font-size: 34px;

    font-weight: 900;

    color:
        rgba(255,255,255,.35);
}

.cell.opened .scratch {
    animation:
        scratchOff
        .35s
        forwards;

    pointer-events: none;
}

@keyframes scratchOff {

    0% {
        opacity: 1;

        transform:
            scale(1);
    }

    50% {
        opacity: .65;

        transform:
            scale(1.04);
    }

    100% {
        opacity: 0;

        transform:
            scale(1.12);
    }
}


/* =====================================================
   PRICE
===================================================== */

.cell-price {
    position: absolute;

    bottom: 7px;
    right: 8px;

    z-index: 2;

    color:
        rgba(255,255,255,.5);

    font-size: 9px;
}


/* =====================================================
   HEART SPECIAL EFFECT
===================================================== */

.heart-glow {
    animation:
        heartGlow
        .7s
        ease-in-out
        infinite alternate;
}

@keyframes heartGlow {

    from {
        filter:
            drop-shadow(
                0 0 5px
                rgba(255,60,80,.5)
            );
    }

    to {
        filter:
            drop-shadow(
                0 0 22px
                rgba(255,60,80,1)
            );
    }
}


/* =====================================================
   SPARKS
===================================================== */

.spark {
    position: fixed;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #ffd84d;

    pointer-events: none;

    z-index: 999;

    animation:
        sparkle
        700ms
        ease-out
        forwards;
}

@keyframes sparkle {

    from {
        transform:
            translate(0,0)
            scale(1);

        opacity: 1;
    }

    to {
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);

        opacity: 0;
    }
}


/* =====================================================
   MODAL
===================================================== */

.modal {
    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.72);

    z-index: 100;

    opacity: 0;

    pointer-events: none;

    transition: .25s;
}

.modal.show {
    opacity: 1;

    pointer-events: auto;
}

.modal-box {
    width: 100%;

    max-width: 330px;

    padding:
        28px 22px;

    border-radius: 18px;

    background: #191c1f;

    border:
        1px solid
        #343a40;

    text-align: center;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.6);

    transform:
        scale(.85);

    transition: .25s;
}

.modal.show .modal-box {
    transform:
        scale(1);
}

.modal-title {
    font-size: 34px;

    font-weight: 900;
}

.modal-title.win {
    color: #42df78;
}

.modal-title.lose {
    color: #ef4752;
}

.modal-text {
    margin-top: 10px;

    color: #858b91;

    font-size: 14px;

    line-height: 1.6;
}

.modal-money {
    margin-top: 14px;

    font-size: 27px;

    font-weight: 900;
}

.modal-money.win {
    color: #42df78;
}

.modal-money.lose {
    color: #ef4752;
}

.modal-button {
    width: 100%;

    margin-top: 22px;

    padding: 14px;

    border: none;

    border-radius: 11px;

    background: #1678e8;

    color: white;

    font-size: 15px;

    font-weight: 900;

    cursor: pointer;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:360px) {

    .app {
        padding-left: 12px;
        padding-right: 12px;
    }

    .title {
        font-size: 27px;
    }

    .grid {
        gap: 7px;
    }
}

</style>
</head>


<body>

<div class="app">


    <!-- =================================================
         HEADER
    ================================================= -->

    <div class="header">

        <div class="logo">
            🐻‍❄️ DROP
        </div>

        <div class="balance-box">

            <div class="balance-label">
                Баланс
            </div>

            <div
                class="balance"
                id="balance">

                1000.00

            </div>

        </div>

    </div>


    <!-- =================================================
         TITLE
    ================================================= -->

    <div class="title">
        SCRATCH & WIN!
    </div>

    <div class="subtitle">
        Выберите билет и найдите<br>
        одинаковые символы
    </div>


    <!-- =================================================
         TICKET SELECT
    ================================================= -->

    <div class="ticket-select">


        <div
            class="ticket-card active"
            id="paidTicket">

            <div class="ticket-icon">
                🎟️
            </div>

            <div class="ticket-name">
                CLASSIC
            </div>

            <div class="ticket-price">
                100 валюты
            </div>

        </div>


        <div
            class="ticket-card free"
            id="freeTicket">

            <div class="ticket-icon">
                🆓
            </div>

            <div class="ticket-name">
                FREE
            </div>

            <div class="ticket-price">
                БЕСПЛАТНО
            </div>

        </div>

    </div>


    <!-- =================================================
         TICKET INFO
    ================================================= -->

    <div class="ticket-info">

        <div class="info-card">

            <div class="info-label">
                Билет
            </div>

            <div
                class="info-value"
                id="ticketCost">

                100

            </div>

        </div>


        <div class="info-card">

            <div class="info-label">
                Открытие
            </div>

            <div
                class="info-value"
                id="cellCost">

                50

            </div>

        </div>


        <div class="info-card">

            <div class="info-label">
                Приз
            </div>

            <div
                class="info-value"
                id="maxPrize">

                500

            </div>

        </div>

    </div>


    <!-- =================================================
         PURCHASE
    ================================================= -->

    <div
        class="purchase"
        id="purchase">

        <button
            class="main-button"
            id="buyButton">

            КУПИТЬ БИЛЕТ — 100

        </button>

        <div
            class="purchase-note"
            id="purchaseNote">

            Первые 2 открытия бесплатно

        </div>

    </div>


    <!-- =================================================
         GAME
    ================================================= -->

    <div
        class="game"
        id="game">

        <div class="game-status">

            <div
                class="status-text"
                id="statusText">

                Открыто: 0 / 9

            </div>

            <div
                class="free-info"
                id="freeInfo">

                Бесплатно: 2

            </div>

        </div>


        <div
            class="grid"
            id="grid">

        </div>

    </div>

</div>


<!-- =====================================================
     RESULT MODAL
===================================================== -->

<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <div
            class="modal-title"
            id="modalTitle">

            ПОБЕДА!

        </div>


        <div
            class="modal-text"
            id="modalText">

        </div>


        <div
            class="modal-money"
            id="modalMoney">

        </div>


        <button
            class="modal-button"
            id="againButton">

            ВЫБРАТЬ БИЛЕТ

        </button>

    </div>

</div>


<script>

/* =====================================================
   НАСТРОЙКИ БИЛЕТОВ
===================================================== */

const TICKETS = {

    classic: {

        name: "CLASSIC",

        price: 100,

        cellPrice: 50,

        freeCells: 2,

        winReward: 500,

        maxPrize: 500

    },


    free: {

        name: "FREE",

        price: 0,

        cellPrice: 5,

        freeCells: 0,

        winReward: 100,

        maxPrize: 100

    }

};


/* =====================================================
   БАЛАНС
===================================================== */

let balance = 1000;


/* =====================================================
   СОСТОЯНИЕ
===================================================== */

let selectedTicket =
    "classic";

let currentTicket = null;

let ticketActive = false;

let gameFinished = false;

let openedCells = 0;

let freeCellsLeft = 0;

let board = [];


/* =====================================================
   ОПЫТНЫЙ / РЕДКИЙ HEART
===================================================== */

/*
    Вероятность одного 💔
    здесь очень маленькая.

    0.035 = 3.5%
*/

const HEART_CHANCE = 0.035;


/* =====================================================
   СИМВОЛЫ CLASSIC
===================================================== */

const CLASSIC_SYMBOLS = [

    "🪙",
    "⭐",
    "💎",
    "🍀",
    "🧲",
    "🎰"

];


/* =====================================================
   СИМВОЛЫ FREE
===================================================== */

const FREE_SYMBOLS = [

    "🪙",
    "⭐",
    "💎",
    "🍀",
    "🧲",
    "🎰",
    "🍒",
    "🍋",
    "🔔",
    "👑",
    "🔥",
    "🎁",
    "💰",
    "🌟",
    "💫"

];


/* =====================================================
   DOM
===================================================== */

const balanceElement =
    document.getElementById(
        "balance"
    );

const paidTicket =
    document.getElementById(
        "paidTicket"
    );

const freeTicket =
    document.getElementById(
        "freeTicket"
    );

const ticketCost =
    document.getElementById(
        "ticketCost"
    );

const cellCost =
    document.getElementById(
        "cellCost"
    );

const maxPrize =
    document.getElementById(
        "maxPrize"
    );

const buyButton =
    document.getElementById(
        "buyButton"
    );

const purchase =
    document.getElementById(
        "purchase"
    );

const purchaseNote =
    document.getElementById(
        "purchaseNote"
    );

const game =
    document.getElementById(
        "game"
    );

const grid =
    document.getElementById(
        "grid"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const freeInfo =
    document.getElementById(
        "freeInfo"
    );

const modal =
    document.getElementById(
        "modal"
    );

const modalTitle =
    document.getElementById(
        "modalTitle"
    );

const modalText =
    document.getElementById(
        "modalText"
    );

const modalMoney =
    document.getElementById(
        "modalMoney"
    );

const againButton =
    document.getElementById(
        "againButton"
    );


/* =====================================================
   BALANCE
===================================================== */

function updateBalance() {

    balanceElement.textContent =
        balance.toFixed(2);
}


/* =====================================================
   RANDOM
===================================================== */

function randomItem(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];
}


/* =====================================================
   GENERATE CLASSIC BOARD
===================================================== */

function generateClassicBoard() {

    const symbols =
        CLASSIC_SYMBOLS;

    board = [];

    for (
        let i = 0;
        i < 9;
        i++
    ) {

        board.push(
            randomItem(symbols)
        );
    }


    /*
        Делаем шанс,
        что на поле вообще
        будет выигрыш.
    */

    if (
        Math.random() < 0.50
    ) {

        const winner =
            randomItem(symbols);

        const positions = [
            0,
            4,
            8
        ];


        positions.forEach(
            position => {

                board[position] =
                    winner;

            }
        );
    }
}


/* =====================================================
   GENERATE FREE BOARD
===================================================== */

function generateFreeBoard() {

    const symbols =
        FREE_SYMBOLS;

    board = [];


    /*
        Сначала обычная
        случайная раскладка.
    */

    for (
        let i = 0;
        i < 9;
        i++
    ) {

        /*
            💔 появляется
            крайне редко.
        */

        if (
            Math.random() <
            HEART_CHANCE
        ) {

            board.push("💔");

        }

        else {

            board.push(
                randomItem(symbols)
            );

        }
    }


    /*
        Очень редко создаём
        специальную комбинацию
        3 × 💔.

        Это намного реже
        обычного выигрыша.
    */

    if (
        Math.random() <
        0.01
    ) {

        const positions = [
            1,
            4,
            7
        ];


        positions.forEach(
            position => {

                board[position] =
                    "💔";

            }
        );
    }
}


/* =====================================================
   GENERATE BOARD
===================================================== */

function generateBoard() {

    if (
        currentTicket.name ===
        "CLASSIC"
    ) {

        generateClassicBoard();

    }

    else {

        generateFreeBoard();

    }
}


/* =====================================================
   CREATE BOARD
===================================================== */

function createBoard() {

    grid.innerHTML = "";

    openedCells = 0;

    freeCellsLeft =
        currentTicket.freeCells;

    gameFinished = false;


    generateBoard();


    for (
        let i = 0;
        i < 9;
        i++
    ) {

        const cell =
            document.createElement(
                "div"
            );

        cell.className =
            "cell";


        const icon =
            document.createElement(
                "div"
            );

        icon.className =
            "icon";

        icon.textContent =
            board[i];


        /*
            Особый стиль
            для 💔.
        */

        if (
            board[i] ===
            "💔"
        ) {

            icon.classList.add(
                "heart-glow"
            );
        }


        const scratch =
            document.createElement(
                "div"
            );

        scratch.className =
            "scratch";


        const price =
            document.createElement(
                "div"
            );

        price.className =
            "cell-price";


        if (
            currentTicket.freeCells >
            0 &&
            i < currentTicket.freeCells
        ) {

            price.textContent =
                "FREE";

        }

        else {

            price.textContent =
                currentTicket.cellPrice;
        }


        cell.appendChild(
            icon
        );

        cell.appendChild(
            scratch
        );

        cell.appendChild(
            price
        );


        cell.dataset.index =
            i;


        cell.addEventListener(
            "click",
            () => {

                openCell(
                    cell,
                    i
                );

            }
        );


        grid.appendChild(
            cell
        );
    }


    updateGameStatus();
}


/* =====================================================
   SELECT TICKET
===================================================== */

function selectTicket(
    type
) {

    if (
        ticketActive
    ) {

        return;
    }


    selectedTicket =
        type;


    if (
        type === "classic"
    ) {

        paidTicket.classList.add(
            "active"
        );

        freeTicket.classList.remove(
            "active"
        );

    }

    else {

        freeTicket.classList.add(
            "active"
        );

        paidTicket.classList.remove(
            "active"
        );
    }


    updateTicketInfo();
}


/* =====================================================
   UPDATE TICKET INFO
===================================================== */

function updateTicketInfo() {

    const ticket =
        TICKETS[selectedTicket];


    ticketCost.textContent =
        ticket.price;


    cellCost.textContent =
        ticket.cellPrice;


    maxPrize.textContent =
        ticket.maxPrize;


    if (
        selectedTicket ===
        "classic"
    ) {

        buyButton.textContent =
            "КУПИТЬ БИЛЕТ — 100";


        purchaseNote.textContent =
            "Первые 2 открытия бесплатно";

    }

    else {

        buyButton.textContent =
            "ПОЛУЧИТЬ БЕСПЛАТНЫЙ БИЛЕТ";


        purchaseNote.textContent =
            "Каждое открытие стоит 5 валюты";
    }
}


/* =====================================================
   SELECT EVENTS
===================================================== */

paidTicket.addEventListener(
    "click",
    () => {

        selectTicket(
            "classic"
        );

    }
);


freeTicket.addEventListener(
    "click",
    () => {

        selectTicket(
            "free"
        );

    }
);


/* =====================================================
   START TICKET
===================================================== */

buyButton.addEventListener(
    "click",
    () => {

        const ticket =
            TICKETS[selectedTicket];


        /*
            Проверка стоимости
            билета.
        */

        if (
            balance <
            ticket.price
        ) {

            alert(
                "Недостаточно валюты для покупки билета."
            );

            return;
        }


        /*
            Оплата билета.
        */

        balance -=
            ticket.price;


        balance =
            Math.round(
                balance * 100
            ) / 100;


        currentTicket =
            ticket;


        ticketActive = true;

        gameFinished = false;


        updateBalance();


        purchase.style.display =
            "none";


        game.classList.add(
            "active"
        );


        createBoard();
    }
);


/* =====================================================
   OPEN CELL
===================================================== */

function openCell(
    cell,
    index
) {

    if (
        gameFinished
    ) {
        return;
    }


    if (
        cell.classList.contains(
            "opened"
        )
    ) {

        return;
    }


    /*
        Если есть бесплатные
        открытия — используем их.
    */

    if (
        freeCellsLeft > 0
    ) {

        freeCellsLeft--;

    }

    else {

        /*
            Платим за открытие.
        */

        if (
            balance <
            currentTicket.cellPrice
        ) {

            alert(
                "Недостаточно валюты для открытия."
            );

            return;
        }


        balance -=
            currentTicket.cellPrice;


        balance =
            Math.round(
                balance * 100
            ) / 100;


        updateBalance();
    }


    openedCells++;


    cell.classList.add(
        "opened"
    );


    playScratchSound();


    /*
        Проверяем результат
        после анимации.
    */

    setTimeout(
        () => {

            checkWin();

        },
        320
    );


    updateGameStatus();
}


/* =====================================================
   UPDATE STATUS
===================================================== */

function updateGameStatus() {

    statusText.textContent =
        "Открыто: " +
        openedCells +
        " / 9";


    if (
        currentTicket &&
        currentTicket.freeCells >
        0
    ) {

        freeInfo.textContent =
            "Бесплатно: " +
            freeCellsLeft;

    }

    else {

        freeInfo.textContent =
            "Открытие: " +
            (
                currentTicket
                    ? currentTicket.cellPrice
                    : 0
            );
    }
}


/* =====================================================
   CHECK WIN
===================================================== */

function checkWin() {

    if (
        gameFinished
    ) {
        return;
    }


    const cells =
        document.querySelectorAll(
            ".cell"
        );


    const counts = {};


    cells.forEach(
        (cell, index) => {

            if (
                cell.classList.contains(
                    "opened"
                )
            ) {

                const icon =
                    board[index];


                counts[icon] =
                    (
                        counts[icon] ||
                        0
                    ) + 1;
            }

        }
    );


    /*
        Сначала проверяем
        особый 💔.
    */

    if (
        currentTicket.name ===
        "FREE" &&
        counts["💔"] >= 3
    ) {

        finishWin(
            "💔",
            500,
            true
        );

        return;
    }


    /*
        Обычная победа.
    */

    for (
        const icon in counts
    ) {

        if (
            icon !== "💔" &&
            counts[icon] >= 3
        ) {

            finishWin(
                icon,
                currentTicket.winReward,
                false
            );

            return;
        }
    }


    /*
        Все клетки открыты —
        проигрыш.
    */

    if (
        openedCells >= 9
    ) {

        finishLose();
    }
}


/* =====================================================
   WIN
===================================================== */

function finishWin(
    icon,
    reward,
    special
) {

    gameFinished = true;

    ticketActive = false;


    balance +=
        reward;


    balance =
        Math.round(
            balance * 100
        ) / 100;


    updateBalance();


    modalTitle.textContent =
        "ПОБЕДА!";


    modalTitle.className =
        "modal-title win";


    if (
        special
    ) {

        modalText.innerHTML =
            "Невероятно редкая комбинация!<br><br>" +
            "💔 💔 💔<br><br>" +
            "Вы нашли 3 редких 💔.";

    }

    else {

        modalText.innerHTML =
            "Вы нашли 3 одинаковых предмета:<br><br>" +
            icon +
            " " +
            icon +
            " " +
            icon;
    }


    modalMoney.textContent =
        "+" +
        reward;


    modalMoney.className =
        "modal-money win";


    modal.classList.add(
        "show"
    );


    createSparkles();
}


/* =====================================================
   LOSE
===================================================== */

function finishLose() {

    gameFinished = true;

    ticketActive = false;


    modalTitle.textContent =
        "ПОПРОБУЙ СНОВА";


    modalTitle.className =
        "modal-title lose";


    modalText.innerHTML =
        "Все 9 ячеек открыты,<br>" +
        "но трёх одинаковых предметов<br>" +
        "найти не удалось.";


    modalMoney.textContent =
        "0";


    modalMoney.className =
        "modal-money lose";


    modal.classList.add(
        "show"
    );
}


/* =====================================================
   AGAIN
===================================================== */

againButton.addEventListener(
    "click",
    () => {

        modal.classList.remove(
            "show"
        );


        purchase.style.display =
            "block";


        game.classList.remove(
            "active"
        );


        ticketActive = false;

        gameFinished = false;

        currentTicket = null;

        openedCells = 0;

        freeCellsLeft = 0;


        updateGameStatus();
    }
);


/* =====================================================
   SCRATCH SOUND
===================================================== */

let audioContext = null;


function playScratchSound() {

    try {

        if (
            !audioContext
        ) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }


        const buffer =
            audioContext.createBuffer(
                1,
                audioContext.sampleRate *
                0.08,
                audioContext.sampleRate
            );


        const data =
            buffer.getChannelData(
                0
            );


        for (
            let i = 0;
            i < data.length;
            i++
        ) {

            data[i] =
                (
                    Math.random() *
                    2 -
                    1
                ) *
                .18;
        }


        const source =
            audioContext.createBufferSource();


        source.buffer =
            buffer;


        const filter =
            audioContext.createBiquadFilter();


        filter.type =
            "highpass";


        filter.frequency.value =
            900;


        const gain =
            audioContext.createGain();


        gain.gain.value =
            .45;


        source
            .connect(filter)
            .connect(gain)
            .connect(
                audioContext.destination
            );


        source.start();

    }

    catch (error) {

        /*
            Если звук заблокирован,
            игра всё равно работает.
        */

    }
}


/* =====================================================
   SPARKLES
===================================================== */

function createSparkles() {

    for (
        let i = 0;
        i < 35;
        i++
    ) {

        const spark =
            document.createElement(
                "div"
            );


        spark.className =
            "spark";


        spark.style.left =
            "50%";

        spark.style.top =
            "50%";


        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            80 +
            Math.random() *
            220;


        spark.style.setProperty(
            "--x",
            Math.cos(angle) *
            distance +
            "px"
        );


        spark.style.setProperty(
            "--y",
            Math.sin(angle) *
            distance +
            "px"
        );


        document.body.appendChild(
            spark
        );


        setTimeout(
            () => {

                spark.remove();

            },
            750
        );
    }
}


/* =====================================================
   INIT
===================================================== */

updateBalance();

updateTicketInfo();

</script>
