<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cases</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #080b12;
    font-family: Arial, sans-serif;
    color: #fff;
}

body {
    overflow-x: hidden;
}

button {
    font-family: Arial, sans-serif;
}

#casesGameContainer {
    min-height: 100vh;
    padding: 16px 14px 40px;

    background:
        radial-gradient(
            circle at 50% -10%,
            rgba(110, 80, 255, .22),
            transparent 38%
        ),
        radial-gradient(
            circle at 100% 40%,
            rgba(0, 210, 255, .08),
            transparent 30%
        ),
        linear-gradient(
            160deg,
            #090c14,
            #101522,
            #080b12
        );
}

/* =====================================================
   TOPBAR
===================================================== */

.topbar {
    height: 52px;

    display: flex;
    justify-content: flex-end;
    align-items: center;
}

.balance-case {
    padding: 10px 16px;

    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            #1b2231,
            #111622
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    font-size: 18px;
    font-weight: 900;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.3);
}

.balance-case span {
    color: #ffd84d;
}


/* =====================================================
   SCREENS
===================================================== */

.screen-case {
    display: none;

    width: 100%;
    min-height: calc(100vh - 70px);
}

.screen-case.active {
    display: flex;
}


/* =====================================================
   MAIN SCREEN
===================================================== */

.main-screen {
    flex-direction: column;

    align-items: center;

    padding-top: 18px;

    gap: 18px;
}

.main-title {
    font-size: 28px;
    font-weight: 1000;

    letter-spacing: 3px;

    margin-bottom: 3px;

    text-shadow:
        0 0 20px
        rgba(167,139,250,.25);
}


/* =====================================================
   ОБЩИЙ СТИЛЬ ВСЕХ 4 КЕЙСОВ
===================================================== */

.case-image-card {
    width: min(900px, 96vw);

    display: flex;
    flex-direction: column;
    align-items: stretch;
}

.case-image-button {
    position: relative;

    z-index: 2;

    touch-action: manipulation;

    width: 100%;
    height: 175px;

    padding: 0;

    border: 1px solid rgba(255,255,255,.10);

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            #171d2b,
            #0e131f
        );

    overflow: hidden;

    cursor: pointer;

    display: block;

    box-shadow:
        0 18px 45px rgba(0,0,0,.48),
        0 0 0 1px rgba(255,255,255,.025);

    transition:
        transform .16s ease,
        box-shadow .16s ease,
        border-color .16s ease;
}

.case-image-button::before {
    content: "";

    position: absolute;

    inset: 0;

    z-index: 3;

    pointer-events: none;

    background:
        linear-gradient(
            115deg,
            rgba(255,255,255,.10),
            transparent 25%,
            transparent 70%,
            rgba(255,255,255,.04)
        );

    opacity: .55;
}

.case-image-button::after {
    content: "";

    position: absolute;

    left: 8%;
    right: 8%;
    bottom: -18px;

    height: 30px;

    z-index: 1;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse,
            rgba(120,90,255,.22),
            transparent 70%
        );

    filter: blur(10px);
}

.case-image-wrap {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    background: transparent;
}

.case-main-image {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    max-width: none;

    display: block;

    object-fit: fill;
    object-position: center center;

    user-select: none;
    pointer-events: none;

    transition:
        transform .2s ease,
        filter .2s ease;
}

.case-image-button:hover {
    transform: translateY(-2px);

    border-color:
        rgba(167,139,250,.35);

    box-shadow:
        0 22px 55px rgba(0,0,0,.52),
        0 0 25px rgba(110,80,255,.10);
}

.case-image-button:hover .case-main-image {
    transform: scale(1.015);
}

.case-image-button:active {
    transform: scale(.985);
}


/* =====================================================
   FREE STATUS
===================================================== */

.free-status {
    position: relative;

    z-index: 4;

    touch-action: manipulation;

    width: 88%;

    align-self: center;

    margin-top: 10px;

    padding: 11px 12px;

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #28bd9c,
            #14866f
        );

    color: #fff;

    font-size: 14px;
    font-weight: 1000;

    cursor: pointer;

    box-shadow:
        0 8px 20px
        rgba(20,134,111,.22);

    transition:
        transform .15s ease,
        filter .15s ease;
}

.free-status:hover {
    filter: brightness(1.08);
}

.free-status.cooldown {
    background:
        linear-gradient(
            135deg,
            #182b38,
            #14202d
        );

    color: #91d7ff;

    border-color:
        rgba(117,200,255,.25);

    box-shadow:
        0 8px 20px
        rgba(0,120,180,.10);
}

.free-status:active {
    transform: scale(.98);
}


/* =====================================================
   CASE 50 / 250
===================================================== */

.premium-label {
    position: relative;

    z-index: 5;

    align-self: center;

    margin-top: -14px;

    padding: 7px 14px;

    border-radius: 999px;

    background:
        rgba(15,18,28,.92);

    border:
        1px solid
        rgba(255,255,255,.10);

    color: #c9d1e2;

    font-size: 11px;
    font-weight: 1000;

    letter-spacing: .6px;

    box-shadow:
        0 7px 20px
        rgba(0,0,0,.35);
}


/* =====================================================
   ЭКРАН КЕЙСА
===================================================== */

.case-screen {
    flex-direction: column;

    padding-top: 8px;
}

.case-title-row {
    display: flex;

    justify-content: space-between;
    align-items: center;

    margin-bottom: 18px;
}

.case-title {
    font-size: 24px;

    font-weight: 1000;

    text-shadow:
        0 0 15px
        rgba(167,139,250,.2);
}

.back-case {
    padding: 10px 14px;

    border-radius: 11px;

    border:
        1px solid
        rgba(255,255,255,.08);

    background:
        #171d2a;

    color: #c4cada;

    font-weight: 800;

    cursor: pointer;

    transition:
        background .15s ease,
        transform .15s ease;
}

.back-case:hover {
    background: #1e2637;
}

.back-case:active {
    transform: scale(.97);
}


/* =====================================================
   РУЛЕТКА
===================================================== */

.roulette-section {
    position: relative;

    width: 100%;
}

.pointer-case {
    position: absolute;

    top: -1px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 10;

    width: 0;
    height: 0;

    border-left:
        16px solid transparent;

    border-right:
        16px solid transparent;

    border-top:
        25px solid #a78bfa;

    filter:
        drop-shadow(
            0 0 8px
            rgba(167,139,250,.7)
        );
}

.roulette-window {
    width: 100%;
    height: 160px;

    overflow: hidden;

    border-radius: 17px;

    background:
        linear-gradient(
            145deg,
            #101623,
            #0b101a
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        inset 0 0 40px
        rgba(0,0,0,.5),
        0 12px 30px
        rgba(0,0,0,.25);
}

.roulette-track {
    height: 100%;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 10px;

    transform:
        translateX(0);
}

.roulette-item {
    min-width: 125px;
    height: 125px;

    flex-shrink: 0;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            #1a2130,
            #131925
        );

    border:
        1px solid
        rgba(255,255,255,.08);

    text-align: center;

    box-shadow:
        inset 0 0 20px
        rgba(0,0,0,.18);
}

.roulette-emoji {
    font-size: 44px;
}

.roulette-name {
    margin-top: 8px;

    padding: 0 5px;

    font-size: 11px;

    font-weight: 800;

    color: #b8c2d4;
}


/* =====================================================
   КНОПКА ОТКРЫТИЯ
===================================================== */

.open-button {
    width: 100%;

    margin-top: 17px;

    padding: 17px;

    border: 0;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #7957ff,
            #5332d6
        );

    color: #fff;

    font-size: 18px;

    font-weight: 1000;

    cursor: pointer;

    box-shadow:
        0 10px 30px
        rgba(110,80,255,.25);

    transition:
        transform .15s ease,
        filter .15s ease;
}

.open-button:hover {
    filter: brightness(1.08);
}

.open-button.free-open {
    background:
        linear-gradient(
            135deg,
            #28bd9c,
            #14866f
        );
}

.open-button:active {
    transform: scale(.98);
}

.open-button:disabled {
    opacity: .5;

    cursor: not-allowed;
}


/* =====================================================
   ПРЕДМЕТЫ
===================================================== */

.items-title {
    margin: 27px 0 13px;

    text-align: center;

    font-size: 18px;

    font-weight: 1000;

    color: #e5e9f2;
}

.items-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 9px;
}

.item-card {
    min-height: 125px;

    padding: 10px 6px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    border-radius: 14px;

    background:
        linear-gradient(
            145deg,
            #171e2d,
            #121824
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    transition:
        transform .15s ease;
}

.item-card:hover {
    transform: translateY(-2px);
}

.item-emoji {
    font-size: 38px;

    line-height: 1;
}

.item-name {
    margin-top: 9px;

    font-size: 11px;

    font-weight: 800;

    color: #aeb8ca;

    line-height: 1.25;
}

.item-price {
    margin-top: 7px;

    color: #ffd84d;

    font-size: 13px;

    font-weight: 1000;
}

.legendary {
    border-color:
        rgba(255,215,70,.5);

    box-shadow:
        inset 0 0 18px
        rgba(255,215,70,.04);
}

.rare {
    border-color:
        rgba(100,150,255,.4);
}

.uncommon {
    border-color:
        rgba(60,190,165,.35);
}


/* =====================================================
   РЕЗУЛЬТАТ
===================================================== */

.modal-case {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.8);

    backdrop-filter:
        blur(5px);
}

.modal-case.show {
    display: flex;
}

.modal-box-case {
    width: 100%;
    max-width: 360px;

    padding: 28px 20px 23px;

    text-align: center;

    border-radius: 23px;

    background:
        linear-gradient(
            145deg,
            #1a2131,
            #0d121e
        );

    border:
        1px solid
        rgba(255,255,255,.1);

    box-shadow:
        0 25px 90px
        rgba(0,0,0,.65);
}

.result-emoji-case {
    font-size: 78px;

    margin-bottom: 12px;
}

.result-label-case {
    color: #8e99ad;

    font-size: 13px;

    font-weight: 800;

    letter-spacing: 1px;
}

.result-name-case {
    margin-top: 8px;

    font-size: 25px;

    font-weight: 1000;
}

.result-value-case {
    margin-top: 12px;

    font-size: 24px;

    color: #a78bfa;

    font-weight: 1000;
}

.result-buttons {
    display: flex;

    gap: 10px;

    margin-top: 23px;
}

.result-button {
    flex: 1;

    padding: 14px 8px;

    border: 0;

    border-radius: 13px;

    color: #fff;

    font-weight: 900;

    cursor: pointer;
}

.sell-button {
    background:
        linear-gradient(
            135deg,
            #7957ff,
            #5332d6
        );
}

.back-result-button {
    background: #1b2232;

    color: #aeb8ca;
}


/* =====================================================
   СООБЩЕНИЯ
===================================================== */

.message-case {
    position: fixed;

    left: 50%;
    bottom: 25px;

    z-index: 300;

    transform:
        translateX(-50%)
        translateY(100px);

    padding: 13px 18px;

    border-radius: 13px;

    background: #d24761;

    color: #fff;

    font-weight: 800;

    text-align: center;

    transition: .3s ease;

    max-width: 90vw;
}

.message-case.show {
    transform:
        translateX(-50%)
        translateY(0);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px) {

    #casesGameContainer {
        padding:
            12px
            10px
            30px;
    }

    .main-title {
        font-size: 25px;
    }

    .case-image-card {
        width: 100%;
    }

    .case-image-button {
        height: clamp(
            110px,
            29vw,
            175px
        );

        border-radius: 19px;
    }

    .free-status {
        width: 88%;
    }

    .case-title {
        font-size: 20px;
    }
}

@media(max-width:380px) {

    .case-image-button {
        border-radius: 17px;
    }

    .items-grid {
        gap: 7px;
    }

    .item-card {
        min-height: 115px;
    }
}
</style>
</head>

===================================================== */

let balance =
    Number(
        localStorage.getItem(
            "cases_balance"
        )
    );

if (!Number.isFinite(balance)) {
    balance = 1000;
}

let currentCaseType = "50";

let currentItems =
    cases["50"].items;

let currentWinner = null;

let opening = false;


/* =====================================================
   DOM
===================================================== */

const mainScreen =
    document.getElementById(
        "mainScreenCase"
    );

const caseScreen =
    document.getElementById(
        "caseScreenCase"
    );

const caseTitle =
    document.getElementById(
        "caseTitle"
    );

const openButton =
    document.getElementById(
        "openButton"
    );

const rouletteTrack =
    document.getElementById(
        "rouletteTrack"
    );

const itemsGrid =
    document.getElementById(
        "itemsGrid"
    );

const resultModal =
    document.getElementById(
        "resultModalCase"
    );

const message =
    document.getElementById(
        "messageCase"
    );


/* =====================================================
   БАЛАНС
===================================================== */

function updateBalance() {

    document.getElementById(
        "balanceCase"
    ).textContent =
        balance.toFixed(2);

    localStorage.setItem(
        "cases_balance",
        balance
    );

}


/* =====================================================
   ОТКРЫТИЕ ЭКРАНА КЕЙСА
===================================================== */

function openCaseScreen(type) {

    if (opening) return;

    if (!cases[type]) return;

    currentCaseType = type;

    currentItems =
        cases[type].items;

    caseTitle.textContent =
        cases[type].title;

    if (type === "free") {

        openButton.textContent =
            "ОТКРЫТЬ FREE 🎁";

        openButton.className =
            "open-button free-open";

    } else {

        openButton.textContent =
            "КУПИТЬ ЗА " +
            cases[type].price +
            " ⭐";

        openButton.className =
            "open-button";
    }

    mainScreen.classList.remove(
        "active"
    );

    caseScreen.classList.add(
        "active"
    );

    renderItems();

    resetRoulette();

}


/* =====================================================
   НАЗАД
===================================================== */

function showMainCase() {

    if (opening) {

        showMessage(
            "Подождите окончания открытия кейса"
        );

        return;
    }

    caseScreen.classList.remove(
        "active"
    );

    mainScreen.classList.add(
        "active"
    );

}


/* =====================================================
   ПРЕДМЕТЫ
===================================================== */

function renderItems() {

    itemsGrid.innerHTML = "";

    [...currentItems]
        .sort(
            (a, b) =>
                b.value - a.value
        )
        .forEach(item => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "item-card " +
                item.rarity;

            card.innerHTML = `
                <div class="item-emoji">
                    ${item.emoji}
                </div>

                <div class="item-name">
                    ${item.name}
                </div>

                <div class="item-price">
                    +${item.value} ⭐
                </div>
            `;

            itemsGrid.appendChild(
                card
            );

        });

}


/* =====================================================
   ВЫБОР ВЫИГРЫША
===================================================== */

function getRandomItem() {

    const total =
        currentItems.reduce(
            (sum, item) =>
                sum + item.chance,
            0
        );

    let random =
        Math.random() * total;

    for (
        const item of currentItems
    ) {

        random -= item.chance;

        if (random <= 0) {
            return item;
        }

    }

    return currentItems[
        currentItems.length - 1
    ];

}


/* =====================================================
   КАРТОЧКА РУЛЕТКИ
===================================================== */

function createRouletteCard(item) {

    const element =
        document.createElement(
            "div"
        );

    element.className =
        "roulette-item " +
        item.rarity;

    element.innerHTML = `
        <div class="roulette-emoji">
            ${item.emoji}
        </div>

        <div class="roulette-name">
            ${item.name}
        </div>
    `;

    return element;

}


/* =====================================================
   СБРОС РУЛЕТКИ
===================================================== */

function resetRoulette() {

    rouletteTrack.style.transition =
        "none";

    rouletteTrack.style.transform =
        "translateX(0px)";

    rouletteTrack.innerHTML = "";

    for (
        let i = 0;
        i < 18;
        i++
    ) {

        const item =
            currentItems[
                Math.floor(
                    Math.random() *
                    currentItems.length
                )
            ];

        rouletteTrack.appendChild(
            createRouletteCard(item)
        );

    }

}


/* =====================================================
   ОТКРЫТИЕ КЕЙСА
===================================================== */

function openCurrentCase() {

    if (opening) return;


    /* FREE */

    if (
        currentCaseType === "free"
    ) {

        const last =
            Number(
                localStorage.getItem(
                    "free_case_time"
                )
            ) || 0;

        const cooldown =
            24 * 60 * 60 * 1000;

        if (
            Date.now() - last <
            cooldown
        ) {

            showMessage(
                "FREE кейс ещё недоступен: " +
                formatTime(
                    cooldown -
                    (
                        Date.now() - last
                    )
                )
            );

            return;
        }

        localStorage.setItem(
            "free_case_time",
            Date.now()
        );

        updateFreeTimer();
    }


    /* ЦЕНА */

    const price =
        cases[
            currentCaseType
        ].price;

    if (
        price > 0 &&
        balance < price
    ) {

        showMessage(
            "Недостаточно ⭐"
        );

        return;
    }

    if (price > 0) {

        balance -= price;

        updateBalance();
    }

    opening = true;

    openButton.disabled = true;

    currentWinner =
        getRandomItem();

    startRoulette(
        currentWinner
    );

}


/* =====================================================
   ЗАПУСК РУЛЕТКИ
===================================================== */

function startRoulette(winner) {

    rouletteTrack.innerHTML = "";

    rouletteTrack.style.transition =
        "none";

    rouletteTrack.style.transform =
        "translateX(0px)";

    const total = 45;

    const winnerIndex = 36;

    for (
        let i = 0;
        i < total;
        i++
    ) {

        const item =
            i === winnerIndex
                ? winner
                : currentItems[
                    Math.floor(
                        Math.random() *
                        currentItems.length
                    )
                ];

        rouletteTrack.appendChild(
            createRouletteCard(item)
        );

    }

    const rouletteWindow =
        document.querySelector(
            ".roulette-window"
        );

    const windowWidth =
        rouletteWindow.clientWidth;

    const firstCard =
        rouletteTrack.querySelector(
            ".roulette-item"
        );

    const cardWidth =
        firstCard
            ? firstCard.offsetWidth
            : 125;

    const gap = 10;

    const center =
        windowWidth / 2 -
        cardWidth / 2;

    const position =
        -(
            winnerIndex *
            (cardWidth + gap) -
            center
        );

    const offsetRange =
        Math.min(
            16,
            cardWidth * .12
        );

    const randomOffset =
        Math.random() *
        offsetRange -
        offsetRange / 2;

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            rouletteTrack.style.transition =
                "transform 6.5s cubic-bezier(.08,.72,.05,1)";

            rouletteTrack.style.transform =
                `translateX(${
                    position +
                    randomOffset
                }px)`;

        });

    });

    setTimeout(() => {

        showResult(
            winner
        );

        opening = false;

        openButton.disabled = false;

    }, 6800);

}


/* =====================================================
   РЕЗУЛЬТАТ
===================================================== */

function showResult(item) {

    document.getElementById(
        "resultEmoji"
    ).textContent =
        item.emoji;

    document.getElementById(
        "resultName"
    ).textContent =
        item.name;

    document.getElementById(
        "resultValue"
    ).textContent =
        "+" +
        item.value +
        " ⭐";

    resultModal.classList.add(
        "show"
    );

}


/* =====================================================
   ПРОДАТЬ
===================================================== */

function sellResult() {

    if (!currentWinner) return;

    balance =
        Math.round(
            (
                balance +
                currentWinner.value
            ) * 100
        ) / 100;

    updateBalance();

    closeResult();

    showMessage(
        "Предмет продан ⭐"
    );

}


/* =====================================================
   В ИНВЕНТАРЬ
===================================================== */

function saveResult() {

    if (!currentWinner) return;

    let inventory = [];

    try {

        inventory =
            JSON.parse(
                localStorage.getItem(
                    "case_inventory"
                )
            ) || [];

    } catch (error) {

        inventory = [];

    }

    inventory.push(
        currentWinner
    );

    localStorage.setItem(
        "case_inventory",
        JSON.stringify(
            inventory
        )
    );

    closeResult();

    showMessage(
        "Предмет сохранён в инвентарь 🎒"
    );

}


/* =====================================================
   ЗАКРЫТЬ РЕЗУЛЬТАТ
===================================================== */

function closeResult() {

    resultModal.classList.remove(
        "show"
    );

    currentWinner = null;

    resetRoulette();

}


/* =====================================================
   ФОРМАТ ВРЕМЕНИ
===================================================== */

function formatTime(ms) {

    let seconds =
        Math.ceil(
            ms / 1000
        );

    const hours =
        Math.floor(
            seconds / 3600
        );

    seconds %= 3600;

    const minutes =
        Math.floor(
            seconds / 60
        );

    seconds %= 60;

    return (
        String(hours).padStart(2, "0") +
        ":" +
        String(minutes).padStart(2, "0") +
        ":" +
        String(seconds).padStart(2, "0")
    );

}


/* =====================================================
   ТАЙМЕР FREE
===================================================== */

function updateFreeTimer() {

    const button =
        document.getElementById(
            "freeStatusButton"
        );

    const last =
        Number(
            localStorage.getItem(
                "free_case_time"
            )
        ) || 0;

    const cooldown =
        24 * 60 * 60 * 1000;

    const remaining =
        cooldown -
        (
            Date.now() -
            last
        );

    if (remaining <= 0) {

        button.textContent =
            "ГОТОВ К ОТКРЫТИЮ";

        button.classList.remove(
            "cooldown"
        );

        return;
    }

    button.textContent =
        "СНОВА ЧЕРЕЗ " +
        formatTime(
            remaining
        );

    button.classList.add(
        "cooldown"
    );

}

   СООБЩЕНИЯ
===================================================== */

function showMessage(text) {

    clearTimeout(
        messageTimer

    message.textContent =
        text;

    message.classList.add(
        "show"
    );

    messageTimer =
        setTimeout(() => {

            message.classList.remove(
                "show"

        }, 2500);

}
