<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casino</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;font-family:'Segoe UI',sans-serif}
        body{background:#0a0a0f;color:#fff;min-height:100vh;display:flex;flex-direction:column;padding-bottom:70px}
        .top-bar{background:#0d0d14;padding:10px 16px;border-bottom:1px solid #1a1a24;display:flex;justify-content:space-between;align-items:center}
        .top-bar .logo{font-weight:700;color:#f0b90b;font-size:16px}
        .top-bar .balance{color:#f0b90b;font-weight:600;font-size:16px}
        .page{display:none;flex-direction:column;flex:1;padding:16px 20px}
        .page.active{display:flex}
        .page-title{font-size:22px;font-weight:700;margin-bottom:14px;color:#f0b90b}
        
        /* МЕНЮ */
        .menu-hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
        .menu-hero h1{font-size:48px;font-weight:900;color:#f0b90b}
        .menu-hero .subtitle{color:#aaa;font-size:16px;margin-top:6px}
        .menu-hero .game-btn{background:#f0b90b;color:#0a0a0f;padding:14px 40px;border-radius:12px;font-size:17px;font-weight:700;border:none;cursor:pointer;margin-top:16px;width:80%;max-width:280px}
        .menu-hero .game-btn:active{background:#d4a40a}
        .menu-hero .game-btn.secondary{background:#1a1a24;border:1px solid #f0b90b;color:#f0b90b}
        .menu-hero .game-btn.secondary:active{background:#2a2a3a}
        
        /* ИНВЕНТАРЬ */
        .empty-inventory{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#666;text-align:center}
        .empty-inventory .icon{font-size:56px;margin-bottom:12px;opacity:0.4}
        .empty-inventory h2{color:#888;font-weight:400;font-size:18px}
        .inventory-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
        .inv-item{background:#1a1a24;border:1px solid #2a2a3a;border-radius:14px;padding:14px;text-align:center}
        .inv-item .icon{font-size:30px}
        .inv-item .name{font-size:13px;color:#ccc;margin-top:4px}
        .inv-item .value{font-size:12px;color:#f0b90b;margin-top:2px}
        .inv-item .sell-btn{background:#e74c3c;color:#fff;border:none;padding:5px 10px;border-radius:8px;font-size:11px;cursor:pointer;margin-top:6px;width:100%}
        .inv-item .sell-btn:active{background:#c0392b}
        .inv-actions{display:flex;gap:10px;margin-top:12px}
        .inv-actions .btn{flex:1;padding:10px;border-radius:10px;border:none;font-weight:600;font-size:13px;cursor:pointer;background:#1a1a24;border:1px solid #f0b90b;color:#f0b90b}
        .inv-actions .btn:active{background:#2a2a3a}
        
        /* КЕЙСЫ */
        .cases-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
        .case-item{background:#1a1a24;border:1px solid #2a2a3a;border-radius:14px;padding:16px;text-align:center;cursor:pointer;transition:all .15s}
        .case-item:active{transform:scale(0.95);border-color:#f0b90b}
        .case-item .icon{font-size:38px}
        .case-item .name{font-size:14px;font-weight:600;color:#fff;margin-top:4px}
        .case-item .price{font-size:13px;color:#f0b90b;margin-top:2px}
        .case-item .count{font-size:11px;color:#666;margin-top:2px}
        
        /* ПРЕДПРОСМОТР КЕЙСА */
        .case-preview{background:#1a1a24;border:1px solid #2a2a3a;border-radius:14px;padding:16px;margin-top:12px}
        .case-preview .items-preview{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
        .case-preview .preview-item{background:#0d0d14;border-radius:8px;padding:8px 4px;text-align:center;border:1px solid #1a1a24}
        .case-preview .preview-item .icon{font-size:22px}
        .case-preview .preview-item .name{font-size:9px;color:#999;margin-top:2px}
        .case-preview .preview-item .price{font-size:8px;color:#f0b90b}
        .case-preview .case-actions{display:flex;gap:10px;margin-top:10px}
        .case-preview .case-actions .btn{flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;font-size:14px;cursor:pointer}
        .case-preview .case-actions .btn:active{transform:scale(0.95)}
        .case-preview .case-actions .btn.open{background:#f0b90b;color:#0a0a0f}
        .case-preview .case-actions .btn.back{background:#1a1a24;border:1px solid #444;color:#aaa}
        
        /* АНИМАЦИЯ КЕЙСА */
        .case-animation{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:300;padding:16px}
        .case-animation.active{display:flex}
        .slot-machine{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:420px;padding:16px;background:#0d0d14;border-radius:14px;border:1px solid #1a1a24}
        .slot-item{background:#1a1a24;border:2px solid #333;border-radius:10px;padding:8px 4px;text-align:center;width:58px;transition:all .2s ease}
        .slot-item .icon{font-size:24px}
        .slot-item .name{font-size:8px;color:#888;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:48px}
        .slot-item .slot-price{font-size:7px;color:#555;margin-top:1px}
        .slot-item.winner{border-color:#f0b90b;box-shadow:0 0 20px rgba(240,185,11,0.4);transform:scale(1.05);background:#1a1a24}
        .slot-item.winner .name{color:#f0b90b}
        .case-result{margin-top:14px;text-align:center;display:none}
        .case-result.show{display:block}
        .case-result .icon{font-size:48px}
        .case-result .name{font-size:20px;color:#f0b90b;font-weight:700;margin-top:6px}
        .case-close-btn{background:#f0b90b;color:#0a0a0f;padding:12px 30px;border-radius:12px;border:none;font-weight:700;font-size:15px;cursor:pointer;margin-top:14px}
        .case-close-btn:active{background:#d4a40a}
        
        /* АПГРЕЙД */
        .upgrade-container{display:flex;flex-direction:column;align-items:center;gap:12px}
        .wheel-wrapper{position:relative;width:200px;height:200px;margin:0 auto}
        .wheel-canvas{width:200px;height:200px;border-radius:50%;border:3px solid #f0b90b}
        .wheel-arrow{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:28px;color:#f0b90b;z-index:10}
        .wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:36px;height:36px;background:#0a0a0f;border-radius:50%;border:3px solid #f0b90b;z-index:5}
        .upgrade-info{text-align:center;color:#aaa;font-size:13px}
        .upgrade-info .green{color:#2ecc71}
        .upgrade-info .red{color:#e74c3c}
        .selected-skin-info{color:#aaa;font-size:13px;margin-top:2px}
        .selected-skin-info span{color:#f0b90b}
        .upgrade-controls{display:flex;flex-direction:column;gap:6px;width:100%;max-width:280px}
        .upgrade-controls .row{display:flex;gap:8px}
        .upgrade-controls .btn{flex:1;padding:10px;border-radius:10px;border:none;font-weight:600;font-size:13px;cursor:pointer;background:#1a1a24;border:1px solid #f0b90b;color:#f0b90b}
        .upgrade-controls .btn:active{background:#2a2a3a}
        .upgrade-controls .btn.primary{background:#f0b90b;color:#0a0a0f}
        .upgrade-controls .btn.primary:active{background:#d4a40a}
        .upgrade-controls .multipliers{display:flex;gap:6px}
        .upgrade-controls .multipliers .btn{flex:1;font-size:12px;padding:8px}
        .upgrade-controls .multipliers .btn.active{background:#f0b90b;color:#0a0a0f}
        
        .glow-green,.glow-red{position:absolute;top:-6px;left:-6px;width:212px;height:212px;border-radius:50%;z-index:0;pointer-events:none;opacity:0;transition:opacity .3s}
        .glow-green.active{opacity:1;background:radial-gradient(circle,rgba(46,204,113,0.2),transparent 70%)}
        .glow-red.active{opacity:1;background:radial-gradient(circle,rgba(231,76,60,0.2),transparent 70%)}
        
        .profile-card{background:#1a1a24;border-radius:14px;padding:14px 16px;margin-bottom:8px;border:1px solid #2a2a3a}
        .profile-card .label{color:#888;font-size:11px;text-transform:uppercase}
        .profile-card .value{font-size:17px;font-weight:600;color:#fff;margin-top:2px}
        .profile-card .balance-num{font-size:24px;font-weight:700;color:#f0b90b}
        .wallet-row{display:flex;gap:8px;margin-top:4px}
        .wallet-row input{flex:1;background:#0a0a0f;border:1px solid #2a2a3a;border-radius:10px;padding:10px 12px;color:#fff;font-size:13px;outline:none}
        .wallet-row input:focus{border-color:#f0b90b}
        .wallet-row button{padding:10px 16px;border-radius:10px;border:none;font-weight:600;cursor:pointer;background:#f0b90b;color:#0a0a0f}
        .wallet-row button:active{background:#d4a40a}
        .profile-btn{width:100%;padding:11px;border-radius:10px;border:none;font-weight:600;font-size:14px;cursor:pointer;margin-top:4px}
        .profile-btn:active{transform:scale(0.97)}
        .profile-btn.primary{background:#f0b90b;color:#0a0a0f}
        .profile-btn.secondary{background:#1a1a24;border:1px solid #f0b90b;color:#f0b90b}
        .profile-btn.outline{background:transparent;border:1px solid #444;color:#aaa}
        .ref-link{background:#0a0a0f;padding:8px 12px;border-radius:8px;font-size:12px;color:#aaa;word-break:break-all;margin-top:4px;border:1px solid #1a1a24}
        
        .skin-select-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.92);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:400;padding:20px}
        .skin-select-overlay.active{display:flex}
        .skin-select-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;max-height:350px;overflow-y:auto;padding:8px}
        .skin-select-item{background:#1a1a24;border:1px solid #2a2a3a;border-radius:10px;padding:12px;text-align:center;cursor:pointer}
        .skin-select-item:active{transform:scale(0.95);border-color:#f0b90b}
        .skin-select-item .icon{font-size:28px}
        .skin-select-item .name{font-size:11px;color:#ccc;margin-top:4px}
        .skin-select-close{background:#f0b90b;color:#0a0a0f;padding:10px 30px;border-radius:10px;border:none;font-weight:700;font-size:14px;cursor:pointer;margin-top:12px}
        .skin-select-close:active{background:#d4a40a}
        
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0d0d14;border-top:1px solid #1a1a24;display:flex;justify-content:space-around;padding:6px 0 10px;z-index:100}
        .nav-item{display:flex;flex-direction:column;align-items:center;color:#666;font-size:10px;cursor:pointer;padding:4px 8px;background:none;border:none;font-family:inherit;flex:1;max-width:72px;transition:color .15s}
        .nav-item .icon{font-size:24px;margin-bottom:2px}
        .nav-item.active{color:#f0b90b}
        
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a24;border:1px solid #f0b90b;padding:10px 18px;border-radius:10px;color:#fff;font-weight:500;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center;font-size:13px}
        .toast.show{opacity:1}
        .toast.error{border-color:#ff4444}
        .toast.success{border-color:#44ff88}
    </style>
</head>
<body>

        <button class="nav-item" data-page="page-profile" onclick="switchPage('page-profile')"><span class="icon">👤</span><span>Профиль</span></button>

        let selectedSkin = null;

        let wheelAngle = 0;

                { id: 'heart', name: 'Сердечко', icon: '❤️', value: 15 },
                { id: 'rose', name: 'Роза', icon: '🌹', value: 20 },

        const cases = [
            { id: 'case1', name: 'Обычный', price: 100, icon: '📦' },
            { id: 'case2', name: 'Редкий', price: 500, icon: '📦' },
            { id: 'case3', name: 'Эпический', price: 1000, icon: '📦' },
            { id: 'case4', name: 'Легендарный', price: 2500, icon: '📦' },
            { id: 'case5', name: 'Мифический', price: 5000, icon: '📦' },
        ];

        // ==================== ФУНКЦИИ ====================
        function updateUI() {
            document.getElementById('top-balance').textContent = '💎 ' + balance;
            const pb = document.getElementById('profile-balance');
            if (pb) pb.textContent = '💎 ' + balance;
        }

        function saveData() {
            localStorage.setItem('casino_data', JSON.stringify({ balance, inventory, usedPromoCodes }));
        }

        function loadData() {
            try {
                const raw = localStorage.getItem('casino_data');
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data.balance !== undefined) balance = data.balance;
                if (data.inventory) inventory = data.inventory;
                if (data.usedPromoCodes) usedPromoCodes = data.usedPromoCodes;
                updateUI();
                renderInventory();
            } catch(e) {}
        }

        function switchPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            const btn = document.querySelector(`.nav-item[data-page="${id}"]`);
            if (btn) btn.classList.add('active');
            if (id === 'page-inventory') renderInventory();
            if (id === 'page-profile') updateRefLink();
            updateUI();
        }

        function updateRefLink() {
            document.getElementById('ref-link').textContent = `https://t.me/MusorDrop_ROBOT?start=ref${123}`;
        }

        function switchToGame(game) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-games').classList.add('active');
            const content = document.getElementById('game-content');
            if (game === 'cases') renderCases(content);
            else renderUpgrade(content);
        }

        // ==================== КЕЙСЫ ====================
        function renderCases(content) {
            let html = '<div class="page-title">📦 Кейсы</div><div class="cases-grid">';
            cases.forEach(c => {
                html += `<div class="case-item" onclick="showPreview('${c.id}')">
                    <div class="icon">${c.icon}</div>
                    <div class="name">${c.name}</div>
                    <div class="price">${c.price} 💎</div>
                    <div class="count">${caseItems[c.id].length} предметов</div>
                </div>`;
            });
            html += '</div>';
            document.getElementById('case-preview').style.display = 'none';
            content.innerHTML = html;
        }

        function showPreview(id) {
            const c = cases.find(x => x.id === id);
            if (!c) return;
            currentCase = c;
            const preview = document.getElementById('case-preview');
            preview.style.display = 'block';
            document.getElementById('preview-title').textContent = `📦 ${c.name}`;
            const items = document.getElementById('preview-items');
            items.innerHTML = '';
            caseItems[id].forEach(item => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `<div class="icon">${item.icon}</div><div class="name">${item.name}</div><div class="price">${item.value}💎</div>`;
                items.appendChild(div);
            });
            document.getElementById('preview-open').textContent = `🎲 Открыть за ${c.price}💎`;
            document.getElementById('preview-open').onclick = () => openCase(id);
            preview.scrollIntoView({ behavior: 'smooth' });
        }

        function closeCasePreview() {
            document.getElementById('case-preview').style.display = 'none';
            currentCase = null;
        }

        function getRandomItem(items) {
            const price = currentCase ? currentCase.price : 100;
            const profitable = items.filter(i => i.value >= price);
            if (Math.random() < 0.35 && profitable.length) {
                return profitable[Math.floor(Math.random() * profitable.length)];
            }
            // Взвешенный шанс
            const weights = items.map(i => {
                if (i.value <= 50) return 100;
                if (i.value <= 200) return 50;
                if (i.value <= 500) return 20;
                if (i.value <= 1000) return 8;
                if (i.value <= 5000) return 2;
                if (i.value <= 25000) return 0.5;
                return 0.1;
            });
            const total = weights.reduce((a,b) => a+b, 0);
            let r = Math.random() * total;
            for (let i = 0; i < items.length; i++) {
                r -= weights[i];
                if (r <= 0) return items[i];
            }
            return items[items.length-1];
        }

        function openCase(id) {
            const c = cases.find(x => x.id === id);
            if (!c) return;
            if (balance < c.price) {
                showToast('❌ Недостаточно алмазов!', 'error');
                return;
            }
            balance -= c.price;
            updateUI();
            saveData();
            closeCasePreview();

            const items = caseItems[id];
            const selected = getRandomItem(items);
            showAnimation(items, selected);
        }

        function showAnimation(allItems, selected) {
            const overlay = document.getElementById('case-animation');
            const machine = document.getElementById('slot-machine');
            const resultDiv = document.getElementById('case-result');
            const resultIcon = document.getElementById('result-icon');
            const resultName = document.getElementById('result-name');

            overlay.classList.add('active');
            resultDiv.classList.remove('show');
            machine.innerHTML = '';

            const total = 15;
            const slotItems = [];
            for (let i = 0; i < total; i++) {
                slotItems.push(allItems[Math.floor(Math.random() * allItems.length)]);
            }
            const winIndex = Math.floor(Math.random() * total);
            slotItems[winIndex] = selected;

            slotItems.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'slot-item';
                div.dataset.index = idx;
                div.innerHTML = `<div class="icon">${item.icon}</div><div class="name">${item.name}</div><div class="slot-price">${item.value}💎</div>`;
                machine.appendChild(div);
            });

            const items = document.querySelectorAll('.slot-item');
            let highlight = 0;
            let dir = 1;

            const interval = setInterval(() => {
                items.forEach(el => el.classList.remove('winner'));
                if (items.length) {
                    items[highlight % items.length].classList.add('winner');
                    highlight += dir;
                    if (highlight >= items.length - 1 || highlight <= 0) dir *= -1;
                }
            }, 120);

            setTimeout(() => {
                clearInterval(interval);
                items.forEach(el => el.classList.remove('winner'));
                const winEl = document.querySelector(`.slot-item[data-index="${winIndex}"]`);
                if (winEl) winEl.classList.add('winner');

                inventory.push(selected);
                saveData();
                resultIcon.textContent = selected.icon;
                resultName.textContent = selected.name;
                resultDiv.classList.add('show');
                showToast(`🎉 Вы получили: ${selected.name}! (${selected.value}💎)`, 'success');
                renderInventory();
            }, 2200);
        }

        function closeCaseAnimation() {
            document.getElementById('case-animation').classList.remove('active');
        }

        // ==================== АПГРЕЙД ====================
        function renderUpgrade(content) {
            content.innerHTML = `
                <div class="page-title">⚡ Апгрейд</div>
                <div class="upgrade-container">
                    <div class="wheel-wrapper">
                        <div class="glow-green" id="glow-green"></div>
                        <div class="glow-red" id="glow-red"></div>
                        <canvas class="wheel-canvas" id="wheelCanvas" width="200" height="200"></canvas>
                        <div class="wheel-arrow">▼</div>
                        <div class="wheel-center"></div>
                    </div>
                    <div class="upgrade-info" id="upgrade-info">
                        <span class="green">🟢 Победа: ${getWinChance()}%</span> | 
                        <span class="red">🔴 Поражение: ${100 - getWinChance()}%</span>
                    </div>
                    <div class="selected-skin-info" id="selected-skin-info">Выбран: <span>Нет</span></div>
                    <div class="upgrade-controls">
                        <div class="row">
                            <button class="btn" onclick="openSkinSelect()">🎯 Выбрать скин</button>
                            <button class="btn primary" onclick="spinUpgrade()">🎰 Крутить</button>
                        </div>
                        <div class="multipliers">
                            <button class="btn ${multiplier===2?'active':''}" onclick="setMult(2)">x2</button>
                            <button class="btn ${multiplier===5?'active':''}" onclick="setMult(5)">x5</button>
                            <button class="btn ${multiplier===10?'active':''}" onclick="setMult(10)">x10</button>
                        </div>
                    </div>
                </div>
            `;
            drawWheel(wheelAngle);
        }

        function getWinChance() { return Math.max(10, 60 - multiplier * 5); }

        function setMult(m) {
            multiplier = m;
            document.querySelectorAll('.multipliers .btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.multipliers .btn').forEach(b => { if (b.textContent === `x${m}`) b.classList.add('active'); });
            const info = document.getElementById('upgrade-info');
            if (info) info.innerHTML = `<span class="green">🟢 Победа: ${getWinChance()}%</span> | <span class="red">🔴 Поражение: ${100 - getWinChance()}%</span>`;
            drawWheel(wheelAngle);
            showToast(`Множитель: x${m}`, 'info', 1500);
        }

        function drawWheel(angle = 0) {
            const canvas = document.getElementById('wheelCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = 200, h = 200, cx = 100, cy = 100, r = 90;
            ctx.clearRect(0, 0, w, h);

            const win = getWinChance();
            const lose = 100 - win;

            ctx.beginPath(); ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, -Math.PI/2 + angle, -Math.PI/2 + (win/100) * 2 * Math.PI + angle);
            ctx.closePath(); ctx.fillStyle = '#2ecc71'; ctx.fill();

            ctx.beginPath(); ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, -Math.PI/2 + (win/100) * 2 * Math.PI + angle, -Math.PI/2 + 2 * Math.PI + angle);
            ctx.closePath(); ctx.fillStyle = '#e74c3c'; ctx.fill();

            ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI);
            ctx.strokeStyle = '#f0b90b'; ctx.lineWidth = 2; ctx.stroke();

            ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            const mid = -Math.PI/2 + angle + (win/100) * Math.PI;
            ctx.fillText(`${win}%`, cx + r * 0.6 * Math.cos(mid), cy + r * 0.6 * Math.sin(mid));
            const lAng = -Math.PI/2 + angle + (win/100) * 2 * Math.PI + (lose/100) * Math.PI;
            ctx.fillText(`${lose}%`, cx + r * 0.6 * Math.cos(lAng), cy + r * 0.6 * Math.sin(lAng));

            const g = document.getElementById('glow-green');
            const red = document.getElementById('glow-red');
            if (g && red) {
                const arrow = -Math.PI/2 + angle;
                const norm = ((arrow % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
                const isG = norm >= 0 && norm <= (win/100) * 2 * Math.PI;
                g.classList.toggle('active', isG);
                red.classList.toggle('active', !isG);
            }
        }

        function openSkinSelect() {
            if (!inventory.length) {
                showToast('❌ Нет предметов для апгрейда!', 'error');
                return;
            }
            const overlay = document.getElementById('skin-select-overlay');
            const grid = document.getElementById('skin-select-grid');
            grid.innerHTML = '';
            inventory.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'skin-select-item';
                div.innerHTML = `<div class="icon">${item.icon}</div><div class="name">${item.name}</div>`;
                div.onclick = () => { selectedSkin = item; document.getElementById('selected-skin-info').innerHTML = `Выбран: <span>${item.name}</span>`; closeSkinSelect(); showToast(`✅ Выбран: ${item.name}`, 'success'); };
                grid.appendChild(div);
            });
            overlay.classList.add('active');
        }

        function closeSkinSelect() {
            document.getElementById('skin-select-overlay').classList.remove('active');
        }

        function spinUpgrade() {
            if (!selectedSkin) {
                showToast('❌ Сначала выберите скин!', 'error');
                return;
            }
            if (isSpinning) return;
            isSpinning = true;

            const canvas = document.getElementById('wheelCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = 200, h = 200, cx = 100, cy = 100, r = 90;

            const win = getWinChance();
            const isWin = Math.random() * 100 < win;

            const randOff = Math.random() * 2 * Math.PI;
            const target = randOff + (isWin ? 0 : 2 * Math.PI * (win/100) + Math.PI/2);
            const totalRot = 4 * Math.PI + target;
            const duration = 2000 + Math.random() * 800;
            const start = Date.now();
            const startAng = wheelAngle;

            function anim() {
                const elapsed = Date.now() - start;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                const current = startAng + totalRot * ease;

                ctx.clearRect(0, 0, w, h);

                ctx.beginPath(); ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, -Math.PI/2 + current, -Math.PI/2 + (win/100) * 2 * Math.PI + current);
                ctx.closePath(); ctx.fillStyle = '#2ecc71'; ctx.fill();

                ctx.beginPath(); ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, -Math.PI/2 + (win/100) * 2 * Math.PI + current, -Math.PI/2 + 2 * Math.PI + current);
                ctx.closePath(); ctx.fillStyle = '#e74c3c'; ctx.fill();

                ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                ctx.strokeStyle = '#f0b90b'; ctx.lineWidth = 2; ctx.stroke();

                ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                const mid = -Math.PI/2 + current + (win/100) * Math.PI;
                ctx.fillText(`${win}%`, cx + r * 0.6 * Math.cos(mid), cy + r * 0.6 * Math.sin(mid));
                const lAng = -Math.PI/2 + current + (win/100) * 2 * Math.PI + ((100-win)/100) * Math.PI;
                ctx.fillText(`${100-win}%`, cx + r * 0.6 * Math.cos(lAng), cy + r * 0.6 * Math.sin(lAng));

                const g = document.getElementById('glow-green');
                const red = document.getElementById('glow-red');
                if (g && red) {
                    const arrow = -Math.PI/2 + current;
                    const norm = ((arrow % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
                    const isG = norm >= 0 && norm <= (win/100) * 2 * Math.PI;
                    g.classList.toggle('active', isG);
                    red.classList.toggle('active', !isG);
                }

                if (progress < 1) {
                    requestAnimationFrame(anim);
                } else {
                    wheelAngle = current;
                    isSpinning = false;
                    if (isWin) {
                        const upgraded = { ...selectedSkin, value: Math.round(selectedSkin.value * multiplier) };
                        inventory = inventory.filter(i => i.id !== selectedSkin.id);
                        inventory.push(upgraded);
                        showToast(`🎉 Апгрейд успешен! +${multiplier}x`, 'success');
                    } else {
                        inventory = inventory.filter(i => i.id !== selectedSkin.id);
                        showToast('💥 Скин сгорел!', 'error');
                    }
                    selectedSkin = null;
                    document.getElementById('selected-skin-info').innerHTML = 'Выбран: <span>Нет</span>';
                    saveData();
                    renderInventory();
                    renderUpgrade(document.getElementById('game-content'));
                }
            }
            anim();
        }

        // ==================== ИНВЕНТАРЬ ====================
        function renderInventory() {
            const container = document.getElementById('inventory-content');
            if (!inventory.length) {
                container.innerHTML = `<div class="empty-inventory"><div class="icon">🎒</div><h2>Пока ничего нет</h2><p style="color:#555;font-size:13px;margin-top:6px;">Открой кейс, чтобы получить предметы</p></div>`;
                return;
            }
            let html = '<div class="inventory-grid">';
            inventory.forEach((item, idx) => {
                html += `<div class="inv-item">
                    <div class="icon">${item.icon}</div>
                    <div class="name">${item.name}</div>
                    <div class="value">${item.value} 💎</div>
                    <button class="sell-btn" onclick="sellItem(${idx})">💰 Продать</button>
                </div>`;
            });
            html += `</div><div class="inv-actions"><button class="btn" onclick="sellAll()">💰 Продать всё</button></div>`;
            container.innerHTML = html;
        }

        function sellItem(idx) {
            const item = inventory[idx];
            if (!item) return;
            const price = Math.round(item.value * 0.5);
            balance += price;
            inventory.splice(idx, 1);
            saveData();
            updateUI();
            renderInventory();
            showToast(`💰 Продано! +${price}💎`, 'success');
        }

        function sellAll() {
            if (!inventory.length) {
                showToast('❌ Инвентарь пуст!', 'error');
                return;
            }
            let total = 0;
            inventory.forEach(i => total += Math.round(i.value * 0.5));
            balance += total;
            inventory = [];
            saveData();
            updateUI();
            renderInventory();
            showToast(`💰 Продано всё! +${total}💎`, 'success');
        }

        // ==================== ПРОМОКОД ====================
        function applyPromoCode() {
            const code = prompt('Введите промокод:');
            if (!code) return;
            if (usedPromoCodes.includes(code)) {
                showToast('❌ Уже использован!', 'error');
                return;
            }
            if (code === '200') {
                balance += 100000;
                usedPromoCodes.push(code);
                saveData();
                updateUI();
                showToast('🎉 +100 000💎', 'success', 4000);
            } else {
                showToast('❌ Неверный промокод', 'error');
            }
        }

        // ==================== ТОСТ ====================
        function showToast(msg, type = 'info', duration = 3000) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => { t.classList.remove('show'); }, duration);
        }

        // ==================== КОПИРОВАТЬ ====================
        function copyRef() {
            const link = document.getElementById('ref-link').textContent;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(link).then(() => showToast('✅ Ссылка скопирована!', 'success'))
                    .catch(() => fallbackCopy(link));
            } else {
                fallbackCopy(link);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            showToast('✅ Ссылка скопирована!', 'success');
        }

        // ==================== СТАРТ ====================
        window.Telegram?.WebApp?.ready();
        loadData();
        updateRefLink();
        switchPage('page-menu');
    </script>
</body>
</html>
