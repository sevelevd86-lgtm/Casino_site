<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DROP</title>
    <style>
        /* ===== Стили только для режима ШАРИК ===== */
        .ball-container{display:flex;flex-direction:column;align-items:center;gap:10px;padding:4px 0;max-width:400px;margin:0 auto;width:100%}
        .ball-title{font-size:18px;font-weight:500;color:#f0b90b;letter-spacing:1px}
        
        .ball-game-area{position:relative;width:300px;height:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
        
        /* --- Вращающийся круг --- */
        .ball-circle-wrapper{position:relative;width:240px;height:240px;border-radius:50%;border:2px solid rgba(240,185,11,0.06);background:rgba(13,13,20,0.4)}
        .ball-rotation-layer{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:50%;transition:transform 0.05s linear; will-change:transform}
        .ball-circle{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden}
        .ball-hole{position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:30px;height:12px;background:transparent;border-bottom:2px solid rgba(240,185,11,0.04);z-index:2}
        
        /* --- Шарик --- */
        .ball{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%, #fff, #f0b90b);box-shadow:0 0 20px rgba(240,185,11,0.2);z-index:5;transition:none;will-change:transform;top:50%;left:50%;transform:translate(-50%,-50%)}
        .ball-wall-hit{color:#f0b90b;font-size:10px;position:absolute;z-index:3;pointer-events:none;animation:floatUp .8s ease forwards}
        @keyframes floatUp{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-30px)}}
        
        /* --- Зоны внизу --- */
        .ball-zones{display:flex;width:240px;height:40px;margin-top:10px;border-radius:0 0 20px 20px;overflow:hidden;border:1px solid rgba(255,255,255,0.02)}
        .ball-zones .zone{flex:1;display:flex;justify-content:center;align-items:center;font-size:20px;font-weight:700;transition:all .3s}
        .ball-zones .zone.green{background:rgba(46,204,113,0.04);color:#2ecc71;border-right:1px solid rgba(255,255,255,0.01)}
        .ball-zones .zone.red{background:rgba(231,76,60,0.04);color:#e74c3c;border-left:1px solid rgba(255,255,255,0.01)}
        .ball-zones .zone.active.green{background:rgba(46,204,113,0.15);box-shadow:inset 0 0 30px rgba(46,204,113,0.03)}
        .ball-zones .zone.active.red{background:rgba(231,76,60,0.15);box-shadow:inset 0 0 30px rgba(231,76,60,0.03)}
        
        /* --- Информация и кнопки --- */
        .ball-info{display:flex;justify-content:space-between;width:100%;max-width:260px;padding:4px 10px;background:rgba(13,13,20,0.2);border-radius:30px;border:1px solid rgba(255,255,255,0.02)}
        .ball-info .item{text-align:center;font-size:11px;color:#666}
        .ball-info .item span{display:block;font-size:15px;font-weight:600;color:#f0b90b}
        .ball-info .item .multiplier{font-size:20px;color:#f0b90b;font-weight:700}
        
        .ball-controls{display:flex;flex-direction:column;gap:6px;width:100%;max-width:260px}
        .ball-controls .row{display:flex;gap:6px}
        .ball-controls .btn{flex:1;padding:10px;border-radius:50px;border:none;font-weight:600;font-size:13px;cursor:pointer;transition:all .1s}
        .ball-controls .btn:active{transform:scale(0.96)}
        .ball-controls .btn.primary{background:#f0b90b;color:#0a0a0f}
        .ball-controls .btn.secondary{background:rgba(26,26,36,0.2);border:1px solid rgba(240,185,11,0.02);color:#f0b90b}
        .ball-controls .btn.danger{background:rgba(231,76,60,0.08);border:1px solid rgba(231,76,60,0.04);color:#e74c3c}
        .ball-controls .btn:disabled{opacity:0.3;pointer-events:none}
        .ball-bet-input{background:rgba(10,10,15,0.3);border:1px solid rgba(255,255,255,0.02);border-radius:50px;padding:10px 14px;color:#fff;font-size:15px;text-align:center;width:100%;outline:none}
        .ball-bet-input:focus{border-color:rgba(240,185,11,0.04)}
        
        @media(max-width:420px){.ball-game-area{width:260px;height:380px}.ball-circle-wrapper{width:200px;height:200px}.ball-zones{width:200px}.ball{width:12px;height:12px}}
    </style>
</head>
<body>

    <!-- ===== КОНТЕЙНЕР ШАРИКА ===== -->
    <div class="ball-container">
        <div class="ball-title">Шарик</div>
        <div class="ball-game-area">
            <div class="ball-circle-wrapper">
                <div class="ball-rotation-layer" id="ballRotationLayer">
                    <div class="ball-circle" id="ballCircle">
                        <div class="ball" id="ball" style="top:50%;left:50%;transform:translate(-50%,-50%)"></div>
                        <div class="ball-hole"></div>
                    </div>
                </div>
            </div>
            <div class="ball-zones" id="ballZones">
                <div class="zone green" id="zoneGreen">💸</div>
                <div class="zone red" id="zoneRed">💀</div>
            </div>
        </div>
        <div class="ball-info">
            <div class="item">Ставка<br><span id="ballBetDisplay">100⭐</span></div>
            <div class="item">Множитель<br><span class="multiplier" id="ballMultiplierDisplay">x1.0</span></div>
            <div class="item">Результат<br><span id="ballResultDisplay">—</span></div>
        </div>
        <div class="ball-controls">
            <input type="number" class="ball-bet-input" id="ballBetInput" value="100" min="100" placeholder="Ставка от 100⭐">
            <div class="row">
                <button class="btn primary" id="ballStartBtn" onclick="startBallGame()">🎯 Запустить</button>
                <button class="btn secondary" onclick="resetBallGame()">↺ Сброс</button>
            </div>
        </div>
    </div>

    <script>
        // ===== ПЕРЕМЕННЫЕ РЕЖИМА ШАРИК =====
        let ballInterval = null;
        let ballRotationInterval = null;
        let ballMultiplier = 1.0;
        let ballGameActive = false;
        let ballBet = 100;
        let ballHits = 0;
        let ballExitTimer = null;
        let ballRotationAngle = 0;
        let ballIsWaitingForExit = false;

        // ===== ФУНКЦИИ РЕЖИМА ШАРИК =====
        function resetBallGame() {
            if (ballInterval) { clearInterval(ballInterval); ballInterval = null; }
            if (ballRotationInterval) { clearInterval(ballRotationInterval); ballRotationInterval = null; }
            if (ballExitTimer) { clearTimeout(ballExitTimer); ballExitTimer = null; }
            ballGameActive = false;
            ballIsWaitingForExit = false;
            ballMultiplier = 1.0;
            ballHits = 0;
            ballRotationAngle = 0;
            const ball = document.getElementById('ball');
            if (ball) { ball.style.top = '50%'; ball.style.left = '50%'; ball.style.transform = 'translate(-50%,-50%)'; }
            const layer = document.getElementById('ballRotationLayer');
            if (layer) { layer.style.transform = `rotate(0deg)`; }
            const zones = document.querySelectorAll('.zone');
            zones.forEach(z => z.classList.remove('active'));
            document.getElementById('ballMultiplierDisplay').textContent = 'x1.0';
            document.getElementById('ballResultDisplay').textContent = '—';
            document.getElementById('ballStartBtn').disabled = false;
            document.getElementById('ballStartBtn').textContent = '🎯 Запустить';
        }

        function startBallGame() {
            if (ballGameActive) return;
            const betInput = document.getElementById('ballBetInput');
            let bet = parseInt(betInput.value) || 100;
            if (bet < 100) { alert('❌ Минимальная ставка 100⭐'); return; }
            if (bet > balance) { alert('❌ Недостаточно звёзд'); return; }
            ballBet = bet;
            balance -= ballBet;
            updateUI();
            saveData();
            document.getElementById('ballBetDisplay').textContent = ballBet + '⭐';
            document.getElementById('ballStartBtn').disabled = true;
            document.getElementById('ballStartBtn').textContent = '⏳ Игра...';
            ballGameActive = true;
            ballIsWaitingForExit = false;
            ballMultiplier = 1.0;
            ballHits = 0;
            document.getElementById('ballMultiplierDisplay').textContent = 'x1.0';
            document.getElementById('ballResultDisplay').textContent = '...';
            const zones = document.querySelectorAll('.zone');
            zones.forEach(z => z.classList.remove('active'));

            // --- Запуск вращения круга ---
            if (ballRotationInterval) clearInterval(ballRotationInterval);
            ballRotationInterval = setInterval(() => {
                ballRotationAngle += 1.5;
                document.getElementById('ballRotationLayer').style.transform = `rotate(${ballRotationAngle}deg)`;
            }, 30);

            // --- Позиция шарика внутри круга ---
            const circle = document.getElementById('ballCircle');
            const ball = document.getElementById('ball');
            const circleRect = circle.getBoundingClientRect();
            const centerX = circleRect.width / 2;
            const centerY = circleRect.height / 2;
            let x = centerX, y = centerY;
            let dx = (Math.random() - 0.5) * 5;
            let dy = (Math.random() - 0.5) * 5;
            const radius = 7;
            const circleRadius = circleRect.width / 2 - radius;

            if (ballInterval) clearInterval(ballInterval);
            let lastHitTime = 0;
            const startTime = Date.now();

            // --- Основной цикл движения шарика ---
            ballInterval = setInterval(() => {
                if (!ballGameActive) { clearInterval(ballInterval); return; }
                const elapsed = Date.now() - startTime;

                // Движение шарика
                x += dx;
                y += dy;

                let hitWall = false;
                // Отскоки от стен
                if (x - radius < 0 || x + radius > circleRect.width) {
                    dx *= -1;
                    x = Math.max(radius, Math.min(circleRect.width - radius, x));
                    hitWall = true;
                }
                if (y - radius < 0 || y + radius > circleRect.height) {
                    dy *= -1;
                    y = Math.max(radius, Math.min(circleRect.height - radius, y));
                    hitWall = true;
                }

                // Отскок от отверстия снизу
                const holeX = circleRect.width / 2;
                const holeY = circleRect.height;
                const distToHole = Math.sqrt((x - holeX) ** 2 + (y - holeY) ** 2);
                if (distToHole < 25 && y > circleRect.height - 30) {
                    dy *= -0.8;
                    y = circleRect.height - 30;
                    hitWall = true;
                }

                // Если шарик ударился об стену — увеличиваем множитель
                if (hitWall && Date.now() - lastHitTime > 150) {
                    ballHits++;
                    lastHitTime = Date.now();
                    ballMultiplier = 1 + ballHits * 0.1;
                    document.getElementById('ballMultiplierDisplay').textContent = 'x' + ballMultiplier.toFixed(1);

                    // Эффект удара
                    const hitEffect = document.createElement('div');
                    hitEffect.className = 'ball-wall-hit';
                    hitEffect.textContent = '+' + (ballMultiplier - 1).toFixed(1) + 'x';
                    hitEffect.style.left = x + 'px';
                    hitEffect.style.top = y - 10 + 'px';
                    document.getElementById('ballCircle').appendChild(hitEffect);
                    setTimeout(() => hitEffect.remove(), 800);
                }

                ball.style.top = y + 'px';
                ball.style.left = x + 'px';

                // --- Проверка вылета через отверстие (только если прошло достаточно времени) ---
                const distFromCenter = Math.sqrt((x - centerX) ** 2 + (y - centerY) ** 2);
                if (distFromCenter > circleRadius - 8 && elapsed > 2000 && !ballIsWaitingForExit) {
                    ballIsWaitingForExit = true;
                    ballExitTimer = setTimeout(() => {
                        if (!ballGameActive) return;
                        ballGameActive = false;
                        clearInterval(ballInterval);
                        clearInterval(ballRotationInterval);

                        // Определяем результат (чем выше множитель, тем выше шанс на красную зону)
                        const rand = Math.random();
                        let redChance = 0.3 + (ballMultiplier - 1) * 0.08;
                        if (redChance > 0.85) redChance = 0.85;
                        const isWin = rand > redChance;
                        const greenZone = document.getElementById('zoneGreen');
                        const redZone = document.getElementById('zoneRed');

                        if (isWin) {
                            const winAmount = Math.round(ballBet * ballMultiplier);
                            balance += winAmount;
                            addHistory(`Шарик: выигрыш x${ballMultiplier.toFixed(1)}`, winAmount);
                            greenZone.classList.add('active');
                            document.getElementById('ballResultDisplay').textContent = `💸 +${winAmount}⭐`;
                            showToast(`💸 Выигрыш! +${winAmount}⭐ (x${ballMultiplier.toFixed(1)})`, 'success', 3000);
                        } else {
                            addHistory(`Шарик: проигрыш -${ballBet}⭐`, -ballBet);
                            redZone.classList.add('active');
                            document.getElementById('ballResultDisplay').textContent = `💀 -${ballBet}⭐`;
                            showToast(`💀 Проигрыш! -${ballBet}⭐`, 'error', 3000);
                        }
                        updateUI();
                        saveData();
                        document.getElementById('ballStartBtn').disabled = false;
                        document.getElementById('ballStartBtn').textContent = '🎯 Запустить';
                        ballExitTimer = null;
                        ballIsWaitingForExit = false;
                    }, 300 + Math.random() * 800);
                }
            }, 16);
        }
    </script>

    <!-- ===== ОСТАЛЬНЫЕ СКРИПТЫ (ОСНОВНЫЕ ФУНКЦИИ) ===== -->
    <script>
        // Здесь должны быть твои основные функции: balance, updateUI, saveData, loadData, showToast, addHistory и т.д.
        // Они уже есть в твоем проекте, я их не дублирую.
        // Просто вставь этот код в нужное место.
    </script>

</body>
</html>
