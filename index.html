<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Escape</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #111315;

    font-family: Arial, sans-serif;

    user-select: none;
}

canvas {
    position: fixed;
    left: 0;
    top: 0;

    width: 100vw;
    height: 100vh;

    display: block;
}


/* =====================================================
   ВЕРХНЯЯ ПАНЕЛЬ
===================================================== */

.top-ui {
    position: fixed;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    gap: 55px;

    z-index: 10;

    text-align: center;
}

.stat {
    min-width: 90px;
}

.stat-label {
    color: #737a81;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.stat-value {
    margin-top: 4px;

    color: white;

    font-size: 24px;

    font-weight: 800;
}

#multiplier {
    color: #42df78;
}


/* =====================================================
   БАЛАНС
===================================================== */

.balance-value {
    color: #ffd84d !important;
}


/* =====================================================
   НИЖНИЕ ЗОНЫ
===================================================== */

.bottom-zones {
    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 90px;

    display: flex;

    z-index: 5;

    overflow: hidden;

    background:
        linear-gradient(
            to top,
            rgba(10,12,14,0.98),
            rgba(10,12,14,0.15)
        );
}


/* =====================================================
   GREEN
===================================================== */

.green-zone {
    position: relative;

    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 21px;

    font-weight: 900;

    transition: width .25s ease;

    overflow: hidden;

    background:
        linear-gradient(
            to top,
            #2bdd72 0%,
            #26c968 35%,
            rgba(39,201,104,0.35) 70%,
            rgba(39,201,104,0) 100%
        );

    box-shadow:
        inset 0 -10px 30px rgba(35,255,120,0.35),
        0 -4px 25px rgba(35,220,110,0.18);
}

.green-zone::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 2px;

    background:
        rgba(87,255,155,0.75);

    box-shadow:
        0 0 12px rgba(50,255,130,0.8),
        0 0 28px rgba(50,255,130,0.45);
}

.green-zone::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: -35px;

    width: 100%;
    height: 70px;

    background:
        rgba(38,220,110,0.38);

    filter: blur(25px);

    pointer-events: none;
}


/* =====================================================
   RED
===================================================== */

.red-zone {
    position: relative;

    height: 100%;

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 21px;

    font-weight: 900;

    transition: width .25s ease;

    overflow: hidden;

    background:
        linear-gradient(
            to top,
            #e84550 0%,
            #d93c47 35%,
            rgba(217,60,71,0.35) 70%,
            rgba(217,60,71,0) 100%
        );

    box-shadow:
        inset 0 -10px 30px rgba(255,55,65,0.35),
        0 -4px 25px rgba(255,55,65,0.18);
}

.red-zone::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 2px;

    background:
        rgba(255,105,112,0.75);

    box-shadow:
        0 0 12px rgba(255,65,75,0.8),
        0 0 28px rgba(255,65,75,0.45);
}

.red-zone::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: -35px;

    width: 100%;
    height: 70px;

    background:
        rgba(240,55,65,0.38);

    filter: blur(25px);

    pointer-events: none;
}


/* =====================================================
   МЕНЮ
===================================================== */

.start-menu {
    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    width: 330px;

    padding: 28px;

    background: rgba(20,23,26,.97);

    border: 1px solid #343a40;

    border-radius: 20px;

    text-align: center;

    z-index: 50;

    box-shadow:
        0 20px 70px rgba(0,0,0,.5);
}

.start-title {
    color: white;

    font-size: 30px;

    font-weight: 900;

    margin-bottom: 22px;
}

.balance-box {
    padding: 13px;

    border-radius: 10px;

    background: #171a1e;

    margin-bottom: 18px;
}

.balance-label {
    color: #737a81;

    font-size: 11px;

    text-transform: uppercase;
}

.balance {
    margin-top: 5px;

    color: #ffd84d;

    font-size: 25px;

    font-weight: 900;
}


/* =====================================================
   СТАВКА
===================================================== */

.bet-label {
    display: block;

    color: #8b9299;

    font-size: 12px;

    text-align: left;

    margin-bottom: 6px;
}

.bet-input {
    width: 100%;

    padding: 13px;

    border: 1px solid #3a4148;

    outline: none;

    border-radius: 10px;

    background: #111315;

    color: white;

    font-size: 17px;

    font-weight: 700;

    text-align: center;
}

.bet-input:focus {
    border-color: #1678e8;
}

.bet-error {
    min-height: 18px;

    margin-top: 5px;

    color: #ef4752;

    font-size: 12px;
}


/* =====================================================
   СЛОЖНОСТЬ
===================================================== */

.menu-difficulty {
    margin-top: 7px;

    display: flex;

    gap: 6px;
}

.menu-difficulty button {
    flex: 1;

    border: none;

    outline: none;

    padding: 9px 5px;

    border-radius: 8px;

    background: #282d32;

    color: #cfd3d7;

    font-size: 12px;

    font-weight: 700;

    cursor: pointer;
}

.menu-difficulty button.active {
    background: #1678e8;

    color: white;
}


/* =====================================================
   PLAY
===================================================== */

.play-button {
    width: 100%;

    margin-top: 17px;

    padding: 13px;

    border: none;

    border-radius: 10px;

    background: #1678e8;

    color: white;

    font-size: 15px;

    font-weight: 900;

    cursor: pointer;
}

.play-button:hover {
    background: #2687f5;
}

.play-button:active {
    transform: scale(.98);
}


/* =====================================================
   РЕЗУЛЬТАТ
===================================================== */

.result {
    position: fixed;

    top: 50%;
    left: 50%;

    width: 310px;

    padding: 30px;

    transform:
        translate(-50%, -50%)
        scale(.85);

    background: rgba(20,23,26,.98);

    border: 1px solid #343a40;

    border-radius: 20px;

    text-align: center;

    z-index: 100;

    opacity: 0;

    pointer-events: none;

    transition: .25s;
}

.result.show {
    opacity: 1;

    pointer-events: auto;

    transform:
        translate(-50%, -50%)
        scale(1);
}

.result-title {
    font-size: 44px;

    font-weight: 900;
}

.result-title.win {
    color: #3ee57b;
}

.result-title.lose {
    color: #ef4752;
}

.result-info {
    margin-top: 10px;

    color: #858b91;

    font-size: 14px;

    line-height: 1.7;
}

.result-money {
    margin-top: 12px;

    font-size: 22px;

    font-weight: 900;
}

.result-money.win {
    color: #3ee57b;
}

.result-money.lose {
    color: #ef4752;
}

.result button {
    width: 100%;

    margin-top: 20px;

    padding: 12px;

    border: none;

    border-radius: 9px;

    background: #1678e8;

    color: white;

    font-size: 14px;

    font-weight: 800;

    cursor: pointer;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

    .top-ui {
        gap: 25px;
    }

    .stat-value {
        font-size: 19px;
    }

    .bottom-zones {
        height: 78px;
    }

    .green-zone,
    .red-zone {
        font-size: 17px;
    }

    .start-menu {
        width: calc(100vw - 40px);
        max-width: 330px;
    }
}

</style>
</head>

<body>


<canvas id="gameCanvas"></canvas>


<!-- =====================================================
     ВЕРХНЯЯ ПАНЕЛЬ
===================================================== -->

<div class="top-ui">

    <div class="stat">

        <div class="stat-label">
            Баланс
        </div>

        <div
            class="stat-value balance-value"
            id="balanceValue">

            1000.00

        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            Отскоки
        </div>

        <div
            class="stat-value"
            id="bounceValue">

            0

        </div>

    </div>


    <div class="stat">

        <div class="stat-label">
            Множитель
        </div>

        <div
            class="stat-value"
            id="multiplier">

            1.00x

        </div>

    </div>

</div>


<!-- =====================================================
     ЗОНЫ
===================================================== -->

<div class="bottom-zones">

    <div
        class="green-zone"
        id="greenZone">

        WIN

    </div>

    <div
        class="red-zone"
        id="redZone">

        LOSE

    </div>

</div>


<!-- =====================================================
     СТАРТОВОЕ МЕНЮ
===================================================== -->

<div
    class="start-menu"
    id="startMenu">

    <div class="start-title">
        ESCAPE
    </div>


    <div class="balance-box">

        <div class="balance-label">
            Ваш баланс
        </div>

        <div
            class="balance"
            id="menuBalance">

            1000.00

        </div>

    </div>


    <label
        class="bet-label"
        for="betInput">

        Ставка

    </label>


    <input
        id="betInput"
        class="bet-input"
        type="number"
        min="0.01"
        step="0.01"
        placeholder="Введите ставку"
    >


    <div
        class="bet-error"
        id="betError">
    </div>


    <div class="bet-label">
        Сложность
    </div>


    <div class="menu-difficulty">

        <button
            class="difficulty-button active"
            data-mode="easy">

            Легко

        </button>


        <button
            class="difficulty-button"
            data-mode="medium">

            Средне

        </button>


        <button
            class="difficulty-button"
            data-mode="hard">

            Сложно

        </button>

    </div>


    <button
        class="play-button"
        id="startButton">

        ИГРАТЬ

    </button>

</div>


<!-- =====================================================
     РЕЗУЛЬТАТ
===================================================== -->

<div
    class="result"
    id="resultWindow">

    <div
        id="resultTitle"
        class="result-title">

        WIN

    </div>


    <div
        id="resultInfo"
        class="result-info">

    </div>


    <div
        id="resultMoney"
        class="result-money">

    </div>


    <button id="closeResultButton">

        ЗАКРЫТЬ

    </button>

</div>


<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");


let width = 0;
let height = 0;


/* =====================================================
   UI
===================================================== */

const balanceValue =
    document.getElementById(
        "balanceValue"
    );

const menuBalance =
    document.getElementById(
        "menuBalance"
    );

const bounceValue =
    document.getElementById(
        "bounceValue"
    );

const multiplierValue =
    document.getElementById(
        "multiplier"
    );

const startMenu =
    document.getElementById(
        "startMenu"
    );

const startButton =
    document.getElementById(
        "startButton"
    );

const betInput =
    document.getElementById(
        "betInput"
    );

const betError =
    document.getElementById(
        "betError"
    );

const resultWindow =
    document.getElementById(
        "resultWindow"
    );

const resultTitle =
    document.getElementById(
        "resultTitle"
    );

const resultInfo =
    document.getElementById(
        "resultInfo"
    );

const resultMoney =
    document.getElementById(
        "resultMoney"
    );

const closeResultButton =
    document.getElementById(
        "closeResultButton"
    );

const greenZone =
    document.getElementById(
        "greenZone"
    );

const redZone =
    document.getElementById(
        "redZone"
    );


/* =====================================================
   БАЛАНС
===================================================== */

let balance = 1000;


/* =====================================================
   ТЕКУЩАЯ СТАВКА
===================================================== */

let currentBet = 0;


/* =====================================================
   КРУГ
===================================================== */

const circle = {

    x: 0,

    y: 0,

    radius: 205,

    wallWidth: 10

};


/* =====================================================
   ШАР
===================================================== */

const ball = {

    x: 0,

    y: 0,

    vx: 0,

    vy: 0,

    radius: 13

};


/* =====================================================
   ФИЗИКА
===================================================== */

const GRAVITY = 0.20;


/*
    Базовая сила прыжка.

    После каждого отскока
    она немного рандомизируется.
*/

const BASE_JUMP = 5.5;


/*
    Базовая скорость.
*/

const BASE_SPEED = 2.2;


/*
    Боковая скорость.
*/

const SIDE_SPEED = 1.6;


/*
    Ограничения скорости.
*/

const MAX_SPEED = 6.0;

const MAX_HORIZONTAL_SPEED = 3.4;


/*
    Вращение отверстия.
*/

const HOLE_SPEED = 0.018;


/*
    Защита от проникновения
    в стену.
*/

const COLLISION_EPSILON = 1.5;


/*
    Боковые стены.

    Они не дают шарику
    улететь далеко.
*/

const SIDE_WALL = 7;


/*
    Высота зон.
*/

const ZONE_HEIGHT = 90;


/* =====================================================
   СЛОЖНОСТИ
===================================================== */

const difficulties = {

    easy: {

        greenPercent: 70,

        redPercent: 30,

        /*
            Обычная дырка.
        */

        holeSize: 50,

        /*
            Легко:
            +0.05
        */

        multiplierStep: 0.05

    },


    medium: {

        greenPercent: 50,

        redPercent: 50,

        /*
            Обычная дырка.
        */

        holeSize: 50,

        /*
            Средне:
            +0.15
        */

        multiplierStep: 0.15

    },


    hard: {

        greenPercent: 25,

        redPercent: 75,

        /*
            Дырка на 30% больше,
            чем обычная.
        */

        holeSize: 50 * 1.30,

        /*
            Сложный уровень.
        */

        multiplierStep: 0.25

    }

};


let difficulty = "easy";


/* =====================================================
   СОСТОЯНИЕ
===================================================== */

let gameRunning = false;

let ballEscaped = false;

let gameFinished = false;


/*
    Угол вращения дырки.
*/

let holeAngle = 0;


/*
    Статистика.
*/

let bounceCount = 0;

let multiplier = 1;


/* =====================================================
   RESIZE
===================================================== */

function resizeCanvas() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );


    circle.radius =
        Math.min(
            205,
            width * 0.33,
            height * 0.30
        );


    circle.x =
        width / 2;


    circle.y =
        height * 0.39;


    if (!gameRunning) {

        ball.x =
            circle.x;

        ball.y =
            circle.y -
            circle.radius * 0.35;
    }
}


window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   ЗОНЫ
===================================================== */

function updateZones() {

    const settings =
        difficulties[difficulty];


    greenZone.style.width =
        settings.greenPercent + "%";


    redZone.style.width =
        settings.redPercent + "%";
}


/* =====================================================
   УГЛЫ
===================================================== */

function normalizeAngle(angle) {

    angle %= Math.PI * 2;


    if (angle < 0) {

        angle +=
            Math.PI * 2;
    }


    return angle;
}


function angleDifference(a, b) {

    let difference =
        Math.abs(
            normalizeAngle(a) -
            normalizeAngle(b)
        );


    if (
        difference >
        Math.PI
    ) {

        difference =
            Math.PI * 2 -
            difference;
    }


    return difference;
}


/* =====================================================
   ОТВЕРСТИЕ
===================================================== */

function isHole(angle) {

    const holeDegrees =
        difficulties[difficulty]
            .holeSize;


    const holeRadians =
        holeDegrees *
        Math.PI /
        180;


    return (
        angleDifference(
            angle,
            holeAngle
        )
        <=
        holeRadians / 2
    );
}


/* =====================================================
   ОГРАНИЧЕНИЕ СКОРОСТИ
===================================================== */

function limitSpeed() {

    if (
        ball.vx >
        MAX_HORIZONTAL_SPEED
    ) {

        ball.vx =
            MAX_HORIZONTAL_SPEED;
    }


    if (
        ball.vx <
        -MAX_HORIZONTAL_SPEED
    ) {

        ball.vx =
            -MAX_HORIZONTAL_SPEED;
    }


    const speed =
        Math.sqrt(
            ball.vx * ball.vx +
            ball.vy * ball.vy
        );


    if (
        speed >
        MAX_SPEED
    ) {

        const scale =
            MAX_SPEED /
            speed;


        ball.vx *=
            scale;


        ball.vy *=
            scale;
    }
}


/* =====================================================
   UI
===================================================== */

function updateUI() {

    balanceValue.textContent =
        balance.toFixed(2);


    menuBalance.textContent =
        balance.toFixed(2);


    bounceValue.textContent =
        bounceCount;


    multiplierValue.textContent =
        multiplier.toFixed(2) +
        "x";
}


/* =====================================================
   СЛУЧАЙНАЯ СКОРОСТЬ
===================================================== */

function randomRange(min, max) {

    return (
        min +
        Math.random() *
        (max - min)
    );
}


/* =====================================================
   НАЧАЛЬНОЕ НАПРАВЛЕНИЕ
===================================================== */

/*
    Только влево или вправо.

    Ровно вниз больше никогда
    не запускаем.
*/

function chooseStartDirection() {

    const direction =
        Math.random() < 0.5
            ? -1
            : 1;


    const horizontal =
        randomRange(
            0.8,
            1.8
        );


    ball.vx =
        direction *
        horizontal;


    ball.vy =
        randomRange(
            1.8,
            2.5
        );
}


/* =====================================================
   НАЧАЛО ИГРЫ
===================================================== */

function startGame() {

    /*
        Получаем ставку.
    */

    let bet =
        Number(
            betInput.value
        );


    /*
        Защита от NaN,
        отрицательных чисел
        и нулевой ставки.
    */

    if (
        !Number.isFinite(bet) ||
        bet <= 0
    ) {

        betError.textContent =
            "Введите корректную ставку.";

        return;
    }


    /*
        Защита от ставки
        больше баланса.
    */

    if (
        bet >
        balance
    ) {

        betError.textContent =
            "Ставка не может быть больше баланса.";

        return;
    }


    /*
        Округляем ставку
        до двух знаков.
    */

    bet =
        Math.round(
            bet * 100
        ) / 100;


    if (bet <= 0) {

        betError.textContent =
            "Ставка должна быть больше 0.";

        return;
    }


    if (bet > balance) {

        betError.textContent =
            "Недостаточно средств.";

        return;
    }


    /*
        Сохраняем ставку.
    */

    currentBet =
        bet;


    /*
        Ставка списывается
        сразу при старте.
    */

    balance -=
        currentBet;


    balance =
        Math.round(
            balance * 100
        ) / 100;


    betError.textContent =
        "";


    gameRunning = true;

    ballEscaped = false;

    gameFinished = false;


    bounceCount = 0;

    multiplier = 1;


    /*
        Начальная позиция.
    */

    ball.x =
        circle.x;


    ball.y =
        circle.y -
        circle.radius * 0.35;


    /*
        Каждый раунд
        получает новое
        направление.
    */

    chooseStartDirection();


    updateUI();


    /*
        Прячем меню.
    */

    startMenu.style.display =
        "none";


    resultWindow.classList.remove(
        "show"
    );
}


/* =====================================================
   ОТСКОК
===================================================== */

function registerBounce() {

    bounceCount++;


    multiplier =
        1 +
        bounceCount *
        difficulties[difficulty]
            .multiplierStep;


    /*
        Округляем,
        чтобы не было 1.15000001.
    */

    multiplier =
        Math.round(
            multiplier * 100
        ) / 100;


    updateUI();
}


/* =====================================================
   ВЫХОД ЧЕРЕЗ ДЫРКУ
===================================================== */

function escapeThroughHole(nx, ny) {

    ball.x =
        circle.x +
        nx *
        (
            circle.radius +
            ball.radius +
            4
        );


    ball.y =
        circle.y +
        ny *
        (
            circle.radius +
            ball.radius +
            4
        );


    /*
        После выхода
        шар продолжает
        падать.

        Но направление
        немного меняется.
    */

    const speed =
        randomRange(
            3.6,
            4.8
        );


    /*
        Сохраняем горизонтальную
        составляющую, чтобы шар
        не летел строго вертикально.
    */

    let vx =
        ball.vx;


    if (
        Math.abs(vx) <
        0.7
    ) {

        vx =
            nx *
            randomRange(
                1.2,
                2.2
            );
    }


    ball.vx =
        Math.max(
            -MAX_HORIZONTAL_SPEED,
            Math.min(
                MAX_HORIZONTAL_SPEED,
                vx
            )
        );


    /*
        Главное направление
        вниз.
    */

    ball.vy =
        Math.max(
            2.5,
            speed
        );


    ballEscaped = true;
}


/* =====================================================
   ОТСКОК ОТ КРУГА
===================================================== */

function bounceFromWall(nx, ny) {

    const safeRadius =
        circle.radius -
        circle.wallWidth / 2 -
        ball.radius -
        COLLISION_EPSILON;


    ball.x =
        circle.x +
        nx *
        safeRadius;


    ball.y =
        circle.y +
        ny *
        safeRadius;


    /*
        Скалярное произведение.
    */

    const velocityNormal =
        ball.vx * nx +
        ball.vy * ny;


    /*
        Отражаем только если
        шар действительно движется
        в стену.
    */

    if (
        velocityNormal > 0
    ) {

        ball.vx -=
            2 *
            velocityNormal *
            nx;


        ball.vy -=
            2 *
            velocityNormal *
            ny;
    }


    /*
        ==============================================
        РАЗНЫЙ ПРЫЖОК ПОСЛЕ КАЖДОГО ОТСКОКА
        ==============================================
    */

    const jump =
        randomRange(
            BASE_JUMP * 0.88,
            BASE_JUMP * 1.12
        );


    /*
        Если ударился о нижнюю
        часть круга — прыгаем вверх.
    */

    if (
        ny > 0.15
    ) {

        ball.vy =
            -jump;
    }


    /*
        Если ударился сверху —
        направляем вниз.
    */

    else if (
        ny < -0.15
    ) {

        ball.vy =
            randomRange(
                2.7,
                4.2
            );
    }


    /*
        При боковом столкновении
        слегка меняем вертикальную
        скорость.

        Это делает траекторию
        менее предсказуемой.
    */

    else {

        if (
            ball.vy < 0
        ) {

            ball.vy =
                -randomRange(
                    3.8,
                    5.3
                );

        }

        else {

            ball.vy =
                randomRange(
                    3.5,
                    5.0
                );
        }
    }


    /*
        После каждого отскока
        немного меняем X.

        Благодаря этому шарик
        не повторяет одну и ту же
        траекторию.
    */

    const horizontalChange =
        randomRange(
            -0.75,
            0.75
        );


    ball.vx +=
        horizontalChange;


    /*
        Минимальная X скорость.

        Шар не должен постоянно
        прыгать строго вертикально.
    */

    if (
        Math.abs(ball.vx) <
        0.65
    ) {

        ball.vx =
            ball.vx < 0
                ? -0.65
                : 0.65;
    }


    /*
        Ограничиваем скорость.
    */

    ball.vx =
        Math.max(
            -MAX_HORIZONTAL_SPEED,
            Math.min(
                MAX_HORIZONTAL_SPEED,
                ball.vx
            )
        );


    limitSpeed();


    registerBounce();
}


/* =====================================================
   ВЫПЛАТА
===================================================== */

function finishGame(isWin) {

    if (gameFinished)
        return;


    gameFinished = true;

    gameRunning = false;


    /*
        WIN
    */

    if (isWin) {

        /*
            Общая выплата:

            ставка * множитель
        */

        const payout =
            currentBet *
            multiplier;


        balance +=
            payout;


        balance =
            Math.round(
                balance * 100
            ) / 100;


        const profit =
            payout -
            currentBet;


        resultTitle.textContent =
            "WIN";


        resultTitle.className =
            "result-title win";


        resultMoney.textContent =
            "+" +
            profit.toFixed(2);


        resultMoney.className =
            "result-money win";


        resultInfo.innerHTML =
            "Ставка: " +
            currentBet.toFixed(2) +
            "<br>" +
            "Множитель: " +
            multiplier.toFixed(2) +
            "x<br>" +
            "Выплата: " +
            payout.toFixed(2);

    }


    /*
        LOSE
    */

    else {

        resultTitle.textContent =
            "LOSE";


        resultTitle.className =
            "result-title lose";


        resultMoney.textContent =
            "-" +
            currentBet.toFixed(2);


        resultMoney.className =
            "result-money lose";


        resultInfo.innerHTML =
            "Ставка: " +
            currentBet.toFixed(2) +
            "<br>" +
            "Множитель: " +
            multiplier.toFixed(2) +
            "x<br>" +
            "Ставка проиграна.";
    }


    updateUI();


    resultWindow.classList.add(
        "show"
    );
}


/* =====================================================
   ФИЗИКА
===================================================== */

function updatePhysics() {

    /*
        Отверстие вращается ВСЕГДА.

        Даже когда игра ещё
        не началась.
    */

    holeAngle +=
        HOLE_SPEED;


    holeAngle =
        normalizeAngle(
            holeAngle
        );


    if (!gameRunning)
        return;


    /* =================================================
       ШАР УЖЕ ВЫШЕЛ
    ================================================= */

    if (ballEscaped) {

        ball.vy +=
            GRAVITY;


        ball.x +=
            ball.vx;


        ball.y +=
            ball.vy;


        limitSpeed();


        /*
            Левая боковая стена.
        */

        if (
            ball.x -
            ball.radius <
            SIDE_WALL
        ) {

            ball.x =
                SIDE_WALL +
                ball.radius;


            ball.vx =
                Math.abs(
                    ball.vx
                );
        }


        /*
            Правая боковая стена.
        */

        if (
            ball.x +
            ball.radius >
            width -
            SIDE_WALL
        ) {

            ball.x =
                width -
                SIDE_WALL -
                ball.radius;


            ball.vx =
                -Math.abs(
                    ball.vx
                );
        }


        /*
            Верхняя защита.

            Если каким-то образом
            шар пытается вернуться
            наверх, не даём ему
            зависнуть.
        */

        if (
            ball.y <
            circle.y -
            circle.radius
        ) {

            ball.vy =
                Math.abs(
                    ball.vy
                ) + 0.5;
        }


        /*
            Верх зоны.
        */

        const zonesTop =
            height -
            ZONE_HEIGHT;


        if (
            ball.y +
            ball.radius >=
            zonesTop
        ) {

            /*
                Ширина WIN.
            */

            const greenWidth =
                width *
                difficulties[difficulty]
                    .greenPercent /
                100;


            /*
                ЛЕВАЯ часть = WIN
                ПРАВАЯ часть = LOSE
            */

            if (
                ball.x <=
                greenWidth
            ) {

                finishGame(true);

            }

            else {

                finishGame(false);
            }


            return;
        }


        return;
    }


    /* =================================================
       ГРАВИТАЦИЯ
    ================================================= */

    ball.vy +=
        GRAVITY;


    /* =================================================
       ДВИЖЕНИЕ
    ================================================= */

    ball.x +=
        ball.vx;


    ball.y +=
        ball.vy;


    limitSpeed();


    /* =================================================
       РАССТОЯНИЕ ОТ ЦЕНТРА
    ================================================= */

    const dx =
        ball.x -
        circle.x;


    const dy =
        ball.y -
        circle.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const collisionRadius =
        circle.radius -
        circle.wallWidth / 2 -
        ball.radius;


    /* =================================================
       ДОСТИГ СТЕНЫ
    ================================================= */

    if (
        distance >=
        collisionRadius
    ) {

        if (
            distance <
            0.0001
        ) {

            return;
        }


        const nx =
            dx / distance;


        const ny =
            dy / distance;


        const ballAngle =
            Math.atan2(
                dy,
                dx
            );


        /*
            Проверяем отверстие.
        */

        if (
            isHole(ballAngle)
        ) {

            const outwardVelocity =
                ball.vx * nx +
                ball.vy * ny;


            /*
                В отверстие можно
                пройти только если
                шар движется наружу.
            */

            if (
                outwardVelocity >= 0
            ) {

                escapeThroughHole(
                    nx,
                    ny
                );

                return;
            }
        }


        /*
            Если это не отверстие —
            твёрдая стена.
        */

        bounceFromWall(
            nx,
            ny
        );
    }
}


/* =====================================================
   РИСОВАНИЕ
===================================================== */

function draw() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* =================================================
       БОКОВЫЕ СТЕНЫ
    ================================================= */

    ctx.fillStyle =
        "#252a2f";


    ctx.fillRect(
        0,
        0,
        SIDE_WALL,
        height
    );


    ctx.fillRect(
        width -
        SIDE_WALL,
        0,
        SIDE_WALL,
        height
    );


    /* =================================================
       КРУГ
    ================================================= */

    const radius =
        circle.radius;


    const holeRadians =
        difficulties[difficulty]
            .holeSize *
        Math.PI /
        180;


    const holeStart =
        holeAngle -
        holeRadians / 2;


    const holeEnd =
        holeAngle +
        holeRadians / 2;


    /*
        Синяя часть круга.
    */

    ctx.save();


    ctx.beginPath();


    ctx.arc(
        circle.x,
        circle.y,
        radius,
        holeEnd,
        holeStart +
        Math.PI * 2
    );


    ctx.strokeStyle =
        "#1478e8";


    ctx.lineWidth =
        circle.wallWidth;


    ctx.lineCap =
        "round";


    ctx.shadowBlur =
        20;


    ctx.shadowColor =
        "rgba(20,120,235,.8)";


    ctx.stroke();


    ctx.restore();


    /* =================================================
       КРАЯ ОТВЕРСТИЯ
    ================================================= */

    ctx.save();


    ctx.strokeStyle =
        "#1478e8";


    ctx.lineWidth =
        5;


    ctx.lineCap =
        "round";


    function drawHoleEnd(angle) {

        const inner =
            radius - 6;


        const outer =
            radius + 3;


        const x1 =
            circle.x +
            Math.cos(angle) *
            inner;


        const y1 =
            circle.y +
            Math.sin(angle) *
            inner;


        const x2 =
            circle.x +
            Math.cos(angle) *
            outer;


        const y2 =
            circle.y +
            Math.sin(angle) *
            outer;


        ctx.beginPath();


        ctx.moveTo(
            x1,
            y1
        );


        ctx.lineTo(
            x2,
            y2
        );


        ctx.stroke();
    }


    drawHoleEnd(
        holeStart
    );


    drawHoleEnd(
        holeEnd
    );


    ctx.restore();


    /* =================================================
       СВЕЧЕНИЕ ОТВЕРСТИЯ
    ================================================= */

    ctx.save();


    ctx.beginPath();


    ctx.arc(
        circle.x,
        circle.y,
        radius + 3,
        holeStart,
        holeEnd
    );


    ctx.strokeStyle =
        "rgba(255,255,255,.15)";


    ctx.lineWidth =
        4;


    ctx.stroke();


    ctx.restore();


    /* =================================================
       ШАР
    ================================================= */

    ctx.save();


    ctx.beginPath();


    ctx.arc(
        ball.x,
        ball.y,
        ball.radius,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#ffffff";


    ctx.shadowBlur =
        16;


    ctx.shadowColor =
        "rgba(255,255,255,.95)";


    ctx.fill();


    ctx.restore();


    /*
        Блик.
    */

    ctx.beginPath();


    ctx.arc(
        ball.x - 4,
        ball.y - 4,
        3,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "rgba(255,255,255,.9)";


    ctx.fill();
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

    updatePhysics();

    draw();

    requestAnimationFrame(
        gameLoop
    );
}


/* =====================================================
   КНОПКА СТАРТА
===================================================== */

startButton.addEventListener(
    "click",
    startGame
);


/* =====================================================
   ЗАКРЫТЬ РЕЗУЛЬТАТ
===================================================== */

closeResultButton.addEventListener(
    "click",
    () => {

        resultWindow.classList.remove(
            "show"
        );


        /*
            Возвращаемся
            именно в стартовое меню.
        */

        startMenu.style.display =
            "block";


        currentBet = 0;


        betInput.value =
            "";


        betError.textContent =
            "";


        /*
            Ставим шарик обратно
            в исходную позицию.
        */

        ball.x =
            circle.x;


        ball.y =
            circle.y -
            circle.radius * 0.35;


        ball.vx = 0;

        ball.vy = 0;


        updateUI();
    }
);


/* =====================================================
   ВЫБОР СЛОЖНОСТИ
===================================================== */

document
    .querySelectorAll(
        ".difficulty-button"
    )
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    /*
                        ВО ВРЕМЯ ИГРЫ
                        сложность менять нельзя.
                    */

                    if (
                        gameRunning
                    ) {

                        return;
                    }


                    difficulty =
                        button.dataset.mode;


                    document
                        .querySelectorAll(
                            ".difficulty-button"
                        )
                        .forEach(
                            other => {

                                other.classList.remove(
                                    "active"
                                );
                            }
                        );


                    button.classList.add(
                        "active"
                    );


                    updateZones();
                }
            );
        }
    );


/* =====================================================
   ЗАПУСК
===================================================== */

resizeCanvas();

updateZones();

updateUI();


ball.x =
    circle.x;

ball.y =
    circle.y -
    circle.radius * 0.35;


/*
    Круг вращается
    уже до начала игры.
*/

gameLoop();

</script>
