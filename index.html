<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casino</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;font-family:'Segoe UI',sans-serif}
        body{background:#0a0a0f;color:#fff;min-height:100vh;display:flex;flex-direction:column;padding-bottom:70px}
        
        .top-bar{background:#0d0d14;padding:10px 16px;border-bottom:1px solid #1a1a24;display:flex;justify-content:space-between;align-items:center}
        .top-bar .logo{font-weight:700;color:#f0b90b;font-size:16px}
        .top-bar .balance{color:#f0b90b;font-weight:600;font-size:16px}
        
        .page{display:none;flex-direction:column;flex:1;padding:20px}
        .page.active{display:flex}
        .page-title{font-size:22px;font-weight:700;margin-bottom:16px;color:#f0b90b}
        
        .menu-hero{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
        .menu-hero h1{font-size:48px;font-weight:900;color:#f0b90b;text-shadow:0 0 40px rgba(240,185,11,0.4)}
        .menu-hero .subtitle{color:#aaa;font-size:16px;margin-top:8px}
        .menu-hero .game-btn{background:#f0b90b;color:#0a0a0f;padding:16px 40px;border-radius:12px;font-size:18px;font-weight:700;border:none;cursor:pointer;margin-top:20px;width:80%;max-width:300px}
        .menu-hero .game-btn:active{background:#d4a40a}
        .menu-hero .game-btn.secondary{background:#1a1a24;border:1px solid #f0b90b;color:#f0b90b}
        .menu-hero .game-btn.secondary:active{background:#2a2a3a}
        
        .empty-inventory{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#666;text-align:center}
        .empty-inventory .icon{font-size:64px;margin-bottom:16px;opacity:0.5}
        .empty-inventory h2{color:#888;font-weight:400}
        .inventory-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
        .inv-item{background:#1a1a24;border:1px solid #2a2a3a;border-radius:16px;padding:16px;text-align:center}
        .inv-item .icon{font-size:32px}
        .inv-item .name{font-size:14px;font-weight:600;color:#fff;margin-top:4px}
        .inv-item .value{font-size:12px;color:#f0b90b;margin-top:2px}
        .inv-item .sell-btn{background:#e74c3c;color:#fff;border:none;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;margin-top:6px;width:100%}
        .inv-item .sell-btn:active{background:#c0392b}
        .inv-actions{display:flex;gap:10px;margin-top:16px}
        .inv-actions .btn{flex:1;padding:12px;border-radius:12px;border:none;font-weight:600;font-size:14px;cursor:pointer;background:#1a1a24;border:1px solid #f0b90b;color:#f0b90b}
        .inv-actions .btn:active{background:#2a2a3a}
        .inv-actions .btn.primary{background:#f0b90b;color:#0a0a0f}
        .inv-actions .btn.primary:active{background:#d4a40a}
        
        .cases-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:10px}
        .case-item{background:#1a1a24;border:1px solid #2a2a3a;border-radius:16px;padding:16px;text-align:center;cursor:pointer;transition:all .2s}
        .case-item:active{transform:scale(0.95);border-color:#f0b90b}
        .case-item .icon{font-size:40px;margin-bottom:6px}
        .case-item .name{font-size:14px;font-weight:600;color:#fff}
        .case-item .price{font-size:13px;color:#f0b90b;margin-top:4px}
        .case-item .count{font-size:12px;color:#888;margin-top:2px}
        
        .case-animation{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:300;padding:20px}
        .case-animation.active{display:flex}
        .slot-machine{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:420px;padding:16px;background:#0d0d14;border-radius:16px;border:1px solid #2a2a3a}
        .slot-item{background:#1a1a24;border:2px solid #333;border-radius:12px;padding:10px;text-align:center;width:62px;transition:all .2s ease}
        .slot-item .icon{font-size:26px}
        .slot-item .name{font-size:9px;color:#888;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50px}
        .slot-item .slot-price{font-size:8px;color:#555;margin-top:1px}
        .slot-item.winner{border-color:#f0b90b;box-shadow:0 0 25px rgba(240,185,11,0.7);transform:scale(1.08);background:#1a1a24}
        .slot-item.winner .name{color:#f0b90b}
        .case-result{margin-top:16px;text-align:center;display:none}
        .case-result.show{display:block}
        .case-result .icon{font-size:56px}
        .case-result .name{font-size:22px;color:#f0b90b;font-weight:700;margin-top:8px}
        .case-close-btn{background:#f0b90b;color:#0a0a0f;padding:12px 30px;border-radius:12px;border:none;font-weight:700;font-size:16px;cursor:pointer;margin-top:16px}
        .case-close-btn:active{background:#d4a40a}
        
        .upgrade-container{display:flex;flex-direction:column;align-items:center;gap:16px}
        .wheel-wrapper{position:relative;width:220px;height:220px;margin:0 auto}
        .wheel-canvas{width:220px;height:220px;border-radius:50%;border:4px solid #f0b90b}
        .wheel-arrow{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:30px;color:#f0b90b;z-index:10;text-shadow:0 0 10px rgba(240,185,11,0.5)}
        .wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;background:#0a0a0f;border-radius:50%;border:3px solid #f0b90b;z-index:5}
        .upgrade-info{text-align:center;color:#aaa;font-size:14px}
        .upgrade-info .green{color:#2ecc71;font-weight:600}
        .upgrade-info .red{color:#e74c3c;font-weight:600}
        .upgrade-controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
        .upgrade-controls .btn{padding:10px 16px;border-radius:10px;border:none;font-weight:600;font-size:13px;cursor:pointer;background:#1a1a24;border:1px solid #f0b90b;color:#f0b90b}
        .upgrade-controls .btn:active{background:#2a2a3a}
        .upgrade-controls .btn.primary{background:#f0b90b;color:#0a0a0f}
        .upgrade-controls .btn.primary:active{background:#d4a40a}
        .selected-skin-info{color:#aaa;font-size:13px;margin-top:4px}
        .selected-skin-info span{color:#f0b90b;font-weight:600}
        
        .skin-select-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:400;padding:20px}
        .skin-select-overlay.active{display:flex}
        .skin-select-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:400px;max-height:400px;overflow-y:auto;padding:10px}
        .skin-select-item{background:#1a1a24;border:1px solid #2a2a3a;border-radius:12px;padding:12px;text-align:center;cursor:pointer}
        .skin-select-item:active{transform:scale(0.95);border-color:#f0b90b}
        .skin-select-item .icon{font-size:32px}
        .skin-select-item .name{font-size:12px;color:#ccc;margin-top:4px}
        .skin-select-close{background:#f0b90b;color:#0a0a0f;padding:10px 30px;border-radius:12px;border:none;font-weight:700;font-size:14px;cursor:pointer;margin-top:16px}
        .skin-select-close:active{background:#d4a40a}
        
        .profile-card{background:#1a1a24;border-radius:16px;padding:16px 18px;margin-bottom:10px;border:1px solid #2a2a3a}
        .profile-card .label{color:#888;font-size:12px;text-transform:uppercase}
        .profile-card .value{font-size:18px;font-weight:600;color:#fff;margin-top:2px}
        .profile-card .balance-num{font-size:26px;font-weight:700;color:#f0b90b}
        .wallet-row{display:flex;gap:10px;margin-top:6px}
        .wallet-row input{flex:1;background:#0a0a0f;border:1px solid #2a2a3a;border-radius:12px;padding:12px 14px;color:#fff;font-size:14px;outline:none}
        .wallet-row input:focus{border-color:#f0b90b}
        .wallet-row button{padding:12px 18px;border-radius:12px;border:none;font-weight:600;cursor:pointer;background:#f0b90b;color:#0a0a0f}
        .wallet-row button:active{background:#d4a40a}
        .profile-btn{width:100%;padding:12px;border-radius:12px;border:none;font-weight:600;font-size:15px;cursor:pointer;margin-top:6px}
        .profile-btn.primary{background:#f0b90b;color:#0a0a0f}
        .profile-btn.primary:active{background:#d4a40a}
        .profile-btn.secondary{background:#1a1a24;border:1px solid #f0b90b;color:#f0b90b}
        .profile-btn.secondary:active{background:#2a2a3a}
        .profile-btn.outline{background:transparent;border:1px solid #444;color:#aaa}
        .profile-btn.outline:active{background:#1a1a24}
        .ref-link{background:#0a0a0f;padding:10px 14px;border-radius:10px;font-size:13px;color:#aaa;word-break:break-all;margin-top:6px;border:1px solid #1a1a24}
        
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#0d0d14;border-top:1px solid #1a1a24;display:flex;justify-content:space-around;padding:6px 0 10px;z-index:100}
        .nav-item{display:flex;flex-direction:column;align-items:center;color:#666;font-size:11px;cursor:pointer;padding:4px 12px;background:none;border:none;font-family:inherit;flex:1;max-width:80px;transition:color .15s ease}
        .nav-item .icon{font-size:26px;margin-bottom:2px}
        .nav-item.active{color:#f0b90b}
        
        .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1a1a24;border:1px solid #f0b90b;padding:12px 20px;border-radius:12px;color:#fff;font-weight:500;z-index:200;opacity:0;transition:opacity .3s ease;pointer-events:none;max-width:90%;text-align:center;font-size:14px}
        .toast.show{opacity:1}
        .toast.error{border-color:#ff4444}
        .toast.success{border-color:#44ff88}
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="top-bar">
        <span class="logo">🎰 CASINO</span>
        <span class="balance" id="top-balance">💎 1000</span>
    </div>

    <div id="page-menu" class="page active">
        <div class="menu-hero">
            <h1>🔥 DROP</h1>
            <div style="font-size:56px;margin:16px 0;">🎰</div>
            <div class="subtitle">Добро пожаловать в казино</div>
            <button class="game-btn" onclick="switchToGame('cases')">📦 Кейсы</button>
            <button class="game-btn secondary" onclick="switchToGame('upgrade')">⚡ Апгрейд</button>
        </div>
    </div>

    <div id="page-games" class="page">
        <div class="page-title" id="game-title">🎮 Игры</div>
        <div id="game-content"></div>
    </div>

    <div id="page-inventory" class="page">
        <div class="page-title">🎒 Инвентарь</div>
        <div id="inventory-content">
            <div class="empty-inventory">
                <div class="icon">🎒</div>
                <h2>Пока ничего нет</h2>
                <p style="color:#555;margin-top:8px;">Открой кейс, чтобы получить предметы</p>
            </div>
        </div>
    </div>

    <div id="page-profile" class="page">
        <div class="page-title">👤 Профиль</div>
        <div class="profile-card"><div class="label">Имя</div><div class="value" id="profile-name">Игрок</div></div>
        <div class="profile-card"><div class="label">ID</div><div class="value" id="profile-id">---</div></div>
        <div class="profile-card"><div class="label">Баланс</div><div class="balance-num" id="profile-balance">💎 1000</div></div>
        <div class="profile-card">
            <div class="label">USDT (TRC20)</div>
            <div class="wallet-row">
                <input type="text" id="wallet-input" placeholder="T...">
                <button onclick="showToast('✅ Кошелек привязан!', 'success', 2000)">Привязать</button>
            </div>
        </div>
        <button class="profile-btn primary" onclick="showToast('💰 Пополнение через TRC20.\nАдрес: T9yD14Nj9j7xso4e8LG8k7u4LmE9qX8kZ9', 'info', 5000)">💰 Пополнить</button>
        <button class="profile-btn secondary" onclick="showToast('💸 Заявка на вывод отправлена!', 'success', 3000)">💸 Вывести</button>
        <button class="profile-btn primary" onclick="applyPromoCode()" style="margin-top:10px;">🎁 Промокод</button>
        <div style="margin-top:16px;">
            <div style="color:#888;font-size:12px;text-transform:uppercase;">Реферальная ссылка</div>
            <div class="ref-link" id="ref-link">Загрузка...</div>
            <button class="profile-btn outline" onclick="copyRef()" style="margin-top:6px;">📋 Копировать</button>
        </div>
    </div>

    <div class="case-animation" id="case-animation">
        <div class="slot-machine" id="slot-machine"></div>
        <div class="case-result" id="case-result">
            <div class="icon" id="result-icon">🎁</div>
            <div class="name" id="result-name">Предмет</div>
        </div>
        <button class="case-close-btn" onclick="closeCaseAnimation()">✖ Закрыть</button>
    </div>

    <div class="skin-select-overlay" id="skin-select-overlay">
        <h2 style="color:#f0b90b;margin-bottom:12px;">🎯 Выбери скин</h2>
        <div class="skin-select-grid" id="skin-select-grid"></div>
        <button class="skin-select-close" onclick="closeSkinSelect()">✖ Закрыть</button>
    </div>

    <div class="bottom-nav">
        <button class="nav-item" data-page="page-inventory" onclick="switchPage('page-inventory')">
            <span class="icon">🎒</span>
            <span>Инвентарь</span>
        </button>
        <button class="nav-item active" data-page="page-menu" onclick="switchPage('page-menu')">
            <span class="icon">🏠</span>
            <span>Меню</span>
        </button>
        <button class="nav-item" data-page="page-profile" onclick="switchPage('page-profile')">
            <span class="icon">👤</span>
            <span>Профиль</span>
        </button>
    </div>

    <script>
        // ==================== НАСТРОЙКИ ====================
        let currentBalance = 1000;
        let inventory = [];
        let usedPromoCodes = [];
        let currentGame = 'cases';
        let selectedSkinForUpgrade = null;
        let multiplier = 2;
        let isSpinning = false;

        // ==================== ПРЕДМЕТЫ ====================
        const allItems = [
            { id: 'bear', name: 'Мишка', icon: '🧸', value: 15 },
            { id: 'heart', name: 'Сердечко', icon: '❤️', value: 15 },
            { id: 'rose', name: 'Роза', icon: '🌹', value: 20 },
            { id: 'cake', name: 'Торт', icon: '🎂', value: 25 },
            { id: 'star', name: 'Звезда', icon: '⭐', value: 30 },
            { id: 'diamond', name: 'Алмаз', icon: '💎', value: 50 },
            { id: 'crown', name: 'Корона', icon: '👑', value: 75 },
            { id: 'rocket', name: 'Ракета', icon: '🚀', value: 100 },
            { id: 'unicorn', name: 'Единорог', icon: '🦄', value: 150 },
            { id: 'dragon', name: 'Дракон', icon: '🐉', value: 200 },
            { id: 'phoenix', name: 'Феникс', icon: '🔥', value: 300 },
            { id: 'golden', name: 'Золотой', icon: '🏆', value: 500 },
            { id: 'legendary', name: 'Легендарный', icon: '⚡', value: 1000 },
            { id: 'mythic', name: 'Мифический', icon: '🌟', value: 2500 },
            { id: 'godly', name: 'Божественный', icon: '👼', value: 5000 },
            { id: 'cosmic', name: 'Космический', icon: '🌌', value: 10000 },
            { id: 'void', name: 'Войд', icon: '🕳️', value: 25000 },
            { id: 'eternal', name: 'Вечный', icon: '♾️', value: 50000 },
        ];

        // ==================== КЕЙСЫ ====================
        const cases = [
            { id: 'case1', name: 'Обычный', price: 100, icon: '📦', items: allItems.slice(0, 5) },
            { id: 'case2', name: 'Редкий', price: 500, icon: '📦', items: allItems.slice(0, 8) },
            { id: 'case3', name: 'Эпический', price: 1000, icon: '📦', items: allItems.slice(0, 10) },
            { id: 'case4', name: 'Легендарный', price: 2500, icon: '📦', items: allItems.slice(0, 12) },
            { id: 'case5', name: 'Мифический', price: 5000, icon: '📦', items: allItems.slice(0, 15) },
        ];

        // ==================== ФУНКЦИИ ====================
        function updateBalanceUI() {
            document.getElementById('top-balance').textContent = '💎 ' + currentBalance;
            const pb = document.getElementById('profile-balance');
            if (pb) pb.textContent = '💎 ' + currentBalance;
        }

        function saveData() {
            const data = { balance: currentBalance, inventory, usedPromoCodes };
            localStorage.setItem('casino_data', JSON.stringify(data));
        }

        function loadData() {
            try {
                const raw = localStorage.getItem('casino_data');
                if (!raw) return;
                const data = JSON.parse(raw);
                if (data.balance !== undefined) currentBalance = data.balance;
                if (data.inventory) inventory = data.inventory;
                if (data.usedPromoCodes) usedPromoCodes = data.usedPromoCodes;
                updateBalanceUI();
                renderInventory();
            } catch(e) {}
        }

        function switchPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            const activeBtn = document.querySelector(`.nav-item[data-page="${pageId}"]`);
            if (activeBtn) activeBtn.classList.add('active');
            if (pageId === 'page-inventory') renderInventory();
            if (pageId === 'page-profile') updateReferralLink();
            updateBalanceUI();
        }

        function updateReferralLink() {
            document.getElementById('ref-link').textContent = `https://t.me/MusorDrop_ROBOT?start=ref${123}`;
        }

        function switchToGame(game) {
            currentGame = game;
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-games').classList.add('active');
            renderGame(game);
        }

        function renderGame(game) {
            const content = document.getElementById('game-content');
            if (game === 'cases') renderCases(content);
            else if (game === 'upgrade') renderUpgrade(content);
        }

        // ==================== КЕЙСЫ ====================
        function renderCases(content) {
            let html = '<div class="page-title">📦 Кейсы</div><div class="cases-grid">';
            cases.forEach(c => {
                html += `<div class="case-item" onclick="openCase('${c.id}')">
                    <div class="icon">${c.icon}</div>
                    <div class="name">${c.name}</div>
                    <div class="price">${c.price} 💎</div>
                    <div class="count">${c.items.length} предметов</div>
                </div>`;
            });
            html += '</div>';
            content.innerHTML = html;
        }

        function getWeightedRandom(items) {
            // Шансы: чем дороже предмет, тем меньше шанс
            // Базовая формула: шанс = 1 / (value/100 + 0.5)
            const weights = items.map(item => {
                if (item.value <= 50) return 100;      // Очень высокий шанс
                if (item.value <= 200) return 40;
                if (item.value <= 500) return 15;
                if (item.value <= 1000) return 5;
                if (item.value <= 5000) return 1.5;
                if (item.value <= 25000) return 0.3;
                return 0.05; // 50000+
            });
            const totalWeight = weights.reduce((a, b) => a + b, 0);
            let rand = Math.random() * totalWeight;
            for (let i = 0; i < items.length; i++) {
                rand -= weights[i];
                if (rand <= 0) return items[i];
            }
            return items[items.length - 1];
        }

        function openCase(caseId) {
            const caseData = cases.find(c => c.id === caseId);
            if (!caseData) return;
            if (currentBalance < caseData.price) {
                showToast('❌ Недостаточно алмазов!', 'error');
                return;
            }
            currentBalance -= caseData.price;
            updateBalanceUI();
            saveData();

            const selectedItem = getWeightedRandom(caseData.items);
            showCaseAnimation(caseData.items, selectedItem);
        }

        function showCaseAnimation(allItems, selectedItem) {
            const overlay = document.getElementById('case-animation');
            const machine = document.getElementById('slot-machine');
            const resultDiv = document.getElementById('case-result');
            const resultIcon = document.getElementById('result-icon');
            const resultName = document.getElementById('result-name');

            overlay.classList.add('active');
            resultDiv.classList.remove('show');
            machine.innerHTML = '';

            const totalSlots = 15;
            const slotItems = [];
            for (let i = 0; i < totalSlots; i++) {
                const randItem = allItems[Math.floor(Math.random() * allItems.length)];
                slotItems.push(randItem);
            }
            // Вставляем выигрышный предмет в центр
            const winIndex = Math.floor(totalSlots / 2);
            slotItems[winIndex] = selectedItem;

            // Создаём ячейки
            slotItems.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'slot-item';
                div.dataset.index = index;
                div.innerHTML = `
                    <div class="icon">${item.icon || '🎁'}</div>
                    <div class="name">${item.name}</div>
                    <div class="slot-price">${item.value}💎</div>
                `;
                machine.appendChild(div);
            });

            const items = document.querySelectorAll('.slot-item');
            let highlightIndex = 0;
            let highlightDirection = 1;

            const highlightInterval = setInterval(() => {
                items.forEach(el => el.classList.remove('winner'));
                if (items.length > 0) {
                    items[highlightIndex % items.length].classList.add('winner');
                    highlightIndex += highlightDirection;
                    if (highlightIndex >= items.length - 1 || highlightIndex <= 0) {
                        highlightDirection *= -1;
                    }
                }
            }, 100);

            setTimeout(() => {
                clearInterval(highlightInterval);
                items.forEach(el => el.classList.remove('winner'));
                const winEl = document.querySelector(`.slot-item[data-index="${winIndex}"]`);
                if (winEl) {
                    winEl.classList.add('winner');
                    // Плавное увеличение
                    winEl.style.transition = 'all 0.3s ease';
                }

                inventory.push(selectedItem);
                saveData();
                resultIcon.textContent = selectedItem.icon || '🎁';
                resultName.textContent = selectedItem.name;
                resultDiv.classList.add('show');
                showToast(`🎉 Вы получили: ${selectedItem.name}! (${selectedItem.value}💎)`, 'success');
                renderInventory();
            }, 2500);
        }

        function closeCaseAnimation() {
            document.getElementById('case-animation').classList.remove('active');
        }

        // ==================== АПГРЕЙД ====================
        function renderUpgrade(content) {
            let html = `
                <div class="page-title">⚡ Апгрейд</div>
                <div class="upgrade-container">
                    <div class="wheel-wrapper">
                        <canvas class="wheel-canvas" id="wheelCanvas" width="220" height="220"></canvas>
                        <div class="wheel-arrow">▼</div>
                        <div class="wheel-center"></div>
                    </div>
                    <div class="upgrade-info" id="upgrade-info">
                        <span class="green">🟢 Победа: ${getWinChance()}%</span> | 
                        <span class="red">🔴 Поражение: ${100 - getWinChance()}%</span>
                    </div>
                    <div class="selected-skin-info" id="selected-skin-info">Выбран: <span>Нет</span></div>
                    <div class="upgrade-controls">
                        <button class="btn" onclick="openSkinSelect()">🎯 Выбрать скин</button>
                        <button class="btn primary" onclick="spinUpgrade()">🎰 Крутить</button>
                        <button class="btn" onclick="setMultiplier(2)">x2</button>
                        <button class="btn" onclick="setMultiplier(5)">x5</button>
                        <button class="btn" onclick="setMultiplier(10)">x10</button>
                    </div>
                </div>
            `;
            content.innerHTML = html;
            drawWheel();
        }

        function drawWheel() {
            const canvas = document.getElementById('wheelCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const cx = w/2, cy = h/2, r = 100;

            ctx.clearRect(0, 0, w, h);

            const winChance = getWinChance();
            const loseChance = 100 - winChance;

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + (winChance/100) * 2 * Math.PI);
            ctx.closePath();
            ctx.fillStyle = '#2ecc71';
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, -Math.PI/2 + (winChance/100) * 2 * Math.PI, -Math.PI/2 + 2 * Math.PI);
            ctx.closePath();
            ctx.fillStyle = '#e74c3c';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, 2 * Math.PI);
            ctx.strokeStyle = '#f0b90b';
            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const midAngle = -Math.PI/2 + (winChance/100) * Math.PI;
            const pX = cx + r * 0.6 * Math.cos(midAngle);
            const pY = cy + r * 0.6 * Math.sin(midAngle);
            ctx.fillText(`${winChance}%`, pX, pY);

            const loseAngle = -Math.PI/2 + (winChance/100) * 2 * Math.PI + (loseChance/100) * Math.PI;
            const lX = cx + r * 0.6 * Math.cos(loseAngle);
            const lY = cy + r * 0.6 * Math.sin(loseAngle);
            ctx.fillText(`${loseChance}%`, lX, lY);
        }

        function getWinChance() {
            return Math.max(10, 60 - multiplier * 5);
        }

        function setMultiplier(m) {
            multiplier = m;
            const info = document.getElementById('upgrade-info');
            if (info) {
                info.innerHTML = `<span class="green">🟢 Победа: ${getWinChance()}%</span> | <span class="red">🔴 Поражение: ${100 - getWinChance()}%</span>`;
            }
            drawWheel();
            showToast(`Множитель: x${m}`, 'info', 1500);
        }

        function openSkinSelect() {
            if (inventory.length === 0) {
                showToast('❌ У вас нет предметов для апгрейда!', 'error');
                return;
            }
            const overlay = document.getElementById('skin-select-overlay');
            const grid = document.getElementById('skin-select-grid');
            grid.innerHTML = '';
            inventory.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'skin-select-item';
                div.innerHTML = `<div class="icon">${item.icon || '🎁'}</div><div class="name">${item.name}</div>`;
                div.onclick = () => selectSkin(index);
                grid.appendChild(div);
            });
            overlay.classList.add('active');
        }

        function closeSkinSelect() {
            document.getElementById('skin-select-overlay').classList.remove('active');
        }

        function selectSkin(index) {
            selectedSkinForUpgrade = inventory[index];
            const info = document.getElementById('selected-skin-info');
            if (info) info.innerHTML = `Выбран: <span>${selectedSkinForUpgrade.name}</span>`;
            closeSkinSelect();
            showToast(`✅ Выбран: ${selectedSkinForUpgrade.name}`, 'success');
        }

        function spinUpgrade() {
            if (!selectedSkinForUpgrade) {
                showToast('❌ Сначала выберите скин!', 'error');
                return;
            }
            if (isSpinning) return;
            isSpinning = true;

            const canvas = document.getElementById('wheelCanvas');
            if (!canvas) return;

            const winChance = getWinChance();
            const isWin = Math.random() * 100 < winChance;

            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            const cx = w/2, cy = h/2, r = 100;

            let angle = 0;
            const totalRotation = 4 * Math.PI + (isWin ? 0 : Math.PI);
            const duration = 2000;
            const startTime = Date.now();

            function animateWheel() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const ease = 1 - Math.pow(1 - progress, 3);
                const currentAngle = totalRotation * ease;

                ctx.clearRect(0, 0, w, h);

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, -Math.PI/2 + currentAngle, -Math.PI/2 + (winChance/100) * 2 * Math.PI + currentAngle);
                ctx.closePath();
                ctx.fillStyle = '#2ecc71';
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, -Math.PI/2 + (winChance/100) * 2 * Math.PI + currentAngle, -Math.PI/2 + 2 * Math.PI + currentAngle);
                ctx.closePath();
                ctx.fillStyle = '#e74c3c';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                ctx.strokeStyle = '#f0b90b';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const midAngle = -Math.PI/2 + currentAngle + (winChance/100) * Math.PI;
                const pX = cx + r * 0.6 * Math.cos(midAngle);
                const pY = cy + r * 0.6 * Math.sin(midAngle);
                ctx.fillText(`${winChance}%`, pX, pY);

                const loseAngle = -Math.PI/2 + currentAngle + (winChance/100) * 2 * Math.PI + ((100-winChance)/100) * Math.PI;
                const lX = cx + r * 0.6 * Math.cos(loseAngle);
                const lY = cy + r * 0.6 * Math.sin(loseAngle);
                ctx.fillText(`${100-winChance}%`, lX, lY);

                if (progress < 1) {
                    requestAnimationFrame(animateWheel);
                } else {
                    isSpinning = false;
                    if (isWin) {
                        const upgraded = { ...selectedSkinForUpgrade, value: Math.round(selectedSkinForUpgrade.value * multiplier) };
                        inventory = inventory.filter(item => item.id !== selectedSkinForUpgrade.id);
                        inventory.push(upgraded);
                        showToast(`🎉 Апгрейд успешен! +${multiplier}x`, 'success');
                    } else {
                        inventory = inventory.filter(item => item.id !== selectedSkinForUpgrade.id);
                        showToast('💥 Скин сгорел!', 'error');
                    }
                    selectedSkinForUpgrade = null;
                    document.getElementById('selected-skin-info').innerHTML = 'Выбран: <span>Нет</span>';
                    saveData();
                    renderInventory();
                    renderGame('upgrade');
                }
            }
            animateWheel();
        }

        // ==================== ИНВЕНТАРЬ ====================
        function renderInventory() {
            const container = document.getElementById('inventory-content');
            if (inventory.length === 0) {
                container.innerHTML = `<div class="empty-inventory">
                    <div class="icon">🎒</div>
                    <h2>Пока ничего нет</h2>
                    <p style="color:#555;margin-top:8px;">Открой кейс, чтобы получить предметы</p>
                </div>`;
                return;
            }
            let html = '<div class="inventory-grid">';
            inventory.forEach((item, index) => {
                html += `<div class="inv-item">
                    <div class="icon">${item.icon || '🎁'}</div>
                    <div class="name">${item.name}</div>
                    <div class="value">${item.value || 0} 💎</div>
                    <button class="sell-btn" onclick="sellItem(${index})">💰 Продать</button>
                </div>`;
            });
            html += `</div>
                <div class="inv-actions">
                    <button class="btn" onclick="sellAll()">💰 Продать всё</button>
                </div>
            `;
            container.innerHTML = html;
        }

        function sellItem(index) {
            const item = inventory[index];
            if (!item) return;
            const price = Math.round(item.value * 0.5);
            currentBalance += price;
            inventory.splice(index, 1);
            saveData();
            updateBalanceUI();
            renderInventory();
            showToast(`💰 Продано! +${price}💎`, 'success');
        }

        function sellAll() {
            if (inventory.length === 0) {
                showToast('❌ Инвентарь пуст!', 'error');
                return;
            }
            let total = 0;
            inventory.forEach(item => { total += Math.round(item.value * 0.5); });
            currentBalance += total;
            inventory = [];
            saveData();
            updateBalanceUI();
            renderInventory();
            showToast(`💰 Продано всё! +${total}💎`, 'success');
        }

        // ==================== ПРОМОКОД ====================
        function applyPromoCode() {
            const code = prompt('Введите промокод:');
            if (!code) return;
            if (usedPromoCodes.includes(code)) {
                showToast('❌ Этот промокод уже использован!', 'error');
                return;
            }
            if (code === '200') {
                currentBalance += 100000;
                usedPromoCodes.push(code);
                saveData();
                updateBalanceUI();
                showToast('🎉 Промокод активирован! +100 000💎', 'success', 4000);
            } else {
                showToast('❌ Неверный промокод', 'error');
            }
        }

        // ==================== ТОСТ ====================
        function showToast(msg, type = 'info', duration = 3000) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => { t.classList.remove('show'); }, duration);
        }

        // ==================== КОПИРОВАТЬ ====================
        function copyRef() {
            const link = document.getElementById('ref-link').textContent;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(link).then(() => showToast('✅ Ссылка скопирована!', 'success'))
                    .catch(() => fallbackCopy(link));
            } else {
                fallbackCopy(link);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            showToast('✅ Ссылка скопирована!', 'success');
        }

        // ==================== ИНИЦИАЛИЗАЦИЯ ====================
        window.Telegram?.WebApp?.ready();
        loadData();
        updateReferralLink();
        switchPage('page-menu');
    </script>
</body>
</html>
