<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шарик катится по кругу</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw; height: 100vh; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            background: #181818;
        }
        .circle-wrapper {
            position: relative;
            width: 500px; height: 500px;
            border-radius: 50%;
            border: 4px solid #1473e6;
            background: #181818;
            box-shadow: 0 0 20px rgba(20, 115, 230, 0.3);
            animation: rotate 2s linear infinite;
        }
        /* ===== ДЫРКА (вращается вместе с кругом) ===== */
        .hole {
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 8px;
            background: #181818;
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
            border-bottom: 2px solid #1473e6;
            z-index: 3;
        }
        .ball {
            position: absolute;
            width: 20px; height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #fff, #f0b90b);
            box-shadow: 0 0 20px rgba(240, 185, 11, 0.3);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            will-change: transform;
            pointer-events: none;
            z-index: 2;
            animation: none;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @media (max-width: 600px) {
            .circle-wrapper { width: 80vw; height: 80vw; border-width: 3px; }
        }
    </style>
</head>
<body>
    <div class="circle-wrapper" id="circleWrapper">
        <div class="ball" id="ball"></div>
        <div class="hole" id="hole"></div>
    </div>

    <script>
        const wrapper = document.getElementById('circleWrapper');
        const ball = document.getElementById('ball');
        const hole = document.getElementById('hole');

        const size = 500;
        const radius = size / 2;
        const ballRadius = 10;

        // Позиция шарика (внутри круга)
        let x = radius;
        let y = radius - 40;

        // Скорость
        let dx = (Math.random() - 0.5) * 1.0;
        let dy = 0;

        const GRAVITY = 0.2;
        const BOUNCE = 0.85;
        const FRICTION = 0.995; // чтобы шарик не разгонялся бесконечно

        // === ПОЛУЧАЕМ ТЕКУЩИЙ УГОЛ ДЫРКИ (относительно круга) ===
        function getHoleAngle() {
            // Дырка всегда внизу в локальных координатах круга
            // Но так как круг вращается, её угол в мировой системе = -90° + вращение
            const wrapperStyle = window.getComputedStyle(wrapper);
            const transform = wrapperStyle.transform;
            if (transform === 'none') return -Math.PI / 2;
            const matrix = transform.match(/matrix\(([^)]+)\)/);
            if (!matrix) return -Math.PI / 2;
            const values = matrix[1].split(', ').map(Number);
            const angle = Math.atan2(values[1], values[0]);
            return angle;
        }

        function updateBall() {
            // Гравитация всегда вниз (в мировых координатах)
            dy += GRAVITY;

            // Движение
            x += dx;
            y += dy;

            // Расстояние от центра
            const dist = Math.sqrt((x - radius) ** 2 + (y - radius) ** 2);
            const maxDist = radius - ballRadius - 2;

            // === СТОЛКНОВЕНИЕ СО СТЕНКОЙ ===
            if (dist > maxDist) {
                const nx = (x - radius) / dist;
                const ny = (y - radius) / dist;

                // Вталкиваем внутрь
                x = radius + nx * maxDist;
                y = radius + ny * maxDist;

                // Отражение скорости
                const vn = dx * nx + dy * ny;
                if (vn > 0) {
                    dx -= 2 * vn * nx * BOUNCE;
                    dy -= 2 * vn * ny * BOUNCE;

                    // Трение, чтобы не разгонялся
                    dx *= FRICTION;
                    dy *= FRICTION;
                }
            }

            // === ПРОВЕРКА: НАХОДИТСЯ ЛИ ДЫРКА ПОД ШАРИКОМ? ===
            // Угол шарика относительно центра круга
            const ballAngle = Math.atan2(y - radius, x - radius);
            // Угол дырки в мировой системе
            const holeAngle = getHoleAngle();

            // Разница углов (нормализуем)
            let diff = ballAngle - holeAngle;
            while (diff > Math.PI) diff -= 2 * Math.PI;
            while (diff < -Math.PI) diff += 2 * Math.PI;

            // Если шарик близко к дырке (по углу) и находится в нижней части
            const isNearHole = Math.abs(diff) < 0.15;
            const isAtBottom = y > radius + 10;

            if (isNearHole && isAtBottom) {
                // Шарик падает в дырку!
                dy += 0.5; // ускоряем падение
                // Можно добавить визуальный эффект или остановить игру
                console.log('Шарик упал в дырку!');
            }

            // Применяем позицию
            ball.style.left = (x - ballRadius) + 'px';
            ball.style.top = (y - ballRadius) + 'px';

            requestAnimationFrame(updateBall);
        }

        updateBall();
    </script>

</body>
</html>
