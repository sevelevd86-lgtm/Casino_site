<script>

===================================================== */

(function () {
"use strict";

// --- БАЛАНС ---
if (typeof window.balance !== "number" || Number.isNaN(window.balance)) {
    const saved = localStorage.getItem("cases_balance");
    window.balance = saved !== null ? Number(saved) : 1000;
}
function saveBalanceCase() {
    localStorage.setItem("cases_balance", String(window.balance));
}
function updateBalanceCase() {
    const el = document.getElementById("balanceCase");
    if (!el) return;
    el.textContent = Number(window.balance).toFixed(2);
    saveBalanceCase();
    if (typeof window.updateBalanceUI === "function") {
        try { window.updateBalanceUI(); } catch(e) {}
    }
}

// --- ИНВЕНТАРЬ ---
if (!Array.isArray(window.caseInventory)) {
    try {
        const saved = localStorage.getItem("case_inventory");
        window.caseInventory = saved ? JSON.parse(saved) : [];
    } catch(e) { window.caseInventory = []; }
}
function saveInventoryCase() {
    try { localStorage.setItem("case_inventory", JSON.stringify(window.caseInventory)); } catch(e) {}
}
function addItemToInventoryCase(item) {
    const copy = { emoji: item.emoji, name: item.name, value: item.value, chance: item.chance, rarity: item.rarity };
    window.caseInventory.push(copy);
    saveInventoryCase();
    if (typeof window.addItemToInventory === "function") {
        try { window.addItemToInventory(copy); } catch(e) {}
    }
}

// --- ЦЕНЫ ---
const CASE_PRICE = 50;
const CASE_250_PRICE = 250;
const PLS_PEPE_PRICE = 10;

let isOpeningCase = false;
let currentWinnerCase = null;
let currentCaseType = "paid";

// --- ПРЕДМЕТЫ (без изменений) ---
const itemsCase = [
    { emoji: "🐻", name: "Toy Bear", value: 5000, chance: 0.0001, rarity: "legendary" },

    { emoji: "🏆", name: "Trophy", value: 100, chance: 7.5, rarity: "rare" },
    { emoji: "💎", name: "Diamond", value: 100, chance: 7.5, rarity: "rare" },
    { emoji: "🎂", name: "Cake", value: 50, chance: 10, rarity: "uncommon" },
    { emoji: "💐", name: "Flowers", value: 50, chance: 10, rarity: "uncommon" },
    { emoji: "🎁", name: "Gift", value: 25, chance: 13, rarity: "" },
    { emoji: "🐻", name: "bear", value: 15, chance: 15, rarity: "" },
    { emoji: "🩷", name: "Heart", value: 15, chance: 15, rarity: "" },
    { emoji: "7 ⭐", name: "7 Stars", value: 7, chance: 0, rarity: "" }

// --- FREE COOLDOWN ---
const FREE_COOLDOWN = 24 * 60 * 60 * 1000;
const FREE_COOLDOWN_KEY = "case_free_last_open";
function getFreeLastOpen() {
    const v = localStorage.getItem(FREE_COOLDOWN_KEY);
    if (!v) return 0;
    const n = Number(v);
    return Number.isFinite(n) ? n : 0;
}
function canOpenFreeCase() {
    return Date.now() - getFreeLastOpen() >= FREE_COOLDOWN;
}
function setFreeCooldown() {
    localStorage.setItem(FREE_COOLDOWN_KEY, String(Date.now()));
    updateFreeButton();
}
function updateFreeButton() {
    const remaining = FREE_COOLDOWN - (Date.now() - getFreeLastOpen());
    if (remaining <= 0) {
        freeCaseBox.classList.remove("disabled");
        freeTimer.textContent = "✅ ГОТОВ";
        return;
    }
    freeCaseBox.classList.add("disabled");
    let totalSec = Math.ceil(remaining / 1000);
    const h = Math.floor(totalSec / 3600);
    totalSec %= 3600;
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    freeTimer.textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}
function formatTimeCase(ms) {
    let totalSec = Math.ceil(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    totalSec %= 3600;
    const m = Math.floor(totalSec / 60);
    const s = totalSec % 60;
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

// --- ПРЕДМЕТЫ И РУЛЕТКА (без изменений механики) ---
function renderItemsCase(source) {
    itemsGrid.innerHTML = "";
    const sorted = [...source].sort((a, b) => b.value - a.value);
    sorted.forEach(item => {
        const card = document.createElement("div");
        card.className = `item-card ${item.rarity}`;
        card.innerHTML = `<div class="item-emoji">${item.emoji}</div><div class="item-name">${item.name}</div><div class="item-price">+${item.value} ⭐</div>`;
        itemsGrid.appendChild(card);
    });
}
function getRandomItemCase(source) {
    const rand = Math.random() * 100;
    let acc = 0;
    for (const item of source) {
        acc += item.chance;
        if (rand < acc) return item;
    }
    return source[source.length - 1];
}
function createRouletteCardCase(item) {
    const el = document.createElement("div");
    el.className = `roulette-item ${item.rarity}`;
    el.innerHTML = `<div class="roulette-emoji">${item.emoji}</div><div class="roulette-name">${item.name}</div>`;
    return el;
}
function resetRouletteCase(source = itemsCase) {
    rouletteTrack.style.transition = "none";
    rouletteTrack.style.transform = "translateX(0px)";
    rouletteTrack.innerHTML = "";
    for (let i = 0; i < 18; i++) {
        const randItem = source[Math.floor(Math.random() * source.length)];
        rouletteTrack.appendChild(createRouletteCardCase(randItem));
    }
}
function startRouletteCase(source, winner) {
    rouletteTrack.style.transition = "none";
    rouletteTrack.style.transform = "translateX(0px)";
    rouletteTrack.innerHTML = "";
    const totalCards = 45;
    const winnerIndex = 36;
    for (let i = 0; i < totalCards; i++) {
        let item = (i === winnerIndex) ? winner : source[Math.floor(Math.random() * source.length)];
        rouletteTrack.appendChild(createRouletteCardCase(item));
    }
    const cardWidth = 135;
    const windowWidth = rouletteTrack.parentElement.offsetWidth;
    const centerOffset = windowWidth / 2 - 62.5;
    const stopPosition = -(winnerIndex * cardWidth - centerOffset);
    const finalPosition = stopPosition + (Math.random() * 30 - 15);
    requestAnimationFrame(() => {
        requestAnimationFrame(() => {
            rouletteTrack.style.transition = "transform 6.5s cubic-bezier(.08,.72,.05,1)";
            rouletteTrack.style.transform = `translateX(${finalPosition}px)`;
        });
    });
    setTimeout(() => {
        showResultCase(winner);
        isOpeningCase = false;
        openButton.disabled = false;
    }, 6800);
}

// --- ЗВУК (короткий) ---
let audioContextCase = null;
function getAudioContextCase() {
    try {
        if (!audioContextCase) audioContextCase = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContextCase.state === "suspended") audioContextCase.resume();
        return audioContextCase;
    } catch(e) { return null; }
}
function playClickSoundCase() {
    const ctx = getAudioContextCase();
    if (!ctx) return;
    try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "square";
        osc.frequency.setValueAtTime(180, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
    } catch(e) {}
}
function playWinSoundCase() {
    const ctx = getAudioContextCase();
    if (!ctx) return;
    try {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const start = ctx.currentTime + idx * 0.1;
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0, start);
            gain.gain.linearRampToValueAtTime(0.12, start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(start);
            osc.stop(start + 0.4);
        });
    } catch(e) {}
}
