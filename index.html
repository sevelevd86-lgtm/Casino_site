<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PEPE CASE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background:
        radial-gradient(
            circle at 50% 25%,
            #102d1d 0%,
            #09150f 35%,
            #06080a 80%
        );
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

body {
    min-height: 100vh;
}

button {
    font: inherit;
}

.app {
    width: 100%;
    max-width: 700px;
    min-height: 100vh;
    margin: 0 auto;
    padding: 20px 15px 40px;
}


/* =========================
   BACKGROUND
========================= */

.bg-glow {
    position: fixed;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(110px);
    opacity: .16;
    z-index: -1;
}

.bg-glow.one {
    left: -180px;
    top: 5%;
    background: #28ef72;
}

.bg-glow.two {
    right: -180px;
    bottom: 5%;
    background: #0aa34b;
}


/* =========================
   HEADER
========================= */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.logo {
    font-size: 25px;
    font-weight: 1000;
    letter-spacing: 2px;
}

.logo span {
    color: #37ed7b;
}

.balance-box {
    min-width: 145px;
    padding: 10px 14px;
    border-radius: 13px;
    border: 1px solid #1e4c31;
    background:
        linear-gradient(
            145deg,
            #101b14,
            #0b0d0c
        );
    text-align: right;
    box-shadow:
        0 10px 30px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.04);
}

.balance-label {
    color: #68736d;
    font-size: 9px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.balance {
    margin-top: 3px;
    font-size: 20px;
    font-weight: 1000;
}

.balance::after {
    content: " 💰";
}


/* =========================
   CASE
========================= */

.case-panel {
    position: relative;
    overflow: hidden;
    padding: 25px 20px 22px;
    border-radius: 25px;
    border: 1px solid #1d4d31;
    background:
        linear-gradient(
            145deg,
            rgba(12,31,20,.98),
            rgba(7,11,9,.99)
        );
    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.04);
}

.case-panel::before {
    content: "";
    position: absolute;
    width: 330px;
    height: 330px;
    left: 50%;
    top: 30%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #22df69;
    filter: blur(100px);
    opacity: .13;
    pointer-events: none;
}

.case-title {
    position: relative;
    z-index: 2;
    text-align: center;
    font-size: 13px;
    font-weight: 1000;
    color: #78847d;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.case-name {
    position: relative;
    z-index: 2;
    margin-top: 4px;
    text-align: center;
    font-size: 29px;
    font-weight: 1000;
    color: #fff;
    text-shadow:
        0 0 20px rgba(55,237,123,.35);
}


/* =========================
   PEPE IMAGE
========================= */

.pepe-wrapper {
    position: relative;
    z-index: 2;
    width: min(330px, 75vw);
    aspect-ratio: 1 / 1;
    margin: 20px auto 12px;

    display: flex;
    align-items: center;
    justify-content: center;
}

.pepe-glow {
    position: absolute;
    width: 72%;
    height: 72%;
    border-radius: 50%;
    background: #27df6d;
    filter: blur(50px);
    opacity: .18;
}

.pepe {
    position: relative;

    width: 240px;
    height: 240px;

    display: flex;
    align-items: center;
    justify-content: center;

    animation:
        pepeFloat 3s ease-in-out infinite;
}

.pepe img {
    width: 100%;
    height: 100%;

    object-fit: contain;

    display: block;

    filter:
        drop-shadow(0 20px 25px rgba(0,0,0,.5))
        drop-shadow(0 0 25px rgba(40,230,105,.3));
}

@keyframes pepeFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }

}


/* =========================
   INFO
========================= */

.case-info {
    position: relative;
    z-index: 2;
    text-align: center;
}

.price {
    display: inline-block;

    padding: 8px 13px;

    border-radius: 10px;

    background:
        rgba(38,213,103,.09);

    border:
        1px solid #205e38;

    color:
        #45ed86;

    font-size:
        14px;

    font-weight:
        1000;
}

.description {
    margin-top: 10px;

    color:
        #69736e;

    font-size:
        12px;

    font-weight:
        700;
}


/* =========================
   OPEN BUTTON
========================= */

.open-button {
    position: relative;
    z-index: 2;

    width: 100%;
    height: 56px;

    margin-top: 20px;

    border: none;
    border-radius: 14px;

    color: #fff;

    font-size: 16px;
    font-weight: 1000;

    letter-spacing: 1px;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            #27d96a,
            #0b8b42
        );

    box-shadow:
        0 12px 35px rgba(21,210,96,.2),
        inset 0 1px 0 rgba(255,255,255,.2);

    transition: .2s;
}

.open-button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 16px 40px rgba(21,210,96,.3);
}

.open-button:active {
    transform: scale(.98);
}

.open-button:disabled {
    opacity: .5;
    cursor: default;
}


/* =========================
   MODAL
========================= */

.modal {
    position: fixed;
    inset: 0;

    z-index: 500;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 15px;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(8px);
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 470px;

    padding: 23px;

    border-radius: 23px;

    border:
        1px solid #205b38;

    background:
        linear-gradient(
            145deg,
            #102016,
            #090d0b
        );

    box-shadow:
        0 30px 100px rgba(0,0,0,.75);

    text-align: center;

    animation:
        modalIn .25s ease;
}

@keyframes modalIn {

    from {
        transform: scale(.85);
        opacity: 0;
    }

    to {
        transform: scale(1);
        opacity: 1;
    }

}

.modal-title {
    font-size: 22px;
    font-weight: 1000;
}

.modal-icon {
    width: 90px;
    height: 90px;

    margin: 15px auto;

    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-icon img {
    width: 90px;
    height: 90px;

    object-fit: contain;

    filter:
        drop-shadow(0 10px 15px rgba(0,0,0,.5))
        drop-shadow(0 0 20px rgba(40,230,105,.25));
}


/* =========================
   ROULETTE
========================= */

.roulette {
    position: relative;

    width: 100%;
    height: 90px;

    overflow: hidden;

    border-radius: 13px;

    border:
        1px solid #234631;

    background:
        #060907;
}

.roulette::before {
    content: "";

    position: absolute;

    z-index: 10;

    left: 50%;
    top: 0;
    bottom: 0;

    width: 2px;

    transform:
        translateX(-50%);

    background:
        #45ef88;

    box-shadow:
        0 0 10px #45ef88;
}

.roulette-line {
    display: flex;

    align-items: center;

    gap: 10px;

    height: 100%;

    padding: 10px;

    transition:
        transform
        3.5s
        cubic-bezier(.08,.75,.1,1);
}

.roulette-item {
    flex:
        0 0 70px;

    height: 70px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 12px;

    border:
        1px solid #254331;

    background:
        #101711;

    overflow: hidden;

    font-size: 30px;
}

.roulette-item img {
    width: 54px;
    height: 54px;

    object-fit: contain;

    display: block;

    filter:
        drop-shadow(
            0 5px 8px
            rgba(0,0,0,.5)
        );
}


/* =========================
   RESULT
========================= */

.result {
    min-height: 40px;

    margin-top: 15px;

    color:
        #42ee86;

    font-size:
        17px;

    font-weight:
        1000;
}

.close-button {
    width: 100%;
    height: 48px;

    margin-top: 10px;

    border-radius: 12px;

    border:
        1px solid #24432f;

    background:
        #111712;

    color:
        #fff;

    font-weight:
        1000;

    cursor: pointer;
}

.close-button:hover {
    border-color:
        #39dc76;
}


/* =========================
   TOAST
========================= */

.toast {
    position: fixed;

    z-index: 700;

    left: 50%;
    bottom: 25px;

    min-width: 220px;

    max-width:
        calc(100vw - 30px);

    padding:
        14px 18px;

    border-radius:
        13px;

    border:
        1px solid #25613b;

    background:
        #111712;

    color:
        #4aef8a;

    text-align:
        center;

    font-weight:
        1000;

    transform:
        translate(-50%, 100px);

    opacity:
        0;

    transition:
        .3s;
}

.toast.show {
    transform:
        translate(-50%, 0);

    opacity:
        1;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .app {
        padding:
            14px
            12px
            30px;
    }

    .logo {
        font-size:
            21px;
    }

    .balance-box {
        min-width:
            125px;

        padding:
            8px 11px;
    }

    .balance {
        font-size:
            17px;
    }

    .case-panel {
        padding:
            21px 14px;

        border-radius:
            20px;
    }

    .case-name {
        font-size:
            25px;
    }

    .pepe {
        width:
            200px;

        height:
            200px;
    }

}

</style>
</head>


<body>

<div class="bg-glow one"></div>
<div class="bg-glow two"></div>


<div class="app">

    <header class="header">

        <div class="logo">
            <span>PEPE</span> CASE
        </div>


        <div class="balance-box">

            <div class="balance-label">
                Ваш баланс
            </div>

            <div
                class="balance"
                id="balance"
            >
                1000
            </div>

        </div>

    </header>


    <section class="case-panel">

        <div class="case-title">
            SPECIAL CASE
        </div>


        <div class="case-name">
            PEPE
        </div>


        <!-- PEPE -->

        <div class="pepe-wrapper">

            <div class="pepe-glow"></div>

            <div class="pepe">

                <img
                    src="https://i.ibb.co/svLMYdFn/IMG-0794.png"
                    alt="Pepe"
                >

            </div>

        </div>


        <!-- INFO -->

        <div class="case-info">

            <div class="price">
                25 💰
            </div>


            <div class="description">
                Открой кейс и получи одну из наград
            </div>

        </div>


        <!-- OPEN -->

        <button
            class="open-button"
            id="openButton"
            onclick="openCase()"
        >
            ОТКРЫТЬ КЕЙС
        </button>

    </section>

</div>



<!-- =========================
     MODAL
========================= -->

<div
    class="modal"
    id="modal"
>

    <div class="modal-box">


        <div class="modal-title">
            PEPE CASE
        </div>


        <div class="modal-icon">

            <img
                src="https://i.ibb.co/svLMYdFn/IMG-0794.png"
                alt="Pepe"
            >

        </div>


        <div class="roulette">

            <div
                class="roulette-line"
                id="rouletteLine"
            ></div>

        </div>


        <div
            class="result"
            id="result"
        >
            Открываем...
        </div>


        <button
            class="close-button"
            id="closeButton"
            onclick="closeModal()"
        >
            ЗАКРЫТЬ
        </button>

    </div>

</div>



<div
    class="toast"
    id="toast"
></div>



<script>


/* =========================================================
   IMAGE
========================================================= */

const PEPE_IMAGE =
    "https://i.ibb.co/svLMYdFn/IMG-0794.png";


/* =========================================================
   SETTINGS
========================================================= */

let balance = 1000;

const CASE_PRICE = 25;

let opening = false;


/* =========================================================
   REWARDS
========================================================= */

const rewards = [

    {
        name: "10 💰",
        value: 10,
        icon: "💰",
        chance: 25
    },

    {
        name: "25 💰",
        value: 25,
        icon: "🎁",
        chance: 25
    },

    {
        name: "50 💰",
        value: 50,
        icon: "🌹",
        chance: 20
    },

    {
        name: "100 💰",
        value: 100,
        icon: "💎",
        chance: 15
    },

    {
        name: "150 💰",
        value: 150,
        icon: "PEPE",
        chance: 10,
        image: PEPE_IMAGE
    },

    {
        name: "250 💰",
        value: 250,
        icon: "👑",
        chance: 5
    }

];


/* =========================================================
   DOM
========================================================= */

const balanceElement =
    document.getElementById(
        "balance"
    );

const modal =
    document.getElementById(
        "modal"
    );

const rouletteLine =
    document.getElementById(
        "rouletteLine"
    );

const result =
    document.getElementById(
        "result"
    );

const openButton =
    document.getElementById(
        "openButton"
    );

const closeButton =
    document.getElementById(
        "closeButton"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;


function getAudioContext() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }


    return audioContext;

}


function tickSound() {

    try {

        const audio =
            getAudioContext();


        const oscillator =
            audio.createOscillator();


        const gain =
            audio.createGain();


        oscillator.type =
            "square";


        oscillator.frequency.setValueAtTime(
            650,
            audio.currentTime
        );


        oscillator.frequency.exponentialRampToValueAtTime(
            180,
            audio.currentTime + .06
        );


        gain.gain.setValueAtTime(
            .055,
            audio.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .001,
            audio.currentTime + .08
        );


        oscillator.connect(gain);

        gain.connect(
            audio.destination
        );


        oscillator.start();


        oscillator.stop(
            audio.currentTime + .09
        );

    } catch (e) {}

}


function winSound() {

    try {

        const audio =
            getAudioContext();


        const notes = [
            523,
            659,
            784,
            1047
        ];


        notes.forEach(
            (
                frequency,
                index
            ) => {

                const oscillator =
                    audio.createOscillator();


                const gain =
                    audio.createGain();


                const start =
                    audio.currentTime +
                    index * .09;


                oscillator.type =
                    "sine";


                oscillator.frequency.setValueAtTime(
                    frequency,
                    start
                );


                gain.gain.setValueAtTime(
                    .001,
                    start
                );


                gain.gain.exponentialRampToValueAtTime(
                    .12,
                    start + .02
                );


                gain.gain.exponentialRampToValueAtTime(
                    .001,
                    start + .25
                );


                oscillator.connect(gain);

                gain.connect(
                    audio.destination
                );


                oscillator.start(start);


                oscillator.stop(
                    start + .27
                );

            }
        );

    } catch (e) {}

}


/* =========================================================
   BALANCE
========================================================= */

function updateBalance() {

    balance =
        Math.round(
            balance * 100
        ) / 100;


    balanceElement.textContent =
        balance.toLocaleString(
            "ru-RU",
            {
                maximumFractionDigits: 2
            }
        );

}


/* =========================================================
   RANDOM REWARD
========================================================= */

function getReward() {

    const random =
        Math.random() * 100;


    let current = 0;


    for (
        const reward of rewards
    ) {

        current +=
            reward.chance;


        if (
            random <= current
        ) {

            return reward;

        }

    }


    return rewards[
        rewards.length - 1
    ];

}


/* =========================================================
   ROULETTE ITEM
========================================================= */

function createRouletteItem(
    reward
) {

    const element =
        document.createElement(
            "div"
        );


    element.className =
        "roulette-item";


    if (
        reward.image
    ) {

        const image =
            document.createElement(
                "img"
            );


        image.src =
            reward.image;


        image.alt =
            reward.name;


        element.appendChild(
            image
        );

    } else {

        element.textContent =
            reward.icon;

    }


    return element;

}


/* =========================================================
   OPEN CASE
========================================================= */

function openCase() {

    if (opening)
        return;


    if (
        balance < CASE_PRICE
    ) {

        showToast(
            "Недостаточно средств 💰"
        );

        return;

    }


    balance -=
        CASE_PRICE;


    updateBalance();


    opening = true;


    openButton.disabled =
        true;


    closeButton.disabled =
        true;


    modal.classList.add(
        "show"
    );


    result.textContent =
        "Открываем...";


    rouletteLine.innerHTML =
        "";


    /* =========================
       ITEMS
    ========================= */

    const items = [];


    for (
        let i = 0;
        i < 40;
        i++
    ) {

        items.push(
            getReward()
        );

    }


    /* =========================
       WINNER
    ========================= */

    const winner =
        getReward();


    items[32] =
        winner;


    /* =========================
       DRAW
    ========================= */

    items.forEach(
        reward => {

            rouletteLine.appendChild(
                createRouletteItem(
                    reward
                )
            );

        }
    );


    /* =========================
       RESET
    ========================= */

    rouletteLine.style.transition =
        "none";


    rouletteLine.style.transform =
        "translateX(0px)";


    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                () => {

                    const itemWidth =
                        80;


                    const containerWidth =
                        document.querySelector(
                            ".roulette"
                        ).clientWidth;


                    const center =
                        containerWidth / 2;


                    const winnerCenter =
                        32 *
                        itemWidth +
                        10 +
                        35;


                    const finalX =
                        center -
                        winnerCenter;


                    rouletteLine.style.transition =
                        "transform 3.5s cubic-bezier(.08,.75,.1,1)";


                    rouletteLine.style.transform =
                        `translateX(${finalX}px)`;


                    /* =========================
                       TICKS
                    ========================= */

                    let ticks = 0;


                    const interval =
                        setInterval(
                            () => {

                                tickSound();

                                ticks++;


                                if (
                                    ticks >= 27
                                ) {

                                    clearInterval(
                                        interval
                                    );

                                }

                            },
                            125
                        );


                    /* =========================
                       FINISH
                    ========================= */

                    setTimeout(
                        () => {

                            finishCase(
                                winner
                            );

                        },
                        3700
                    );

                }
            );

        }
    );

}


/* =========================================================
   FINISH
========================================================= */

function finishCase(
    reward
) {

    balance +=
        reward.value;


    updateBalance();


    let rewardHTML;


    if (
        reward.image
    ) {

        rewardHTML =
            `
            <img
                src="${reward.image}"
                style="
                    width:45px;
                    height:45px;
                    object-fit:contain;
                    vertical-align:middle;
                    margin-right:6px;
                "
            >
            ${reward.name}
            `;

    } else {

        rewardHTML =
            `${reward.icon} ${reward.name}`;

    }


    result.innerHTML =
        `
        🎉 Вы получили
        <strong>
            ${rewardHTML}
        </strong>
        `;


    winSound();


    showToast(
        `🎉 ${reward.name}`
    );


    opening = false;


    openButton.disabled =
        false;


    closeButton.disabled =
        false;

}


/* =========================================================
   CLOSE
========================================================= */

function closeModal() {

    if (opening)
        return;


    modal.classList.remove(
        "show"
    );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function showToast(
    text
) {

    clearTimeout(
        toastTimer
    );


    toast.textContent =
        text;


    toast.classList.add(
        "show"
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================================
   BACKGROUND CLOSE
========================================================= */

modal.addEventListener(
    "click",
    event => {

        if (
            event.target === modal &&
            !opening
        ) {

            closeModal();

        }

    }
);


/* =========================================================
   INIT
========================================================= */

updateBalance();

</script>

</body>
</html>
