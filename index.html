<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Scratch & Win</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #111315;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
    user-select: none;
}

.game {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    padding: 24px 18px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    width: 100%;
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -1px;
}

.subtitle {
    margin-top: 9px;
    color: #858b91;
    font-size: 15px;
}

.prize {
    margin-top: 8px;
    color: #42df78;
    font-size: 20px;
    font-weight: 900;
}


/* =====================================================
   CARD
===================================================== */

.lottery-card {
    width: 100%;
    padding: 16px;
    background: #1a1d20;
    border: 1px solid #30353a;
    border-radius: 22px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
}


/* =====================================================
   GRID
===================================================== */

.grid {
    width: 100%;
    aspect-ratio: 1 / 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}


/* =====================================================
   CELL
===================================================== */

.cell {
    position: relative;
    overflow: hidden;

    border-radius: 14px;
    background: #292e33;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    border: 1px solid #3b4248;

    perspective: 600px;
}

.icon {
    position: absolute;

    font-size: clamp(38px, 13vw, 65px);

    transform: scale(.75);

    opacity: 0;

    transition:
        transform .35s ease,
        opacity .35s ease;
}

.cell.open .icon {
    transform: scale(1);
    opacity: 1;
}


/* =====================================================
   SCRATCH LAYER
===================================================== */

.scratch {
    position: absolute;
    inset: 0;

    z-index: 5;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.08) 0%,
            rgba(255,255,255,0) 25%,
            rgba(255,255,255,.08) 50%,
            rgba(255,255,255,0) 75%
        ),
        repeating-linear-gradient(
            115deg,
            #777d82 0px,
            #777d82 3px,
            #6b7176 3px,
            #6b7176 6px
        );

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.08),
        inset 0 0 18px rgba(0,0,0,.35);

    transition:
        opacity .35s ease,
        transform .35s ease;
}

.scratch::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            165deg,
            transparent 0px,
            transparent 7px,
            rgba(255,255,255,.13) 8px,
            transparent 10px
        );

    opacity: .65;
}

.scratch::after {
    content: "?";

    position: absolute;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    color: rgba(255,255,255,.25);

    font-size: 38px;
    font-weight: 900;
}

.cell.scratching .scratch {
    animation: scratchAnimation .35s ease forwards;
}

@keyframes scratchAnimation {
    0% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .65;
        transform: scale(1.04);
    }

    100% {
        opacity: 0;
        transform: scale(1.15);
        pointer-events: none;
    }
}


/* =====================================================
   OPENED CELL
===================================================== */

.cell.open {
    background: #20252a;
    border-color: #414950;
}


/* =====================================================
   INFO
===================================================== */

.info {
    margin-top: 18px;

    text-align: center;

    color: #858b91;

    font-size: 14px;

    line-height: 1.5;
}

.info strong {
    color: #fff;
}


/* =====================================================
   MODAL
===================================================== */

.modal {
    position: fixed;
    inset: 0;

    z-index: 100;

    background: rgba(0,0,0,.72);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    opacity: 0;
    pointer-events: none;

    transition: opacity .25s ease;
}

.modal.show {
    opacity: 1;
    pointer-events: auto;
}

.modal-box {
    width: 100%;
    max-width: 350px;

    padding: 30px 24px;

    background: #1a1d20;

    border: 1px solid #353b40;

    border-radius: 22px;

    text-align: center;

    transform: scale(.85);

    transition: transform .25s ease;

    box-shadow:
        0 25px 80px rgba(0,0,0,.6);
}

.modal.show .modal-box {
    transform: scale(1);
}

.result-icon {
    font-size: 60px;
    margin-bottom: 10px;
}

.result-title {
    font-size: 34px;
    font-weight: 900;
}

.result-title.win {
    color: #42df78;
}

.result-title.lose {
    color: #ef4752;
}

.result-text {
    margin-top: 12px;

    color: #858b91;

    font-size: 15px;

    line-height: 1.5;
}

.win-amount {
    margin-top: 10px;

    color: #42df78;

    font-size: 32px;
    font-weight: 900;
}

.play-again {
    width: 100%;

    margin-top: 25px;

    padding: 15px;

    border: none;
    border-radius: 12px;

    background: #1678e8;

    color: white;

    font-size: 15px;
    font-weight: 900;

    cursor: pointer;

    transition:
        background .2s ease,
        transform .1s ease;
}

.play-again:active {
    transform: scale(.97);
}

.play-again:hover {
    background: #2687f5;
}


/* =====================================================
   CONFETTI / SPARKS
===================================================== */

.spark {
    position: fixed;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 150;

    animation:
        sparkFly 1s ease-out forwards;
}

@keyframes sparkFly {
    0% {
        transform:
            translate(0, 0)
            scale(1);

        opacity: 1;
    }

    100% {
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);

        opacity: 0;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 360px) {

    .game {
        padding-left: 12px;
        padding-right: 12px;
    }

    .lottery-card {
        padding: 11px;
    }

    .grid {
        gap: 7px;
    }

    .logo {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div class="game">

    <header class="header">

        <div class="logo">
            SCRATCH & WIN!
        </div>

        <div class="subtitle">
            Лотерея • Номинал $5
        </div>

        <div class="prize">
            Выигрыш до $100,000
        </div>

    </header>


    <div class="lottery-card">

        <div
            class="grid"
            id="grid">
        </div>

        <div class="info">
            Откройте карточки и найдите
            <strong>3 одинаковых символа</strong>
        </div>

    </div>

</div>


<!-- =====================================================
     RESULT MODAL
===================================================== -->

<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <div
            class="result-icon"
            id="resultIcon">
            🎉
        </div>

        <div
            class="result-title"
            id="resultTitle">
            ПОБЕДА!
        </div>

        <div
            class="result-text"
            id="resultText">
        </div>

        <div
            class="win-amount"
            id="winAmount">
        </div>

        <button
            class="play-again"
            id="playAgain">
            ИГРАТЬ СНОВА
        </button>

    </div>

</div>


<script>

/* =====================================================
   НАСТРОЙКИ
===================================================== */

const icons = [
    "🪙",
    "⭐",
    "💎",
    "🍀",
    "🧲",
    "🎰"
];

const grid = document.getElementById("grid");

const modal =
    document.getElementById("modal");

const resultIcon =
    document.getElementById("resultIcon");

const resultTitle =
    document.getElementById("resultTitle");

const resultText =
    document.getElementById("resultText");

const winAmount =
    document.getElementById("winAmount");

const playAgain =
    document.getElementById("playAgain");


/* =====================================================
   СОСТОЯНИЕ ИГРЫ
===================================================== */

let cells = [];

let openedCount = 0;

let gameOver = false;


/* =====================================================
   RANDOM
===================================================== */

function randomItem(array) {

    return array[
        Math.floor(
            Math.random() *
            array.length
        )
    ];
}


function randomMoney(min, max) {

    return Math.floor(
        Math.random() *
        (max - min + 1)
    ) + min;
}


/* =====================================================
   ЗВУК SCRATCH
===================================================== */

let audioContext = null;


function scratchSound() {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }


        if (
            audioContext.state ===
            "suspended"
        ) {

            audioContext.resume();
        }


        const duration = .18;

        const buffer =
            audioContext.createBuffer(
                1,
                audioContext.sampleRate *
                duration,
                audioContext.sampleRate
            );


        const data =
            buffer.getChannelData(0);


        for (
            let i = 0;
            i < data.length;
            i++
        ) {

            /*
                Шум.

                Чем дальше,
                тем тише.
            */

            const fade =
                1 -
                i / data.length;


            data[i] =
                (
                    Math.random() * 2 -
                    1
                ) *
                fade;
        }


        const source =
            audioContext.createBufferSource();

        source.buffer =
            buffer;


        const filter =
            audioContext.createBiquadFilter();

        filter.type =
            "bandpass";

        filter.frequency.value =
            1700;

        filter.Q.value =
            .8;


        const gain =
            audioContext.createGain();

        gain.gain.value =
            .22;


        source
            .connect(filter)
            .connect(gain)
            .connect(
                audioContext.destination
            );


        source.start();

    } catch (error) {

        /*
            Если браузер
            заблокировал звук —
            игра всё равно работает.
        */
    }
}


/* =====================================================
   СОЗДАНИЕ ПОЛЯ
===================================================== */

function createGame() {

    grid.innerHTML = "";

    cells = [];

    openedCount = 0;

    gameOver = false;


    /*
        Создаём 9 случайных
        символов.
    */

    const values = [];

    for (
        let i = 0;
        i < 9;
        i++
    ) {

        values.push(
            randomItem(icons)
        );
    }


    for (
        let i = 0;
        i < 9;
        i++
    ) {

        const cell =
            document.createElement("div");

        cell.className =
            "cell";


        const icon =
            document.createElement("div");

        icon.className =
            "icon";

        icon.textContent =
            values[i];


        const scratch =
            document.createElement("div");

        scratch.className =
            "scratch";


        cell.appendChild(icon);

        cell.appendChild(scratch);


        cell.dataset.value =
            values[i];

        cell.dataset.index =
            i;


        cell.addEventListener(
            "click",
            () => openCell(cell)
        );


        grid.appendChild(cell);

        cells.push(cell);
    }
}


/* =====================================================
   ОТКРЫТИЕ ЯЧЕЙКИ
===================================================== */

function openCell(cell) {

    if (gameOver)
        return;


    if (
        cell.classList.contains("open")
    )
        return;


    if (
        cell.classList.contains(
            "scratching"
        )
    )
        return;


    /*
        Запускаем звук.
    */

    scratchSound();


    /*
        Анимация стирания.
    */

    cell.classList.add(
        "scratching"
    );


    /*
        Небольшая задержка,
        чтобы символ появился
        после стирания.
    */

    setTimeout(
        () => {

            if (gameOver)
                return;


            cell.classList.add(
                "open"
            );

            openedCount++;


            /*
                Проверяем победу
                сразу после открытия.
            */

            if (
                checkWin()
            ) {

                showWin();

                return;
            }


            /*
                Если открыты все —
                проигрыш.
            */

            if (
                openedCount >= 9
            ) {

                showLose();
            }

        },
        320
    );
}


/* =====================================================
   ПРОВЕРКА ТРЁХ В РЯД
===================================================== */

function checkWin() {

    const board =
        cells.map(
            cell =>
                cell.dataset.value
        );


    /*
        Все возможные линии:
        3 горизонтальные,
        3 вертикальные,
        2 диагонали.
    */

    const lines = [

        [0, 1, 2],

        [3, 4, 5],

        [6, 7, 8],

        [0, 3, 6],

        [1, 4, 7],

        [2, 5, 8],

        [0, 4, 8],

        [2, 4, 6]

    ];


    for (
        const line of lines
    ) {

        const [a, b, c] =
            line;


        /*
            Проверяем только
            открытые клетки.

            Благодаря этому нельзя
            выиграть через закрытые.
        */

        if (
            cells[a].classList.contains("open") &&
            cells[b].classList.contains("open") &&
            cells[c].classList.contains("open") &&
            board[a] === board[b] &&
            board[b] === board[c]
        ) {

            return true;
        }
    }


    return false;
}


/* =====================================================
   ПОБЕДА
===================================================== */

function showWin() {

    gameOver = true;


    const amount =
        randomMoney(
            10,
            50000
        );


    resultIcon.textContent =
        "🎉";


    resultTitle.textContent =
        "ПОБЕДА!";


    resultTitle.className =
        "result-title win";


    resultText.textContent =
        "Три одинаковых символа!";


    winAmount.textContent =
        "$" +
        amount.toLocaleString(
            "en-US"
        );


    winAmount.style.display =
        "block";


    modal.classList.add(
        "show"
    );


    createSparks();
}


/* =====================================================
   ПРОИГРЫШ
===================================================== */

function showLose() {

    gameOver = true;


    resultIcon.textContent =
        "😔";


    resultTitle.textContent =
        "ПОПРОБУЙ СНОВА";


    resultTitle.className =
        "result-title lose";


    resultText.textContent =
        "Трёх одинаковых символов не найдено.";


    winAmount.textContent =
        "";


    winAmount.style.display =
        "none";


    modal.classList.add(
        "show"
    );
}


/* =====================================================
   ИСКРЫ
===================================================== */

function createSparks() {

    const count = 45;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const spark =
            document.createElement(
                "div"
            );


        spark.className =
            "spark";


        /*
            Начальная точка —
            центр экрана.
        */

        spark.style.left =
            "50%";

        spark.style.top =
            "50%";


        /*
            Случайное направление.
        */

        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            100 +
            Math.random() *
            280;


        const x =
            Math.cos(angle) *
            distance;


        const y =
            Math.sin(angle) *
            distance;


        spark.style.setProperty(
            "--x",
            x + "px"
        );


        spark.style.setProperty(
            "--y",
            y + "px"
        );


        /*
            Разный размер.
        */

        const size =
            4 +
            Math.random() * 7;


        spark.style.width =
            size + "px";

        spark.style.height =
            size + "px";


        document.body.appendChild(
            spark
        );


        setTimeout(
            () => {
                spark.remove();
            },
            1100
        );
    }
}


/* =====================================================
   НОВАЯ ИГРА
===================================================== */

playAgain.addEventListener(
    "click",
    () => {

        modal.classList.remove(
            "show"
        );


        /*
            Небольшая задержка,
            чтобы модальное окно
            успело исчезнуть.
        */

        setTimeout(
            createGame,
            200
        );
    }
);


/* =====================================================
   START
===================================================== */

createGame();

</script>

</body>
</html>
