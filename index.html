<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scratch & Win</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #111315;
    color: white;
    font-family: Arial, sans-serif;
    user-select: none;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    padding: 20px 18px 30px;
}


/* ================================
   HEADER
================================ */

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 30px;
}

.logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.5px;
}

.balance-box {
    background: #1b1e21;
    border: 1px solid #30353a;
    border-radius: 10px;
    padding: 9px 13px;
    text-align: right;
}

.balance-label {
    font-size: 10px;
    color: #858b91;
    text-transform: uppercase;
}

.balance {
    margin-top: 2px;
    color: #ffd84d;
    font-size: 18px;
    font-weight: 900;
}


/* ================================
   TITLE
================================ */

.title {
    text-align: center;
    font-size: 31px;
    font-weight: 900;
    letter-spacing: -1px;
}

.subtitle {
    margin-top: 8px;
    text-align: center;
    color: #858b91;
    font-size: 14px;
    line-height: 1.5;
}


/* ================================
   TICKET INFO
================================ */

.ticket-info {
    margin-top: 24px;

    display: flex;
    gap: 8px;
}

.info-card {
    flex: 1;

    background: #191c1f;
    border: 1px solid #30353a;
    border-radius: 12px;

    padding: 13px 8px;

    text-align: center;
}

.info-label {
    color: #777e85;
    font-size: 10px;
    text-transform: uppercase;
}

.info-value {
    margin-top: 5px;
    font-size: 17px;
    font-weight: 900;
}


/* ================================
   PURCHASE
================================ */

.purchase {
    margin-top: 24px;
}

.main-button {
    width: 100%;

    border: none;
    border-radius: 12px;

    padding: 15px;

    background: #1678e8;
    color: white;

    font-size: 16px;
    font-weight: 900;

    cursor: pointer;

    transition: .15s;
}

.main-button:hover {
    background: #2687f5;
}

.main-button:active {
    transform: scale(.98);
}

.purchase-note {
    margin-top: 9px;
    text-align: center;

    color: #70777e;
    font-size: 12px;
}


/* ================================
   GAME
================================ */

.game {
    display: none;
    margin-top: 28px;
}

.game.active {
    display: block;
}

.game-status {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 14px;
}

.status-text {
    font-size: 14px;
    font-weight: 800;
}

.free-info {
    color: #42df78;
    font-size: 12px;
    font-weight: 700;
}


/* ================================
   GRID
================================ */

.grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 10px;

    width: 100%;
    aspect-ratio: 1 / 1;
}

.cell {
    position: relative;

    overflow: hidden;

    border-radius: 14px;

    background: #1d2024;

    border: 1px solid #363c42;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.icon {
    font-size: clamp(36px, 12vw, 58px);

    filter:
        drop-shadow(
            0 5px 12px
            rgba(0,0,0,.35)
        );

    transform: scale(.8);

    transition: .25s;
}

.cell.opened .icon {
    transform: scale(1);
}


/* ================================
   SCRATCH LAYER
================================ */

.scratch {
    position: absolute;

    inset: 0;

    z-index: 5;

    background:
        repeating-linear-gradient(
            115deg,
            rgba(255,255,255,.08) 0px,
            rgba(255,255,255,.08) 2px,
            transparent 2px,
            transparent 6px
        ),
        repeating-linear-gradient(
            35deg,
            rgba(0,0,0,.16) 0px,
            rgba(0,0,0,.16) 2px,
            transparent 2px,
            transparent 7px
        ),
        linear-gradient(
            135deg,
            #858b91,
            #5f666d
        );

    box-shadow:
        inset 0 0 20px rgba(0,0,0,.3);
}

.scratch::after {
    content: "?";

    position: absolute;

    top: 50%;
    left: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 34px;
    font-weight: 900;

    color: rgba(255,255,255,.35);
}

.cell.opened .scratch {
    animation: scratchOff .35s forwards;
    pointer-events: none;
}

@keyframes scratchOff {
    0% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .65;
        transform: scale(1.04);
    }

    100% {
        opacity: 0;
        transform: scale(1.12);
    }
}


/* ================================
   CELL PRICE
================================ */

.cell-price {
    position: absolute;

    bottom: 7px;
    right: 8px;

    z-index: 2;

    color: rgba(255,255,255,.5);

    font-size: 9px;
}


/* ================================
   WIN EFFECT
================================ */

.spark {
    position: fixed;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #ffd84d;

    pointer-events: none;

    z-index: 999;

    animation:
        sparkle 700ms
        ease-out forwards;
}

@keyframes sparkle {
    from {
        transform:
            translate(0,0)
            scale(1);

        opacity: 1;
    }

    to {
        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(0);

        opacity: 0;
    }
}


/* ================================
   MODAL
================================ */

.modal {
    position: fixed;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.72);

    z-index: 100;

    opacity: 0;

    pointer-events: none;

    transition: .25s;
}

.modal.show {
    opacity: 1;
    pointer-events: auto;
}

.modal-box {
    width: 100%;
    max-width: 330px;

    padding: 28px 22px;

    border-radius: 18px;

    background: #191c1f;

    border: 1px solid #343a40;

    text-align: center;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.6);

    transform: scale(.85);

    transition: .25s;
}

.modal.show .modal-box {
    transform: scale(1);
}

.modal-title {
    font-size: 34px;
    font-weight: 900;
}

.modal-title.win {
    color: #42df78;
}

.modal-title.lose {
    color: #ef4752;
}

.modal-text {
    margin-top: 10px;

    color: #858b91;

    font-size: 14px;

    line-height: 1.6;
}

.modal-money {
    margin-top: 14px;

    font-size: 27px;
    font-weight: 900;
}

.modal-money.win {
    color: #42df78;
}

.modal-money.lose {
    color: #ef4752;
}

.modal-button {
    width: 100%;

    margin-top: 22px;

    padding: 14px;

    border: none;
    border-radius: 11px;

    background: #1678e8;

    color: white;

    font-size: 15px;
    font-weight: 900;

    cursor: pointer;
}


/* ================================
   RESPONSIVE
================================ */

@media(max-width:360px) {

    .app {
        padding-left: 12px;
        padding-right: 12px;
    }

    .title {
        font-size: 27px;
    }

    .grid {
        gap: 7px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            🐻‍❄️ DROP
        </div>

        <div class="balance-box">

            <div class="balance-label">
                Баланс
            </div>

            <div
                class="balance"
                id="balance">

                1000.00

            </div>

        </div>

    </div>


    <!-- TITLE -->

    <div class="title">
        SCRATCH & WIN!
    </div>

    <div class="subtitle">
        Купите билет и найдите<br>
        3 одинаковых предмета
    </div>


    <!-- INFO -->

    <div class="ticket-info">

        <div class="info-card">

            <div class="info-label">
                Билет
            </div>

            <div class="info-value">
                100
            </div>

        </div>


        <div class="info-card">

            <div class="info-label">
                Открытие
            </div>

            <div class="info-value">
                50
            </div>

        </div>


        <div class="info-card">

            <div class="info-label">
                Приз
            </div>

            <div class="info-value">
                500
            </div>

        </div>

    </div>


    <!-- PURCHASE -->

    <div
        class="purchase"
        id="purchase">

        <button
            class="main-button"
            id="buyButton">

            КУПИТЬ БИЛЕТ — 100

        </button>

        <div class="purchase-note">
            Первые 2 открытия бесплатно
        </div>

    </div>


    <!-- GAME -->

    <div
        class="game"
        id="game">

        <div class="game-status">

            <div
                class="status-text"
                id="statusText">

                Открыто: 0 / 9

            </div>

            <div
                class="free-info"
                id="freeInfo">

                Бесплатно: 2

            </div>

        </div>


        <div
            class="grid"
            id="grid">

        </div>

    </div>

</div>


<!-- RESULT -->

<div
    class="modal"
    id="modal">

    <div class="modal-box">

        <div
            class="modal-title"
            id="modalTitle">

            ПОБЕДА!

        </div>

        <div
            class="modal-text"
            id="modalText">

        </div>

        <div
            class="modal-money"
            id="modalMoney">

        </div>

        <button
            class="modal-button"
            id="againButton">

            ИГРАТЬ СНОВА

        </button>

    </div>

</div>


<script>

/* =====================================================
   НАСТРОЙКИ
===================================================== */

const TICKET_PRICE = 100;

const EXTRA_CELL_PRICE = 50;

const WIN_REWARD = 500;

const FREE_CELLS = 2;


/* =====================================================
   СОСТОЯНИЕ
===================================================== */

let balance = 1000;

let ticketActive = false;

let openedCells = 0;

let freeCellsLeft = FREE_CELLS;

let gameFinished = false;


/* =====================================================
   ИКОНКИ
===================================================== */

const ICONS = [

    "🪙",
    "⭐",
    "💎",
    "🍀",
    "🧲",
    "🎰"

];


/* =====================================================
   DOM
===================================================== */

const balanceElement =
    document.getElementById(
        "balance"
    );

const buyButton =
    document.getElementById(
        "buyButton"
    );

const purchase =
    document.getElementById(
        "purchase"
    );

const game =
    document.getElementById(
        "game"
    );

const grid =
    document.getElementById(
        "grid"
    );

const statusText =
    document.getElementById(
        "statusText"
    );

const freeInfo =
    document.getElementById(
        "freeInfo"
    );

const modal =
    document.getElementById(
        "modal"
    );

const modalTitle =
    document.getElementById(
        "modalTitle"
    );

const modalText =
    document.getElementById(
        "modalText"
    );

const modalMoney =
    document.getElementById(
        "modalMoney"
    );

const againButton =
    document.getElementById(
        "againButton"
    );


/* =====================================================
   БАЛАНС
===================================================== */

function updateBalance() {

    balanceElement.textContent =
        balance.toFixed(2);
}


/* =====================================================
   СЛУЧАЙНЫЙ ЭЛЕМЕНТ
===================================================== */

function randomIcon() {

    return ICONS[
        Math.floor(
            Math.random() *
            ICONS.length
        )
    ];
}


/* =====================================================
   СОЗДАНИЕ РАСКЛАДКИ
===================================================== */

let board = [];


function generateBoard() {

    board = [];

    for (
        let i = 0;
        i < 9;
        i++
    ) {

        board.push(
            randomIcon()
        );
    }

    /*
        ВАЖНО:

        Нам нужно, чтобы победа
        вообще была возможна.

        С вероятностью 50%
        гарантированно создаём
        3 одинаковых предмета
        в разных местах.
    */

    if (
        Math.random() < 0.5
    ) {

        const icon =
            randomIcon();

        const positions = [
            0,
            4,
            8
        ];

        positions.forEach(
            position => {

                board[position] =
                    icon;
            }
        );
    }
}


/* =====================================================
   СОЗДАНИЕ ПОЛЯ
===================================================== */

function createBoard() {

    grid.innerHTML = "";

    openedCells = 0;

    freeCellsLeft =
        FREE_CELLS;

    gameFinished = false;

    generateBoard();


    for (
        let i = 0;
        i < 9;
        i++
    ) {

        const cell =
            document.createElement(
                "div"
            );

        cell.className =
            "cell";


        /*
            Иконка
        */

        const icon =
            document.createElement(
                "div"
            );

        icon.className =
            "icon";

        icon.textContent =
            board[i];


        /*
            Scratch слой
        */

        const scratch =
            document.createElement(
                "div"
            );

        scratch.className =
            "scratch";


        /*
            Подсказка стоимости
        */

        const price =
            document.createElement(
                "div"
            );

        price.className =
            "cell-price";

        price.textContent =
            "50";


        cell.appendChild(icon);

        cell.appendChild(
            scratch
        );

        cell.appendChild(price);


        cell.dataset.index =
            i;


        cell.addEventListener(
            "click",
            () => {

                openCell(
                    cell,
                    i
                );

            }
        );


        grid.appendChild(cell);
    }


    updateGameStatus();
}


/* =====================================================
   ПОКУПКА БИЛЕТА
===================================================== */

buyButton.addEventListener(
    "click",
    () => {

        if (
            ticketActive
        ) {
            return;
        }


        if (
            balance <
            TICKET_PRICE
        ) {

            alert(
                "Недостаточно валюты."
            );

            return;
        }


        balance -=
            TICKET_PRICE;


        balance =
            Math.round(
                balance * 100
            ) / 100;


        ticketActive = true;


        updateBalance();


        purchase.style.display =
            "none";


        game.classList.add(
            "active"
        );


        createBoard();
    }
);


/* =====================================================
   ОТКРЫТИЕ ЯЧЕЙКИ
===================================================== */

function openCell(
    cell,
    index
) {

    if (
        gameFinished
    ) {
        return;
    }


    if (
        cell.classList.contains(
            "opened"
        )
    ) {
        return;
    }


    /*
        Первые 2 —
        бесплатно.
    */

    if (
        freeCellsLeft > 0
    ) {

        freeCellsLeft--;

    }

    else {

        /*
            Следующие клетки
            стоят 50.
        */

        if (
            balance <
            EXTRA_CELL_PRICE
        ) {

            alert(
                "Недостаточно валюты для открытия клетки."
            );

            return;
        }


        balance -=
            EXTRA_CELL_PRICE;


        balance =
            Math.round(
                balance * 100
            ) / 100;


        updateBalance();
    }


    openedCells++;


    cell.classList.add(
        "opened"
    );


    /*
        Scratch звук
    */

    playScratchSound();


    /*
        После анимации
        проверяем победу.
    */

    setTimeout(
        () => {

            checkWin();

        },
        300
    );


    updateGameStatus();
}


/* =====================================================
   СТАТУС
===================================================== */

function updateGameStatus() {

    statusText.textContent =
        "Открыто: " +
        openedCells +
        " / 9";


    freeInfo.textContent =
        "Бесплатно: " +
        freeCellsLeft;
}


/* =====================================================
   ПРОВЕРКА ТРЁХ ОДИНАКОВЫХ
===================================================== */

function checkWin() {

    if (
        gameFinished
    ) {
        return;
    }


    const cells =
        document.querySelectorAll(
            ".cell"
        );


    const openedValues = [];


    cells.forEach(
        (cell, index) => {

            if (
                cell.classList.contains(
                    "opened"
                )
            ) {

                openedValues.push(
                    board[index]
                );
            }

        }
    );


    /*
        Считаем количество
        каждого предмета.

        Позиция вообще
        не имеет значения.
    */

    const counts = {};


    openedValues.forEach(
        icon => {

            counts[icon] =
                (counts[icon] || 0) + 1;

        }
    );


    /*
        Если найдено 3 одинаковых
        в любых местах —
        победа.
    */

    for (
        const icon in counts
    ) {

        if (
            counts[icon] >= 3
        ) {

            finishWin(
                icon
            );

            return;
        }
    }


    /*
        Если открыты все 9
        и трёх одинаковых нет —
        проигрыш.
    */

    if (
        openedCells >= 9
    ) {

        finishLose();
    }
}


/* =====================================================
   ПОБЕДА
===================================================== */

function finishWin(icon) {

    gameFinished = true;

    ticketActive = false;


    balance +=
        WIN_REWARD;


    balance =
        Math.round(
            balance * 100
        ) / 100;


    updateBalance();


    modalTitle.textContent =
        "ПОБЕДА!";


    modalTitle.className =
        "modal-title win";


    modalText.innerHTML =
        "Вы нашли 3 одинаковых предмета<br>" +
        icon +
        " " +
        icon +
        " " +
        icon;


    modalMoney.textContent =
        "+" +
        WIN_REWARD;


    modalMoney.className =
        "modal-money win";


    modal.classList.add(
        "show"
    );


    createSparkles();
}


/* =====================================================
   ПРОИГРЫШ
===================================================== */

function finishLose() {

    gameFinished = true;

    ticketActive = false;


    modalTitle.textContent =
        "ПОПРОБУЙ СНОВА";


    modalTitle.className =
        "modal-title lose";


    modalText.innerHTML =
        "В этот раз трёх одинаковых<br>" +
        "предметов найти не удалось.";


    modalMoney.textContent =
        "0";


    modalMoney.className =
        "modal-money lose";


    modal.classList.add(
        "show"
    );
}


/* =====================================================
   ИГРАТЬ СНОВА
===================================================== */

againButton.addEventListener(
    "click",
    () => {

        modal.classList.remove(
            "show"
        );


        purchase.style.display =
            "block";


        game.classList.remove(
            "active"
        );


        ticketActive = false;


        openedCells = 0;


        freeCellsLeft =
            FREE_CELLS;


        updateGameStatus();
    }
);


/* =====================================================
   SCRATCH SOUND
===================================================== */

let audioContext = null;


function playScratchSound() {

    try {

        if (!audioContext) {

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        const buffer =
            audioContext.createBuffer(
                1,
                audioContext.sampleRate *
                0.08,
                audioContext.sampleRate
            );


        const data =
            buffer.getChannelData(0);


        for (
            let i = 0;
            i < data.length;
            i++
        ) {

            data[i] =
                (
                    Math.random() * 2 -
                    1
                ) *
                0.18;
        }


        const source =
            audioContext.createBufferSource();


        source.buffer =
            buffer;


        const filter =
            audioContext.createBiquadFilter();


        filter.type =
            "highpass";


        filter.frequency.value =
            900;


        const gain =
            audioContext.createGain();


        gain.gain.value =
            0.45;


        source
            .connect(filter)
            .connect(gain)
            .connect(
                audioContext.destination
            );


        source.start();

    } catch (error) {

        /*
            Если браузер
            заблокировал звук —
            игра всё равно работает.
        */

    }
}


/* =====================================================
   ИСКРЫ
===================================================== */

function createSparkles() {

    for (
        let i = 0;
        i < 35;
        i++
    ) {

        const spark =
            document.createElement(
                "div"
            );

        spark.className =
            "spark";


        spark.style.left =
            "50%";

        spark.style.top =
            "50%";


        const angle =
            Math.random() *
            Math.PI *
            2;


        const distance =
            80 +
            Math.random() *
            220;


        spark.style.setProperty(
            "--x",
            Math.cos(angle) *
            distance +
            "px"
        );


        spark.style.setProperty(
            "--y",
            Math.sin(angle) *
            distance +
            "px"
        );


        document.body.appendChild(
            spark
        );


        setTimeout(
            () => {

                spark.remove();

            },
            750
        );
    }
}


/* =====================================================
   ИНИЦИАЛИЗАЦИЯ
===================================================== */

updateBalance();

</script>

</body>
</html>
